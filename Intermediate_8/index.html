<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bit Manipulation Basics</title>
<style>
/* VOICE: a classroom instrument, calm and precise
   IDEA: a live circuit board: bits are bulbs, carries fly, the ALU decides the type
   PICTURE: each step is an animated player (play, pause, step, speed)
   COLOUR and TYPE: the original deep-navy lesson palette; system sans plus mono for bits
   LAYOUT: tabs per part, step list at the side, one stage per step */
:root,:root[data-theme=dark]{--bg:#0a0e1a;--cd:#151b2e;--bd:#2a3350;--tx:#e8ecf8;--mu:#8b95b5;--ac:#8b9cf8;--ye:#f5c84c;--gr:#5ed49a;--rd:#f07878;--cc:#0d1222;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f6fc;--cd:#fff;--bd:#d5dbee;--tx:#171c30;--mu:#5b6586;--ac:#4a5ce0;--ye:#b07d00;--gr:#17874f;--rd:#c23b3b;--cc:#eef1fa}}
:root[data-theme=light]{--bg:#f4f6fc;--cd:#fff;--bd:#d5dbee;--tx:#171c30;--mu:#5b6586;--ac:#4a5ce0;--ye:#b07d00;--gr:#17874f;--rd:#c23b3b;--cc:#eef1fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:clip}
body::before{content:"a ^ b";position:fixed;right:-2%;bottom:2%;font:800 clamp(40px,9vw,120px) ui-monospace,Menlo,monospace;color:var(--tx);opacity:.035;white-space:nowrap;pointer-events:none}
header{max-width:1180px;margin:auto;padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header small{color:var(--mu);font:12px ui-monospace,Menlo,monospace}header h1{font-size:22px;margin:2px 0}
.tg{background:var(--cd);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:9px 14px;cursor:pointer;font:inherit}
#tabs{max-width:1180px;margin:10px auto 0;padding:0 20px;display:flex;overflow-x:auto;border-bottom:1px solid var(--bd)}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:12px 14px;font:600 15px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
#tabs button.on{color:var(--tx);border-color:var(--ac)}#tabs i{font:normal 12px ui-monospace,Menlo,monospace;opacity:.7;margin-right:4px}
.wrap{max-width:1180px;margin:22px auto;padding:0 20px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px}
#side h3{margin:0 0 12px;color:var(--mu)}#side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--mu);border-radius:10px;padding:9px;font:inherit;cursor:pointer}
#side button.on{background:var(--cd);border-color:var(--bd);color:var(--tx);font-weight:600}
#side span{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;font-size:12px}
#side .on span{background:var(--ac);color:#0a0e1a}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:26px 28px;min-width:0}
.k{color:var(--ac);font:12px ui-monospace,Menlo,monospace;letter-spacing:.06em}
h2{font-size:clamp(28px,4.4vw,42px);line-height:1.1;margin:6px 0 14px;letter-spacing:-.02em}
.lead{color:var(--mu);margin:0 0 10px}
.think,.card2{border:2px solid var(--ac);border-radius:16px;padding:18px 20px;background:var(--cc);margin-bottom:14px}.card2{border:1px solid var(--bd)}
.tag{background:var(--ye);color:#1a1400;border-radius:6px;padding:2px 10px;font:700 12px ui-monospace,Menlo,monospace}
.think h3,.card2 h3{font-size:21px;margin:12px 0}
.btn{background:var(--ac);color:#0a0e1a;border:0;border-radius:10px;padding:10px 18px;font:700 15px system-ui,sans-serif;cursor:pointer;min-height:42px}.btn:disabled{opacity:.35;cursor:default}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px 14px;font:15px system-ui,sans-serif;cursor:pointer;min-height:42px}.ghost:disabled{opacity:.35;cursor:default}
.ans{border-top:1px dashed var(--bd);padding-top:12px;margin:6px 0 14px}.ans small{color:var(--gr);font:700 12px ui-monospace,monospace}
.ins{border-top:1px dashed var(--bd);margin-top:18px;padding-top:12px;color:var(--mu)}.ins small{color:var(--ye);font:700 12px ui-monospace,monospace}.ins p{margin:4px 0 0}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--bd);margin-top:20px;padding-top:16px;color:var(--mu);font:13px ui-monospace,monospace}
.code{background:var(--cc);border-radius:12px;padding:12px 0;margin:10px 0;font:14px/1.7 ui-monospace,Menlo,monospace;overflow-x:auto}
.code span{display:block;padding:0 16px;white-space:pre}.code i{color:var(--mu);margin-right:14px;font-style:normal}.code .hl{background:color-mix(in srgb,var(--ac) 22%,transparent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:center;background:var(--cd);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:12px;font:600 15px system-ui,sans-serif;cursor:pointer;text-align:left}
.opt b{background:var(--bd);border-radius:6px;padding:1px 8px;font-size:12px}.opt.good{border-color:var(--gr);background:color-mix(in srgb,var(--gr) 18%,var(--cd))}.opt.bad{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 18%,var(--cd))}
.qf{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid;font-size:15px;line-height:1.5}.qf.good{border-color:var(--gr);background:color-mix(in srgb,var(--gr) 14%,var(--cd))}.qf.bad{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 14%,var(--cd))}
.ex{color:var(--mu);margin:10px 0}.ex b{color:var(--tx)}
.stg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;font:700 11px ui-monospace,Menlo,monospace;color:var(--mu);align-items:center}.stg span{padding:3px 9px;border-radius:12px;border:1px solid var(--bd)}.stg .on{background:var(--ye);color:#1a1400;border-color:var(--ye)}
.bt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}.bt label{color:var(--mu)}
.inp{background:var(--cc);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 10px;font:16px ui-monospace,Menlo,monospace;width:140px}
:focus-visible{outline:2px solid var(--ye);outline-offset:2px}

/* ---------- stage + cells ---------- */
.stage{overflow-x:auto;padding:26px 4px 26px;margin:4px 0}
.rw{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.rw.gap{margin-bottom:26px}.rw.sum{border-top:2px solid var(--bd);padding-top:10px}
.lb{flex:none;width:92px;text-align:right;color:var(--mu);font:12px ui-monospace,Menlo,monospace}
.cells{display:flex;gap:8px;flex-wrap:nowrap}
.cell,.bulb{position:relative;flex:none;width:52px;height:54px;display:grid;place-items:center;border:2px solid var(--bd);border-radius:10px;background:var(--cc);color:var(--tx);transition:border-color .25s,background .25s,box-shadow .25s}
.cell b,.bulb b{font:700 20px ui-monospace,Menlo,monospace}
.cell small,.bulb small{position:absolute;bottom:-19px;left:-6px;right:-6px;text-align:center;color:var(--mu);font:10px ui-monospace,monospace}
.cell u,.bulb u{position:absolute;top:-21px;left:-8px;right:-8px;text-align:center;text-decoration:none;color:var(--ye);font:700 11px ui-monospace,monospace}
u.neg{color:var(--rd)!important}
.cell.dim b{opacity:.3}.cell.emp{border-style:dashed;opacity:.45}.cell.blank{border-color:transparent;background:none}
.cell.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 24%,var(--cc));box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
.cell.sw{border-color:var(--gr)}
.cell.lit,.bulb.lit{background:color-mix(in srgb,var(--ye) 26%,var(--cc));border-color:var(--ye)}
.bulb{cursor:pointer;font:inherit;height:58px}
.bulb.lit{box-shadow:0 0 18px color-mix(in srgb,var(--ye) 45%,transparent)}
.cell.cy b{color:var(--ye)}
.msg{border-left:4px solid var(--ac);background:var(--cc);border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0;min-height:46px;animation:fadeUp .35s}
.okb{color:var(--gr);font-weight:700}
.big{font:800 clamp(28px,5vw,42px) ui-monospace,Menlo,monospace;margin:14px 0}

/* ---------- player controls ---------- */
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 4px;padding-top:12px;border-top:1px dashed var(--bd)}
.prog{flex:1 1 80px;height:6px;background:var(--bd);border-radius:3px;overflow:hidden;min-width:60px}.prog i{display:block;height:100%;background:var(--ac);transition:width .3s}
.pk{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.chip{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:20px;padding:7px 14px;font:600 14px ui-monospace,Menlo,monospace;cursor:pointer;min-height:38px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#0a0e1a}

/* ---------- place value ---------- */
.pvc{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding:6px 2px 4px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:78px}
.wchip{font:700 12px ui-monospace,monospace;color:var(--ye);white-space:nowrap}
.arr{color:var(--mu);height:20px}
.prod{min-width:70px;padding:6px 8px;border-radius:8px;border:1px dashed var(--bd);text-align:center;font:700 16px ui-monospace,monospace;color:var(--mu)}
.prod.on{border-style:solid;border-color:var(--gr);color:var(--tx)}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--bd);margin:12px 0 4px}.bar i{display:block;height:100%;animation:grow-x .6s ease-out both;transform-origin:left}
/* ---------- ladder ---------- */
.ladw{position:relative;max-width:440px;margin:8px 0;padding-right:44px}
.lad{display:grid;grid-template-columns:40px 60px 1fr 40px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font:17px ui-monospace,Menlo,monospace}
.lad .dv{color:var(--mu)}
.rem{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#0a0e1a;font-weight:800}
.upar{position:absolute;right:10px;top:8px;bottom:8px;width:4px;background:var(--ye);border-radius:2px;transform-origin:bottom;animation:grow-y .9s ease-out both}
.upar::before{content:"";position:absolute;top:-8px;left:-6px;border:8px solid transparent;border-bottom-color:var(--ye);border-top:0}
/* ---------- gates ---------- */
.gate{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.tw{display:flex;flex-direction:column;align-items:center;gap:4px}.tw small{color:var(--mu);font:11px ui-monospace,monospace}
.tgl{width:62px;height:62px;border-radius:14px;border:2px solid var(--bd);background:var(--cc);color:var(--tx);font:800 26px ui-monospace,monospace;cursor:pointer;transition:all .2s}
.tgl.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 28%,var(--cc))}
.opbox{font:800 26px ui-monospace,monospace;color:var(--ac)}
.lamp{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:800 26px ui-monospace,monospace;border:2px solid var(--bd);background:var(--cc);transition:all .3s}
.lamp.on{background:var(--ye);color:#1a1400;border-color:var(--ye);box-shadow:0 0 28px var(--ye)}
.tt{border-collapse:collapse;font:15px ui-monospace,monospace;margin:8px 0}.tt td,.tt th{padding:6px 16px;border-bottom:1px solid var(--bd);text-align:center}.tt th{color:var(--mu);font-weight:600}.tt tr.cur{background:color-mix(in srgb,var(--ac) 20%,transparent)}
/* ---------- boxes (ALU, adder) ---------- */
.flow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin:12px 0}
.box{border:2px solid var(--bd);border-radius:14px;padding:10px 14px;background:var(--cc);min-width:128px;text-align:center;transition:opacity .3s,border-color .3s;opacity:.28;display:flex;flex-direction:column;justify-content:center;gap:2px}
.box.on{opacity:1}.box.hot{border-color:var(--ac)}.box.bad{border-color:var(--rd)}.box.ok{border-color:var(--gr)}
.box small{display:block;color:var(--mu);font:11px ui-monospace,monospace}
.box b{font:700 17px ui-monospace,monospace}
.box.bad b{color:var(--rd)}.box.ok b{color:var(--gr)}
.ty{display:inline-block;padding:1px 8px;border-radius:6px;font:700 11px ui-monospace,monospace;margin-left:4px;vertical-align:middle}.ty.int{background:var(--ac);color:#0a0e1a}.ty.long{background:var(--gr);color:#0a0e1a}
.fa{align-self:center;color:var(--mu);font-size:22px}
/* ---------- number line ---------- */
.nl{display:flex;gap:6px;padding:6px 0 4px;overflow-x:auto}
.slot{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:6px}
.slot .pt{height:36px;width:56px;border:2px dashed var(--bd);border-radius:8px;display:grid;place-items:center;font:700 13px ui-monospace,monospace}
.slot .pt.f{border-style:solid;border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--cc))}
.slot .pt.f.ng{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 15%,var(--cc))}
.slot span{font:700 14px ui-monospace,monospace;border-top:2px solid var(--bd);width:100%;text-align:center;padding-top:4px}
.slot.min .pt{box-shadow:0 0 0 3px var(--rd)}.slot.max .pt{box-shadow:0 0 0 3px var(--gr)}
.dg{display:inline-flex;flex-direction:column;align-items:center;margin:0 1px}.dg b{font:800 clamp(20px,3.4vw,30px) ui-monospace,monospace}.dg small{color:var(--ye);font:700 10px ui-monospace,monospace;min-height:14px}
/* ---------- tank ---------- */
.tankw{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin:10px 0}
.tank{position:relative;width:96px;height:180px;border:3px solid var(--bd);border-top:none;border-radius:0 0 14px 14px;background:var(--cc)}
.tank i{position:absolute;left:0;right:0;bottom:0;background:var(--ac);border-radius:0 0 10px 10px;animation:fill .8s cubic-bezier(.3,1.3,.6,1) both}
.tank.over{border-color:var(--rd)}.tank.over i{background:var(--rd)}
.tank .lim{position:absolute;left:-10px;right:-10px;top:0;border-top:2px dashed var(--rd)}
.tank .lim::after{content:"int limit";position:absolute;right:-4px;top:-18px;font:10px ui-monospace,monospace;color:var(--rd)}
.tcap{text-align:center;color:var(--mu);font:12px ui-monospace,monospace;margin-top:6px}
.hist{flex:1 1 260px}.hist .r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px;animation:fadeUp .35s}

/* ---------- motion ---------- */
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:none;opacity:1}}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
@keyframes fly{0%{transform:translate(60px,16px) scale(.5);opacity:.1}100%{transform:none;opacity:1}}
@keyframes drop{0%{transform:translateY(-36px);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 70%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fill{from{height:var(--h0)}to{height:var(--h)}}
.pop{animation:pop .45s ease-out both}.flip{animation:flip .5s ease-out both}.fly{animation:fly .65s ease-out both}.drop{animation:drop .45s ease-out both}.shake{animation:shake .5s}.pulse{animation:pulse 1s ease-out}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media(max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}#side{display:flex;gap:6px;overflow-x:auto}#side h3{display:none}#side button{white-space:nowrap;width:auto}.card{padding:18px}.lb{width:64px}}
</style></head><body>
<header><div><small>INTERMEDIATE DSA · CLASS 8</small><h1>Bit Manipulation Basics</h1></div>
<button class="tg" id="tn"></button></header>
<nav id="tabs"></nav>
<div class="wrap"><aside id="side"></aside>
<section class="card" id="card"><div id="main"></div>
<div class="nav"><button class="ghost" id="bk">‹ Back</button><span>← → change step · Space plays</span><button class="btn" id="nx">Next ›</button></div></section></div>
<script>
const $=s=>document.querySelector(s);
let T=0,S=0,notes=true,rev={},st={sa:92,sb:154,sd:251,ca:1,cb:1},timer=null,playK=null,pm=0,pms=0;
const SPD=[1800,1100,560];
const fmt=x=>x.toLocaleString('en-US');
const bits=(n,w)=>(n>>>0).toString(2).padStart(w,'0').slice(-w);
const wrap=x=>Number(BigInt.asIntN(32,BigInt(x)));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const X=s=>esc(s).split('\n');
const code=(l,h)=>'<pre class="code">'+l.map((x,i)=>`<span class="${i==h?'hl':''}"><i>${i+1}</i>${x}</span>`).join('')+'</pre>';
const C=(v,cls='',top='',sub='',sty='')=>`<div class="cell ${cls}"${sty?` style="${sty}"`:''}>${top!==''?`<u class="${String(top).startsWith('−')?'neg':''}">${top}</u>`:''}<b>${v}</b>${sub!==''?`<small>${sub}</small>`:''}</div>`;
const R=(lab,a,cls='')=>`<div class="rw ${cls}"><span class="lb">${lab}</span><div class="cells">${a.join('')}</div></div>`;
const msg=t=>`<div class="msg">${t}</div>`;
const dl=i=>`animation-delay:${i*70}ms`;

/* ---------- player engine ---------- */
function stopPlay(){clearInterval(timer);timer=null;playK=null}
function adv(k){st[k+'_p']=st[k]??0;st[k]=(st[k]??0)+1;if(st[k]>=pm){st[k]=pm;stopPlay()}go()}
function play(k,max,ms){if(playK===k){stopPlay();go();return}stopPlay();if((st[k]??0)>=max){st[k]=0}playK=k;pm=max;pms=ms||0;adv(k);if(playK)timer=setInterval(()=>adv(k),pms||SPD[st.spd??1])}
function stepTo(k,v){stopPlay();st[k+'_p']=st[k]??0;st[k]=v;go()}
function cycleSpd(){st.spd=((st.spd??1)+1)%3;if(playK&&!pms){clearInterval(timer);const k=playK;timer=setInterval(()=>adv(k),SPD[st.spd])}go()}
function tog(k,j){stopPlay();const v=st[k]??0;st[k+'_p']=v;st[k]=v^(1<<(7-j));go()}
const ctl=(k,max,o={})=>{const v=st[k]??0,on=playK===k;return `<div class="ctl"><button class="ghost" title="Reset" aria-label="Reset" onclick="stepTo('${k}',0)">⟲</button><button class="ghost" aria-label="Step back" ${v<=0?'disabled':''} onclick="stepTo('${k}',${Math.max(0,v-1)})">‹</button><button class="btn play" onclick="play('${k}',${max}${o.ms?','+o.ms:''})">${on?'❚❚ Pause':v>=max?'↻ Replay':v?'▶ Resume':'▶ '+(o.lab||'Play')}</button><button class="ghost" ${v>=max?'disabled':''} onclick="stepTo('${k}',${v+1})">${o.step||'Step'} ›</button><span class="prog"><i style="width:${v/max*100}%"></i></span><span class="ex">${v} / ${max}</span>${o.ms?'':`<button class="ghost" title="Speed" onclick="cycleSpd()">${['0.5×','1×','2×'][st.spd??1]}</button>`}</div>`};
const pick=(k,labels,rk)=>`<div class="pk">${labels.map((l,i)=>`<button class="chip ${i==(st[k]??0)?'on':''}" onclick="stopPlay();st['${k}']=${i};${rk?`st['${rk}']=0;st['${rk}_p']=0;`:''}go()">${l}</button>`).join('')}</div>`;
const bulbs=(k,top,sub)=>{const v=st[k]??0,p=st[k+'_p']??v,b=bits(v,8),pb=bits(p,8);return `<div class="stage"><div class="cells">${[...b].map((d,j)=>{const t=top?top(j):'';return `<button class="bulb ${d=='1'?'lit':''} ${d!=pb[j]?'flip':''}" onclick="tog('${k}',${j})" aria-label="bit ${7-j}, now ${d}">${top?`<u class="${t<0?'neg':''}">${t<0?'−'+(-t):t}</u>`:''}<b>${d}</b><small>${sub?sub(j):'bit '+(7-j)}</small></button>`}).join('')}</div></div>`};
const tgl=(k,l,v)=>`<div class="tw"><button class="tgl ${v?'on':''}" onclick="st['${k}']=${v?0:1};go()" aria-label="${l} = ${v}, click to flip">${v}</button><small>${l}</small></div>`;

/* ---------- lesson building blocks ---------- */
const W=(h,lead,r,n)=>({h,lead,r,n});
const ST=(t,s)=>(s.st=t,s);

{c:'long c = (long)(a * b)',aT:'int',cT:'long',cast:1,why:'The cast happens after a * b has already overflowed. Casting a wrong value to long keeps it wrong.'},

function aluw(){const t=TR[st.tri??0],v=st.trj??0,max=4,ok=t.aT=='long',Wv=wrap(1e11),res=ok?1e11:Wv;const ty=x=>`<span class="ty ${x}">${x}</span>`,an=i=>v==i?' pop':'';
const flow=`<div class="flow">
<div class="box ${v>=1?'on':''}${an(1)}"><small>operands</small><b>a = 100,000 ${ty(t.aT)}</b><b>b = 1,000,000 ${ty('int')}</b>${ok?'<small>(long) cast applied to a first</small>':''}</div><span class="fa">→</span>
<div class="box ${v>=2?'on hot':''}${an(2)}"><small>ALU</small><b>${t.aT} × int</b><small>computes in ${ok?'long (64 bits)':'int (32 bits)'}</small></div><span class="fa">→</span>
<div class="box ${v>=3?'on '+(ok?'ok':'bad'):''}${v==3&&!ok?' shake':an(3)}"><small>result of a × b</small><b>${fmt(res)}</b><small>${ok?'10^11 fits ✓':'10^11 overflowed: wrong value'}</small></div><span class="fa">→</span>
<div class="box ${v>=4?'on '+(ok?'ok':'bad'):''}${an(4)}"><small>${t.cast?'(long) cast, then ':''}stored in c ${ty(t.cT)}</small><b>c = ${fmt(res)}</b><small>${ok?'WORKS ✓':'FAILS ✗'}</small></div></div>`;
const m=[`a = 10^5 and b = 10^6 are ints. The true answer is 10^11. Press Play to follow the value through the machine.`,ok?'(long) a turns a into a long <b>before</b> the multiplication.':'Both operands reach the ALU as <b>int</b>.',`The ALU picks the result type from its operands: ${ok?'<b>long × int → long</b>':'<b>int × int → int</b>'}.`,ok?'10^11 is far below the long limit (~10^18), so the value is correct.':`10^11 is above the int limit (~2 × 10^9), so it overflows <b>inside the ALU</b> and becomes ${fmt(Wv)}.`,t.why][v];
return pick('tri',['Try 1','Try 2','Try 3','Try 4'],'trj')+code([t.c])+flow+msg(m)+ctl('trj',max)}

/* 7 · sum tank */
const CK=[1,1000,2147,2148,100000],MX=2147483647;
const SUMC=X('int sum = 0;\nfor (int i = 0; i < N; i++) {\n    sum = sum + A[i];\n}\nprint(sum)'),SUML=X('long sum = 0;\nfor (int i = 0; i < N; i++) {\n    sum = sum + A[i];\n}\nprint(sum)');
function smw(){const v=st.smj??0,max=6,pv=st.smj_p??0,f=i=>Math.min(i*1e6/MX,1)*100,i=v>=1?CK[Math.min(v,5)-1]:0,i0=pv>=1&&pv<=5?CK[pv-1]:0,s=i*1e6,ov=s>MX;
const hist=CK.slice(0,Math.min(v,5)).map(n=>{const s=n*1e6,o=s<=MX;return `<div class="r"><span>after ${fmt(n)} elements: ${fmt(s)}</span><b style="color:var(--${o?'gr':'rd'})">${o?'fits':'overflow → '+fmt(wrap(s))}</b></div>`}).join('');
const m=v==0?`Worst case: every A[i] = 10^6. After i elements the sum is i × 10^6. The int tank holds at most ${fmt(MX)}. Press Play to fill it.`:v<=5?(ov?`<b>Overflow!</b> ${fmt(s)} does not fit in an int, so sum holds a wrong value: ${fmt(wrap(s))}.`:`${fmt(s)} still fits in an int${i==2147?', but only just':''}.`):`Read the constraints first: max sum = N × max(A[i]) = 10^5 × 10^6 = <b>10^11</b>. That is beyond int (~10^9) but well inside long (~10^18). Fix: make <b>sum</b> a long.`;
return `<p class="ex">Constraints: 1 ≤ N ≤ 10^5, 1 ≤ A[i] ≤ 10^6.</p>`+code(v>=6?SUML:SUMC,0)+`<div class="tankw"><div><div class="tank ${ov?'over':''} ${ov&&v==4?'shake':''}"><div class="lim"></div><i style="--h0:${f(i0)}%;--h:${f(i)}%;height:${f(i)}%"></i></div><div class="tcap">int sum</div></div><div class="hist">${hist}</div></div>`+msg(m)+ctl('smj',max,{lab:'Add elements'})}

/* ================= RENDER ================= */
function go(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;
$('#tn').textContent='Instructor notes: '+(notes?'on':'off');
$('#tabs').innerHTML=TABS.map((x,i)=>`<button class="${i==T?'on':''}" onclick="nav(${i},0)"><i>0${i}</i>${x.t}</button>`).join('');
$('#side').innerHTML=`<h3>${tb.t}</h3>`+tb.s.map((x,i)=>`<button class="${i==S?'on':''}" onclick="nav(T,${i})"><span>${i+1}</span>${x.h}</button>`).join('');
$('#main').innerHTML=`<small class="k">${tb.t.toUpperCase()} · STEP ${S+1} OF ${tb.s.length}</small>${tb.s.every(x=>x.st)?`<div class="stg">${[...new Set(tb.s.map(x=>x.st))].map(g=>`<span class="${g==s.st?'on':''}">${g}</span>`).join('›')}</div>`:''}<h2>${s.h}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:''}${s.r(k)}${notes&&s.n?`<div class="ins"><small>INSTRUCTOR</small><p>${s.n}</p></div>`:''}`;
const last=S==tb.s.length-1,nt=TABS[T+1];
$('#nx').textContent=s.th&&!rev[k]?'Reveal the answer ›':last?(nt?'Next: '+nt.t+' ›':'Done'):'Next ›';
$('#nx').disabled=last&&!nt&&!(s.th&&!rev[k]);$('#bk').disabled=!T&&!S}
function nav(t,s){stopPlay();T=t;S=s;go();const c=$('#card');if(c.getBoundingClientRect().top<0)c.scrollIntoView({behavior:'smooth'})}
function nx(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;if(s.th&&!rev[k]){rev[k]=1;go()}else if(S<tb.s.length-1)nav(T,S+1);else if(T<TABS.length-1)nav(T+1,0)}
function bk(){if(S)nav(T,S-1);else if(T)nav(T-1,TABS[T-1].s.length-1)}
$('#nx').onclick=nx;$('#bk').onclick=bk;$('#tn').onclick=()=>{notes=!notes;go()};
addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg=='INPUT')return;if(e.key=='ArrowRight')nx();else if(e.key=='ArrowLeft')bk();else if(e.key==' '&&tg!='BUTTON'){const p=$('#main .play');if(p){e.preventDefault();p.click()}}});
go();
