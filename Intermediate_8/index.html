<header><div><small>INTERMEDIATE DSA · CLASS 8</small><h1>Bit Manipulation Basics</h1></div>
<button class="tg" id="tn" onclick="notes=!notes;go()"></button></header>

<div class="wrap"><aside id="side"></aside>

<script>
const $=s=>document.querySelector(s);let T=0,S=0,notes=true,rev={},st={};
const code=(l,h)=>'<pre class="code" style="margin:10px 0">'+l.map((x,i)=>`<span class="${i==h?'hl':''}"><i>${i+1}</i>${x}</span>`).join('')+'</pre>';
const cells=(a,m={},c={})=>`<div class="cells">${a.map((v,j)=>`<div class="cell ${c[j]||''}">${m[j]?`<u>${m[j]}</u>`:''}<b>${v}</b><small>[${j}]</small></div>`).join('')}</div>`;
const cards=a=>`<div class="g">${a.map(x=>`<div class="cd"><small>${x[0]}</small><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`;
const W=(h,n,r)=>({h,n,r}),info=(h,b,n)=>W(h,n,()=>b);
const think=(h,q,a,n)=>({h,n,th:1,r:k=>`<div class="think"><span class="tag">THINK FIRST</span><h3>${q}</h3><button class="btn" onclick="rev['${k}']=!rev['${k}'];go()">${rev[k]?'Hide':'Reveal'} the answer</button></div>`+(rev[k]?`<div class="ans"><small>ANSWER</small><p>${a}</p></div>`:'')});
const pickQ=(k,i,ok)=>{if(st[k]===ok)return;const t=st[k+'w']||[];if(i!==ok&&!t.includes(i))t.push(i);st[k+'w']=t;st[k]=i;st[k+'a']=(st[k+'a']||0)+1;go()};
const quiz=(h,q,c,o,ok,why,n)=>W(h,n,k=>{const R=Array.isArray(why)?why:o.map((_,i)=>i==ok?why:'This option does not match. Re-read the question and try again.'),s=st[k],t=st[k+'w']||[],done=s===ok,at=st[k+'a']||0;
return `<div class="card2"><small class="k">QUIZ</small><h3>${q}</h3>${c?code(c):''}<div class="opts">${o.map((x,i)=>`<button class="opt ${done&&i==ok?'good':t.includes(i)?'bad':''}" ${done?'disabled':''} onclick="pickQ('${k}',${i},${ok})"><b>${'ABCD'[i]}</b>${x}</button>`).join('')}</div>`+(s==null?'':done?`<div class="qf good"><b>✓ Correct${at>1?' (after '+at+' tries)':' on the first try'}.</b> ${R[ok]}</div>`:`<div class="qf bad"><b>✗ Option ${'ABCD'[s]} is not right.</b> ${R[s]}<div class="bt"><button class="btn" onclick="st['${k}']=null;go()">Try again</button></div></div>`)+`</div>`});
const sorter=(h,items,L,tail,n)=>W(h,n,k=>`<div class="card2">${items.map((t,i)=>{const v=st[k+i];return `<div class="row"><span>${t[0]}</span>${L.map((l,x)=>`<button class="opt sm ${v!=null&&x==t[1]?'good':v==x?'bad':''}" onclick="st['${k}${i}']=${x};go()">${l}</button>`).join('')}</div>`}).join('')}${items.every((_,i)=>st[k+i]!=null)?`<p class="ex"><b>${tail}</b></p>`:''}</div>`);
const set=(f,v)=>`${f};go()`;
const X=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n');
const ST=(t,s)=>(s.st=t,s);
const walk=(h,q,c,S_,ans)=>W(h,0,k=>{const v=st[k]??0;return `<div class="card2"><small class="k">WORK IT OUT</small><h3>${q}</h3>${c?code(X(c)):''}${S_.slice(0,v).map((s,i)=>`<div class="row"><span style="flex:0 0 26px"><b>${i+1}</b></span><span><b>${s[0]}</b><br>${s[1]}</span></div>`).join('')}${v>=S_.length?`<p class="ex"><b>Answer: ${ans}</b></p>`:''}<div class="bt"><button class="btn" ${v>=S_.length?'disabled':''} onclick="${set(`st['${k}']=(st['${k}']??0)+1`)}">${v?'Next step':'Show step 1'}</button><button class="ghost" onclick="${set(`st['${k}']=0`)}">Reset</button><span class="ex">${v} / ${S_.length}</span></div></div>`});
const sl=(k,min,max,d,l)=>`<label>${l} = <b>${st[k]??d}</b> <input type="range" min="${min}" max="${max}" value="${st[k]??d}" onchange="st.${k}=+this.value;go()"></label>`;
const btn=(k,max,first,nxt)=>{const v=st[k]??0;return `<div class="bt"><button class="btn" ${v>=max?'disabled':''} onclick="${set(`st.${k}=(st.${k}??0)+1`)}">${v?nxt:first}</button><button class="ghost" onclick="${set(`st.${k}=0`)}">Reset</button><span class="ex">${v} / ${max}</span></div>`};
const pick=(k,labels)=>`<div class="bt">${labels.map((l,i)=>`<button class="${i==(st[k]??0)?'btn':'ghost'}" onclick="${set(`st.${k}=${i};st.${k}j=0`)}">${l}</button>`).join('')}</div>`;
const rvl=(k,items)=>{const v=st[k]??0;return items.slice(0,v).map(x=>`<div class="card2" style="padding:10px 14px;margin:8px 0"><small class="k">${x[0]}</small><br><b>${x[1]}</b>${x[2]?`<br><span class="ex">${x[2]}</span>`:''}</div>`).join('')+btn(k,items.length,'Reveal first','Reveal next')};
const sl2=(k,min,max,d,l,rs)=>`<label>${l} = <b>${st[k]??d}</b> <input type="range" min="${min}" max="${max}" value="${st[k]??d}" onchange="st.${k}=+this.value;${rs};go()"></label>`;
const bits=(n,w)=>(n>>>0).toString(2).padStart(w,'0').slice(-w);
const wrap=x=>Number(BigInt.asIntN(32,BigInt(x))),fmt=x=>Number(x).toLocaleString('en-US');
const PV=[{b:10,s:'342'},{b:2,s:'110'},{b:2,s:'1011'},{b:2,s:'1101'},{b:2,s:'10101'}];
const pvw=()=>{const p=PV[st.pv??0],d=p.s.split(''),n=d.length,v=st.pvj??0,cl={},m={};let tot=0,h='';
for(let t=0;t<v;t++){const i=n-1-t,val=+d[i]*p.b**t;tot+=val;cl[i]=t==v-1?'sw sel':'sw';m[i]=p.b+'^'+t;h+=`<div class="row"><span>${d[i]} × ${p.b}^${t}</span><b>${val}</b></div>`}
return pick('pv',PV.map(x=>`${x.s} (base ${x.b})`))+cells(d,m,cl)+`<p class="ex">${v?`Position ${v-1} from the right has weight ${p.b}^${v-1} = ${p.b**(v-1)}. Multiply the digit by it, then add.`:'Every digit has a position, counted from the right starting at 0. Press the button to start with the rightmost digit.'}</p>`+h+`<p class="ex">Running total: <b>${tot}</b>${v>=n?` · <b>${p.s} in base ${p.b} = ${tot}</b>`:''}</p>`+btn('pvj',n,'Rightmost digit','Next digit')};
const DN=[20,45,13];
const d2bw=()=>{const n0=DN[st.db??0],v=st.dbj??0,S=[];let n=n0;while(n>0){S.push({n,q:n>>1,r:n&1});n>>=1}
const K=S.length,sh=Math.min(v,K),rem=S.slice(0,sh).map(s=>s.r);let h='';S.slice(0,sh).forEach(s=>h+=`<div class="row"><span>${s.n} ÷ 2 = ${s.q}</span><b>remainder ${s.r}</b></div>`);
const last=sh?S[sh-1]:null;
return pick('db',DN.map(String))+`<p class="ex">${!v?'Divide by 2 again and again, writing down each remainder, until the quotient is 0.':v>K?'Now read the remainders from the last one to the first.':last.q==0?`${last.n} ÷ 2 = 0 with remainder ${last.r}. The quotient is 0, so we stop dividing.`:`${last.n} ÷ 2 = ${last.q} with remainder ${last.r}. Keep going with ${last.q}.`}</p>`+h+(sh?`<p class="ex">Remainders in the order found:</p>`+cells(rem):'')+(v>K?`<p class="ex">Read bottom to top:</p>`+cells([...rem].reverse(),{},Object.fromEntries(rem.map((_,i)=>[i,'sw'])))+`<p class="ex"><b>${n0} = ${n0.toString(2)} in binary</b></p>`:'')+btn('dbj',K+1,'First division','Next')};
const AD=[{b:10,x:'368',y:'253'},{b:2,x:'10101',y:'1101'},{b:2,x:'110101',y:'100110'},{b:2,x:'10110',y:'00111'}];
const addw=()=>{const p=AD[st.ad??0],B=p.b,L=Math.max(p.x.length,p.y.length),x=p.x.padStart(L,'0'),y=p.y.padStart(L,'0'),v=st.adj??0,cols=[];let c=0;
for(let i=L-1;i>=0;i--){const t=+x[i]+ +y[i]+c,c2=Math.floor(t/B);cols.push({i,a:+x[i],b:+y[i],c,t,d:t%B,c2});c=c2}
const ex=c>0?1:0,K=L+ex,sh=Math.min(v,K),R=Array(L+1).fill('·'),C=Array(L+1).fill('·'),cl={};
cols.slice(0,Math.min(sh,L)).forEach(o=>{R[o.i+1]=o.d;C[o.i]=o.c2});const cur=sh>0&&sh<=L?cols[sh-1]:null;if(cur)cl[cur.i+1]='sel';if(sh>L){R[0]=c;cl[0]='sw sel'}
const res=(ex?c:'')+cols.map(o=>o.d).reverse().join('');
const msg=cur?`Column ${sh} from the right: ${cur.a} + ${cur.b} + carry ${cur.c} = ${cur.t}. Digit = ${cur.t} % ${B} = <b>${cur.d}</b>, carry = ${cur.t} / ${B} = <b>${cur.c2}</b>.`:sh>L?`A carry of ${c} is left over, so write it at the front.`:'Add from the rightmost column, carrying to the left. Press the button for the first column.';
const dn=sh>=K,A_=parseInt(p.x,B),B_=parseInt(p.y,B);
return pick('ad',AD.map(q=>`${q.x} + ${q.y}${q.b==10?'':' (binary)'}`))+`<p class="ex">carry</p>`+cells(C,{},{})+`<p class="ex">first number</p>`+cells([' ',...x.split('')],{},cl)+`<p class="ex">second number</p>`+cells([' ',...y.split('')],{},cl)+`<p class="ex">sum</p>`+cells(R,{},cl)+`<p class="ex">${msg}</p>`+(dn?`<p class="ex"><b>${p.x} + ${p.y} = ${res}</b> · check in decimal: ${A_} + ${B_} = ${A_+B_} = ${parseInt(res,B)} ✓</p>`:'')+btn('adj',K,'First column','Next column')};
const OPS={AND:['&',(a,b)=>a&b,'1 only if both bits are 1'],OR:['|',(a,b)=>a|b,'1 if either bit, or both, is 1'],XOR:['^',(a,b)=>a^b,'1 if the two bits are different'],NOT:['~',a=>a^1,'the opposite of the input bit']};
const ttw=()=>{const nm=Object.keys(OPS)[st.tt??0],[sy,f,rule]=OPS[nm],rows=nm=='NOT'?[[0],[1]]:[[0,0],[0,1],[1,0],[1,1]],v=st.ttj??0;
return pick('tt',Object.keys(OPS))+rows.slice(0,v).map(r=>`<div class="row"><span>${nm=='NOT'?sy+r[0]:r[0]+' '+sy+' '+r[1]}</span><b>= ${f(...r)}</b></div>`).join('')+`<p class="ex">${v>=rows.length?`Rule: the result bit is <b>${rule}</b>.`:'Press the button to try the first input. Bits: 0 = unset/false, 1 = set/true.'}</p>`+btn('ttj',rows.length,'First input','Next input')};
const BX=[{o:'&',a:5,b:6,w:3},{o:'&',a:20,b:45,w:6},{o:'|',a:92,b:154,w:8},{o:'~',a:92,w:8},{o:'^',a:92,b:154,w:8}];
const bxw=()=>{const e=BX[st.bx??0],v=st.bxj??0,w=e.w,bin=e.b!=null,A=bits(e.a,w).split(''),Bb=bin?bits(e.b,w).split(''):null,f={'&':(x,y)=>x&y,'|':(x,y)=>x|y,'^':(x,y)=>x^y,'~':x=>x^1}[e.o],R=A.map((x,i)=>f(+x,bin?+Bb[i]:0)),sh=v>=2?Math.min(v-1,w):0,col=v>=2&&v<=w+1?v-2:-1,cl=col>=0?{[col]:'sel'}:{},rule={'&':'both 1 → 1, otherwise 0','|':'any 1 → 1, otherwise 0','^':'different → 1, same → 0','~':'flip the bit'}[e.o],val=parseInt(R.join(''),2),parts=R.map((b,i)=>b==1?2**(w-1-i):0).filter(z=>z);
const msg=v==0?'Start from the decimal numbers. Bitwise operators work on the bits, so convert first.':v==1?`Both numbers in binary with ${w} bits, so the columns line up.`:col>=0?`Column ${col+1} from the left: ${bin?A[col]+' '+e.o+' '+Bb[col]:e.o+A[col]} = <b>${R[col]}</b> (${rule}).`:`Add the weights of the 1s: ${parts.join(' + ')||0} = <b>${val}</b>.`;
return pick('bx',BX.map(q=>q.o=='~'?`~${q.a}`:`${q.a} ${q.o} ${q.b}`))+(v==0?`<p class="ex"><b>${bin?e.a+' '+e.o+' '+e.b:'~'+e.a}</b></p>`:`<p class="ex">${e.a}</p>`+cells(A,{},cl)+(bin?`<p class="ex">${e.b}</p>`+cells(Bb,{},cl):'')+`<p class="ex">result</p>`+cells(R.map((b,i)=>i<sh?b:'·'),{},cl))+`<p class="ex">${msg}</p>`+(v>w+1?`<p class="ex"><b>${bin?e.a+' '+e.o+' '+e.b:'~'+e.a} = ${val}</b>${e.o=='~'?' (read as an unsigned 8-bit number)':''}</p>`:'')+btn('bxj',w+2,'Convert to binary','Next')};
const NG=[-5,-3,-12];
const ngw=()=>{const n=NG[st.ng??0],v=st.ngj??0,ab=bits(-n,8).split(''),inv=ab.map(b=>b^1),fin=bits(n,8).split(''),sh=v>=2?Math.min(v-1,8):0,cl=v>=2&&v<=9?{[v-2]:'sel'}:{};
const pos=parseInt(fin.slice(1).join(''),2);
const msg=[`Convert ${n} to 8-bit two’s complement in three steps: binary of |${n}|, invert, add 1.`,`Step 1: |${n}| = ${-n} in 8-bit binary is <b>${ab.join('')}</b>.`,'','','','','','','','',`Step 3: add 1: ${inv.join('')} + 1 = <b>${fin.join('')}</b>. The trailing 1s turn to 0 and the first 0 from the right turns to 1.`,`Check: the leftmost bit has weight −128. −128 × 1 + ${pos} = <b>${-128+pos}</b> = ${n} ✓. A leading 1 means negative.`][v]||`Step 2: invert bit ${v-1} from the left: ${ab[v-2]} → <b>${inv[v-2]}</b>.`;
return pick('ng',NG.map(String))+(v>=1?`<p class="ex">|${n}| in binary</p>`+cells(ab,{},cl):'')+(v>=2?`<p class="ex">inverted</p>`+cells(inv.map((b,i)=>i<sh?b:'·'),{},cl):'')+(v>=10?`<p class="ex">plus 1</p>`+cells(fin,{},Object.fromEntries(fin.map((_,i)=>[i,'sw']))):'')+`<p class="ex">${msg}</p>`+btn('ngj',11,'Start','Next')};
const rgw=()=>{const n=st.rn??3,N=2**n,v=Math.min(st.rgj??0,N);let h='';for(let k=0;k<v;k++){const s=k>=N/2?k-N:k,c=v==N&&s==-N/2?'rd':v==N&&s==N/2-1?'gr':'tx';h+=`<div class="row"><span>${bits(k,n)}</span><b style="color:var(--${c})">${s}</b></div>`}
return sl2('rn',2,4,3,'bits n','st.rgj=0')+`<p class="ex">With ${n} bits there are 2^${n} = ${N} patterns. The leftmost bit is the sign (1 = negative). Counting up through the patterns:</p>`+h+(v>=N?`<p class="ex">Smallest = <b>−2^(${n}−1) = ${-N/2}</b>, largest = <b>2^(${n}−1) − 1 = ${N/2-1}</b>.</p>`:'')+btn('rgj',N,'First pattern','Next pattern')};
const TR=[['int c = a * b','int × int, computed as int',wrap(1e11),0,'The multiplication happens in 32 bits, so 10^11 overflows before the result reaches c.'],['long c = a * b','int × int, computed as int',wrap(1e11),0,'Making c a long is too late: a * b was already computed, and overflowed, as int.'],['long c = long(a * b)','int × int, then cast',wrap(1e11),0,'The cast is applied to a result that has already overflowed.'],['long c = (long) a * b','long × int, computed as long',1e11,1,'a becomes a long first, so the multiplication runs in 64 bits.']];
const trw=()=>{const v=st.tr??0;return `<p class="ex">a = 10^5 and b = 10^6. We want c = a × b = 10^11. The ALU multiplies in the type of its operands.</p>`+TR.slice(0,v).map((t,i)=>`<div class="card2" style="padding:10px 14px;margin:8px 0"><small class="k">TRY ${i+1}</small>${code([t[0]])}<span class="ex">${t[1]} · c ends up as <b>${fmt(t[2])}</b> · ${t[3]?'<b style="color:var(--gr)">works ✓</b>':'<b style="color:var(--rd)">fails ✗</b>'}</span><br><span class="ex">${t[4]}</span></div>`).join('')+btn('tr',4,'Try the first line','Next try')};
const CK=[1,1000,2147,2148,100000];
const smw=()=>{const v=st.sm??0,mx=2147483647;return `<p class="ex">Worst case: every A[i] = 10^6. After i elements the sum is i × 10^6. An int holds at most ${fmt(mx)}.</p>`+CK.slice(0,v).map(i=>{const s=i*1e6,ok=s<=mx;return `<div class="row"><span>after ${fmt(i)} elements: sum = ${fmt(s)}</span><b style="color:var(--${ok?'gr':'rd'})">${ok?'fits in int':'overflows, stored as '+fmt(wrap(s))}</b></div>`}).join('')+(v>=5?`<p class="ex">The real maximum is N × max(A[i]) = 10^5 × 10^6 = <b>10^11</b>, far beyond an int. The sum must be a <b>long</b>.</p>`:'')+btn('sm',5,'Check after 1 element','Check a later point')};
const TABS=[
{t:'Recap & plan',s:[
think('How many values?','A byte has 8 bits. How many different numbers can 8 bits represent, and how would a computer show a negative number using only 0s and 1s?','2^8 = <b>256</b> patterns. Negative numbers use <b>two’s complement</b>, where the leftmost bit acts as the sign. We build up to that today.','Take guesses before revealing.'),
W('Today’s plan','Reveal one part at a time.',()=>rvl('pl',[['PART 1','Number systems','Place values in base 10 and base 2'],['PART 2','Conversions','Binary to decimal and decimal to binary'],['PART 3','Binary addition','Column by column with a carry'],['PART 4','Bitwise operators','AND, OR, XOR, NOT'],['PART 5','Negative numbers','Two’s complement'],['PART 6','Ranges and constraints','Why int can overflow']]),'This session is the foundation for the advanced bit problems.')]},
{t:'Number systems',s:[
ST('ASK',think('Place value','In the decimal number 342, what does each digit contribute? What do you think changes if only the digits 0 and 1 are allowed?','3 hundreds + 4 tens + 2 ones = 3·10² + 4·10¹ + 2·10⁰. In binary the same idea works, but the weights are powers of <b>2</b> instead of 10.','')),
ST('TRY',W('Build a number from its digits','Pick a number. Each click adds one digit’s contribution, starting from the rightmost digit.',()=>pvw(),'Start with 342, then 110, then 1101.')),
ST('QUIZ',quiz('Quiz 1','What is the decimal value of the binary number 1011010?',null,['45','90','94','130'],1,['45 is 101101, which is this number without its trailing 0. A trailing 0 matters: it doubles the value, so 45 is half of the answer.','Correct. The 1s are at positions 6, 4, 3 and 1 from the right: 64 + 16 + 8 + 2 = 90.','94 = 64 + 16 + 8 + 4 + 2 would need a 1 at position 2. The third bit from the right is 0 in 1011010.','130 = 128 + 2 uses the weight 2^7, but this number has only 7 digits, so the leftmost weight is 2^6 = 64.'],''))]},
{t:'Decimal to binary',s:[
ST('ASK',think('Reverse the idea','Binary to decimal multiplies digits by powers of 2. To go the other way, what operation keeps splitting a number into 2s and tells you the lowest bit each time?','Dividing by 2: the <b>remainder</b> is the lowest bit, and the quotient continues. Repeat until the quotient is 0, then read the remainders backwards.','')),
ST('TRY',W('Long division by 2','One division per click. Collect the remainders.',()=>d2bw(),'The last remainder is the leftmost bit.')),
ST('QUIZ',quiz('Quiz 2','What is the binary representation of 45?',null,['101100','101110','101111','101101'],3,['101100 is 44. 45 is odd, so the last remainder is 1, not 0.','101110 is 46. Again 45 is odd, so the lowest bit must be 1.','101111 is 47. Dividing 22 by 2 leaves remainder 0, so the bit for 2^1 must be 0, not 1.','Correct. 45 ÷ 2 gives remainders 1, 0, 1, 1, 0, 1. Read bottom to top: 101101 = 32 + 8 + 4 + 1 = 45.'],''))]},
{t:'Binary addition',s:[
ST('ASK',think('Carry rule','In decimal, 8 + 3 = 11 gives digit 1 and carry 1 because the base is 10. What would be the digit and carry in binary for 1 + 1?','2 does not fit in one bit: digit = 2 % 2 = <b>0</b>, carry = 2 / 2 = <b>1</b>. Same rule, base 2.','')),
ST('TRY',W('Add column by column','Pick a pair. Each click handles one column: digit = sum % base, carry = sum / base. The first pair is a decimal warm-up.',()=>addw(),'The script gives 368 + 253 = 821. The correct sum is 621; the simulator computes it live, so mention the correction to learners.')),
ST('QUIZ',quiz('Quiz 3','What is the sum 10110 + 00111?',null,['11111','10101','11011','11101'],3,['11111 is 31, but 22 + 7 = 29. Somewhere a carry was added too many times.','10101 is 21, which is smaller than 22 alone. A sum cannot be smaller than one of its parts.','11011 is 27. In the second column 0 + 1 + 1 = 2, so the digit is 0 and the carry is 1; writing 1 there gives a wrong sum.','Correct. 22 + 7 = 29, and 11101 = 16 + 8 + 4 + 1 = 29. The column carries are 0, 1, 1, 0, 0.'],''))]},
{t:'Bitwise operators',s:[
ST('ASK',think('Operate on bits','AND, OR, XOR and NOT work on individual bits. If 1 means true and 0 means false, when would an AND of two bits be true? An OR? XOR?','AND: both true. OR: at least one true. XOR: exactly one true (the bits differ). NOT: the opposite.','Let learners say the rule before the table.')),
ST('TRY',W('Truth tables, one input at a time','Pick an operator and try each input.',()=>ttw(),'Compare the four rules once all are filled.')),
ST('TRY',W('Operators on whole numbers','Convert to binary, then handle one column per click, then read the result back in decimal.',()=>bxw(),'~ is shown as an 8-bit pattern.')),
ST('QUIZ',quiz('Quiz 5','What is A ^ B where A = 20 and B = 45?',null,['4','20','57','61'],2,['4 is 20 & 45 (AND): only the columns where both bits are 1.','20 is just A. XOR with 45 flips every bit of A where 45 has a 1, so the value must change.','Correct. 00010100 ^ 00101101 = 00111001 = 32 + 16 + 8 + 1 = 57.','61 is 20 | 45 (OR). XOR gives 0 where both bits are 1, so the 2^2 column is 0, which makes 57 instead of 61.'],''))]},
{t:'Negative numbers',s:[
ST('ASK',think('Sign bit','With 8 bits we can write 256 patterns. If half must stand for negative numbers, what could the leftmost bit mean?','The leftmost bit (MSB) can be the <b>sign</b>: 0 for positive, 1 for negative. Two’s complement also gives it a negative weight.','')),
ST('TRY',W('Two’s complement, bit by bit','Binary of |n|, invert each bit, add 1, then check the value.',()=>ngw(),'Try −5, then −3.')),
ST('QUIZ',quiz('Quiz 6','What is −3 in 8-bit signed (two’s complement) format?',null,['11111101','01111101','00000011','10101010'],0,['Correct. 3 = 00000011, invert to 11111100, add 1 to get 11111101. Check: −128 + 125 = −3.','The leftmost bit is 0, which means the number is positive (125). A negative number must start with 1.','That is +3. You converted |−3| but skipped the invert and add-1 steps.','10101010 is −86 in two’s complement, not −3. Redo the three steps starting from 00000011.'],''))]},
{t:'Ranges',s:[
ST('ASK',think('Smallest and largest','With n bits where one bit is used for the sign, what are the smallest and largest numbers you can store?','Smallest <b>−2^(n−1)</b>, largest <b>2^(n−1) − 1</b>. We confirm it by listing every pattern for small n.','')),
ST('TRY',W('List every pattern','Choose n, then step through all 2^n bit patterns.',()=>rgw(),'The extra negative value comes from the pattern 100…0.')),
ST('TRY',W('int and long','Reveal each data type.',()=>rvl('rt',[['INT (32 bits)',`−${fmt(2n**31n)} to ${fmt(2n**31n-1n)}`,'2^32 = 4294967296 has 10 digits, about 4 × 10^9, so an int holds values up to about 10^9'],['LONG (64 bits)',`−${(2n**63n).toLocaleString('en-US')} to ${(2n**63n-1n).toLocaleString('en-US')}`,'2^64 has 20 digits, about 18 × 10^18, so a long holds values up to about 10^18']]),'Remember: int ~ 10^9, long ~ 10^18.'))]},
{t:'Constraints',s:[
ST('ASK',think('Multiply two ints','a = 10^5 and b = 10^6. Can an int hold a × b? If not, which of these would store c correctly: int c = a*b, long c = a*b, long c = long(a*b), long c = (long) a * b?','No, 10^11 is above int range. Only the last one works, because the multiplication itself runs in long.','Ask for a vote before revealing.')),
ST('TRY',W('Four attempts, one at a time','Reveal each line and see where the multiplication happens.',()=>trw(),'Emphasise: the ALU decides the result type from the operands.')),
ST('QUIZ',quiz('Quiz: which line works?','a and b are ints with a = 10^5 and b = 10^6. Which line stores a × b correctly?',null,['long c = a * b','long c = long(a * b)','long c = (long) a * b','int c = (long) a * b'],2,['a * b is evaluated as int × int first, so it overflows before it is assigned to a long.','The cast is applied after a * b has already overflowed, so the value is already wrong.','Correct. (long) a converts a first, so the multiplication is long × int and runs in 64 bits.','The multiplication is fine now, but storing 10^11 into an int overflows again.'],'')),
ST('TRY',W('Is int enough for the sum?','N ≤ 10^5, A[i] ≤ 10^6. Check the running sum at a few points.',()=>smw(),'This is the script’s array-sum example.')),
ST('QUIZ',quiz('Quiz: array sum','With N ≤ 10^5 and A[i] ≤ 10^6, is a loop that adds the elements into an int sum correct?',null,['Yes, int is enough','No, the sum can reach 10^11, so use long','No, A[i] must be long','Yes, but only if N ≤ 10^6'],1,['The maximum sum is 10^5 × 10^6 = 10^11, which is much larger than the int limit of about 2 × 10^9.','Correct. Read the constraints first: the sum can be as large as 10^11, so sum must be a long.','A[i] ≤ 10^6 fits in an int. The problem is the total, not the individual elements.','A smaller N would not rescue it either: even 2148 elements of 10^6 already overflow an int.'],'')),
W('Wrap-up','Reveal one idea at a time.',()=>rvl('wr',[['NUMBER SYSTEMS','Place values','Weights are powers of the base'],['CONVERSION','Divide by 2','Remainders, read bottom to top'],['OPERATORS','AND, OR, XOR, NOT','Work column by column on bits'],['NEGATIVES','Two’s complement','Invert, add 1; the leftmost bit means negative'],['RANGES','n bits','−2^(n−1) to 2^(n−1) − 1'],['CONSTRAINTS','Check them first','They tell you when to use long']]),'Contest on the whole Intermediate module is coming: keep solving problems.')]}
];
function go(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;
$('#tn').textContent='Instructor notes: '+(notes?'on':'off');
$('#tabs').innerHTML=TABS.map((x,i)=>`<button class="${i==T?'on':''}" onclick="T=${i};S=0;go()"><i>0${i}</i>${x.t}</button>`).join('');
$('#side').innerHTML=`<h3>${tb.t}</h3>`+tb.s.map((x,i)=>`<button class="${i==S?'on':''}" onclick="S=${i};go()"><span>${i+1}</span>${x.h}</button>`).join('');
$('#main').innerHTML=`<small class="k">${tb.t.toUpperCase()} · STEP ${S+1} OF ${tb.s.length}</small>${tb.s.every(x=>x.st)?`<div class="stg">${[...new Set(tb.s.map(x=>x.st))].map(g=>`<span class="${g==s.st?'on':''}">${g}</span>`).join('›')}</div>`:''}<h2>${s.h}</h2>${s.r(k)}${notes&&s.n?`<div class="ins"><small>INSTRUCTOR</small><p>${s.n}</p></div>`:''}`;
const last=S==tb.s.length-1,nt=TABS[T+1];
$('#nx').textContent=s.th&&!rev[k]?'Reveal the answer ›':last?(nt?'Next: '+nt.t+' ›':'Done'):'Next ›';
$('#nx').disabled=last&&!nt&&!(s.th&&!rev[k]);$('#bk').disabled=!T&&!S}
function nx(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;if(s.th&&!rev[k])rev[k]=1;else if(S<tb.s.length-1)S++;else if(T<TABS.length-1){T++;S=0}go()}
function bk(){if(S)S--;else if(T){T--;S=TABS[T].s.length-1}go()}
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')nx();if(e.key=='ArrowLeft')bk()});
go();
</script></body></html>
