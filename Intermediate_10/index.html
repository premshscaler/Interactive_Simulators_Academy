 .rd2{border-color:var(--rd)}.gone b{text-decoration:line-through;opacity:.5}

</style></head><body>
<header><div><small>INTERMEDIATE DSA · CLASS 10 </small><h1>Strings & Immutability</h1></div>
<button class="tg" id="tn" onclick="notes=!notes;go()"></button></header>
<nav id="tabs"></nav>
<div class="wrap"><aside id="side"></aside>
<section class="card"><div id="main"></div>
<div class="nav"><button class="ghost" id="bk" onclick="bk()">‹ Back</button><span>← → keys work too</span><button class="btn" id="nx" onclick="nx()">Next ›</button></div></section></div>
<script>
const $=s=>document.querySelector(s);let T=0,S=0,notes=true,rev={},st={};
const code=(l,h)=>'<pre class="code" style="margin:10px 0">'+l.map((x,i)=>`<span class="${i==h?'hl':''}"><i>${i+1}</i>${x}</span>`).join('')+'</pre>';
const cells=(a,m={},c={})=>`<div class="cells">${a.map((v,j)=>`<div class="cell ${c[j]||''}">${m[j]?`<u>${m[j]}</u>`:''}<b>${v}</b><small>[${j}]</small></div>`).join('')}</div>`;
const cards=a=>`<div class="g">${a.map(x=>`<div class="cd"><small>${x[0]}</small><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`;
const W=(h,n,r)=>({h,n,r}),info=(h,b,n)=>W(h,n,()=>b);
const think=(h,q,a,n)=>({h,n,th:1,r:k=>`<div class="think"><span class="tag">THINK FIRST</span><h3>${q}</h3><button class="btn" onclick="rev['${k}']=!rev['${k}'];go()">${rev[k]?'Hide':'Reveal'} the answer</button></div>`+(rev[k]?`<div class="ans"><small>ANSWER</small><p>${a}</p></div>`:'')});
const pickQ=(k,i,ok)=>{if(st[k]===ok)return;const t=st[k+'w']||[];if(i!==ok&&!t.includes(i))t.push(i);st[k+'w']=t;st[k]=i;st[k+'a']=(st[k+'a']||0)+1;go()};
const quiz=(h,q,c,o,ok,why,n)=>W(h,n,k=>{const R=Array.isArray(why)?why:o.map((_,i)=>i==ok?why:'This option does not match. Re-read the question and try again.'),s=st[k],t=st[k+'w']||[],done=s===ok,at=st[k+'a']||0;
return `<div class="card2"><small class="k">QUIZ</small><h3>${q}</h3>${c?code(c):''}<div class="opts">${o.map((x,i)=>`<button class="opt ${done&&i==ok?'good':t.includes(i)?'bad':''}" ${done?'disabled':''} onclick="pickQ('${k}',${i},${ok})"><b>${'ABCD'[i]}</b>${x}</button>`).join('')}</div>`+(s==null?'':done?`<div class="qf good"><b>✓ Correct${at>1?' (after '+at+' tries)':' on the first try'}.</b> ${R[ok]}</div>`:`<div class="qf bad"><b>✗ Option ${'ABCD'[s]} is not right.</b> ${R[s]}<div class="bt"><button class="btn" onclick="st['${k}']=null;go()">Try again</button></div></div>`)+`</div>`});
const sorter=(h,items,L,tail,n)=>W(h,n,k=>`<div class="card2">${items.map((t,i)=>{const v=st[k+i];return `<div class="row"><span>${t[0]}</span>${L.map((l,x)=>`<button class="opt sm ${v!=null&&x==t[1]?'good':v==x?'bad':''}" onclick="st['${k}${i}']=${x};go()">${l}</button>`).join('')}</div>`}).join('')}${items.every((_,i)=>st[k+i]!=null)?`<p class="ex"><b>${tail}</b></p>`:''}</div>`);
const set=(f,v)=>`${f};go()`;
const X=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n');
const ST=(t,s)=>(s.st=t,s);
const walk=(h,q,c,S_,ans)=>W(h,0,k=>{const v=st[k]??0;return `<div class="card2"><small class="k">WORK IT OUT</small><h3>${q}</h3>${c?code(X(c)):''}${S_.slice(0,v).map((s,i)=>`<div class="row"><span style="flex:0 0 26px"><b>${i+1}</b></span><span><b>${s[0]}</b><br>${s[1]}</span></div>`).join('')}${v>=S_.length?`<p class="ex"><b>Answer: ${ans}</b></p>`:''}<div class="bt"><button class="btn" ${v>=S_.length?'disabled':''} onclick="${set(`st['${k}']=(st['${k}']??0)+1`)}">${v?'Next step':'Show step 1'}</button><button class="ghost" onclick="${set(`st['${k}']=0`)}">Reset</button><span class="ex">${v} / ${S_.length}</span></div></div>`});
const sl=(k,min,max,d,l)=>`<label>${l} = <b>${st[k]??d}</b> <input type="range" min="${min}" max="${max}" value="${st[k]??d}" onchange="st.${k}=+this.value;go()"></label>`;
const btn=(k,max,first,nxt)=>{const v=st[k]??0;return `<div class="bt"><button class="btn" ${v>=max?'disabled':''} onclick="${set(`st.${k}=(st.${k}??0)+1`)}">${v?nxt:first}</button><button class="ghost" onclick="${set(`st.${k}=0`)}">Reset</button><span class="ex">${v} / ${max}</span></div>`};
const nxb=(k,E,first,nxt,skip)=>{const v=st[k]??0;let t=-1;if(v<E.length){const g=E[v].g;t=E.reduce((a,e,i)=>e.g==g?i:a,-1)}return `<div class="bt"><button class="btn" ${v>=E.length?'disabled':''} onclick="${set(`st.${k}=(st.${k}??0)+1`)}">${v?nxt:first}</button><button class="ghost" ${t<0?'disabled':''} onclick="${set(`st.${k}=${t+1}`)}">${skip}</button><button class="ghost" onclick="${set(`st.${k}=0`)}">Reset</button><span class="ex">${v} / ${E.length}</span></div>`};
const pick=(k,labels)=>`<div class="bt">${labels.map((l,i)=>`<button class="${i==(st[k]??0)?'btn':'ghost'}" onclick="${set(`st.${k}=${i};st.${k}j=0`)}">${l}</button>`).join('')}</div>`;
const rvl=(k,items)=>{const v=st[k]??0;return items.slice(0,v).map(x=>`<div class="card2" style="padding:10px 14px;margin:8px 0"><small class="k">${x[0]}</small><br><b>${x[1]}</b>${x[2]?`<br><span class="ex">${x[2]}</span>`:''}</div>`).join('')+btn(k,items.length,'Reveal first','Reveal next')};
const cb=(k,L,N)=>{const v=st[k]??0;return (v?code(L.slice(0,v),v-1)+`<p class="ex">${N[v-1]}</p>`:`<p class="ex">Empty function. Press the button to write the first line.</p>`)+btn(k,L.length,'Write first line','Write next line')};
const sl2=(k,min,max,d,l,rs)=>`<label>${l} = <b>${st[k]??d}</b> <input type="range" min="${min}" max="${max}" value="${st[k]??d}" onchange="st.${k}=+this.value;${rs};go()"></label>`;
const mx=(M,cl=()=>'',lb=()=>'',val=v=>v)=>`<div style="display:grid;grid-template-columns:repeat(${M[0].length},62px);gap:26px 8px;margin:24px 0 30px">${M.map((r,i)=>r.map((v,j)=>`<div class="cell ${cl(i,j)}"><u>${lb(i,j)}</u><b>${val(v,i,j)}</b><small>[${i}][${j}]</small></div>`).join('')).join('')}</div>`;
const RV=(h,n,k,it)=>({h,n,r:()=>rvl(k,it),m:[k,it.length],ml:'Reveal next'});
const CB=(h,n,k,L,N)=>({h,n,r:()=>cb(k,L,N),m:[k,L.length],ml:'Write next line'});
const SB='anamadamm',PS='anamadamspe',PR=[[3,7],[0,3]],isP=t=>t==[...t].reverse().join(''),ch=String.fromCharCode;
const cl0=(n,f)=>Object.fromEntries([...Array(n)].map((_,i)=>[i,f(i)]));
// ---- ASCII of "Hello"
const asw=()=>{const a=[...'Hello'],v=st.as??0,m={};a.forEach((x,i)=>{if(i<v)m[i]=x.charCodeAt(0)});
return cells(a,m,cl0(5,i=>i<v?(i==v-1?'sel':'sw'):'emp'))+`<p class="ex">${v?`Index ${v-1} holds '${a[v-1]}', stored as the number <b>${a[v-1].charCodeAt(0)}</b>.`:'A string is an array of characters. Reveal them one at a time to see the number stored for each.'}</p>`+(v>=5?'<p class="ex"><b>"Hello" is stored as 72, 101, 108, 108, 111 at indices 0 to 4.</b></p>':'')+btn('as',5,'Show first character','Show next character')};
// ---- toggle case
const tgw=()=>{const w=['Hello','aDgbHJe'][st.tg??0],a=[...w],v=st.tgj??0,c=v-1,x=c>=0?a[c]:'',k=x?x.charCodeAt(0):0,up=x>='A'&&x<='Z',n=up?k+32:k-32,m={},out=a.map((y,i)=>i<v?ch(y.charCodeAt(0)^32):'·');a.forEach((y,i)=>{if(i<v)m[i]=y.charCodeAt(0)});
return pick('tg',['"Hello"','"aDgbHJe"'])+'<p class="ex">Input (ASCII above each letter once visited)</p>'+cells(a,m,cl0(a.length,i=>i==c?'sel':i<c?'sw':''))+'<p class="ex">Output so far</p>'+cells(out,{},cl0(a.length,i=>i<v?(i==c?'sel':'sw'):'emp'))+code(['for (i → 0 to N-1)',"    if (arr[i] >= 'A' && arr[i] <= 'Z')",'        arr[i] = arr[i] + 32','    else','        arr[i] = arr[i] - 32'],c>=0?(up?2:4):-1)+`<p class="ex">${c>=0?`i = ${c}: '${x}' has ASCII ${k}, so it is ${up?'uppercase (65 to 90): add 32':'lowercase (97 to 122): subtract 32'} → ${k} ${up?'+':'−'} 32 = ${n} → '<b>${ch(n)}</b>'.`:'Press the button to look at the first character.'}</p>`+(v>=a.length?`<p class="ex"><b>Result: "${out.join('')}"</b></p>`:'')+btn('tgj',a.length,'Check first character','Next character')};
// ---- palindrome check
const pwE=([s,e])=>{const E=[];while(s<e){const ok=PS[s]==PS[e];E.push({s,e,ok});if(!ok)return E;s++;e--}E.push({s,e,fin:1});return E};
const pww=()=>{const r=PR[st.pw??0],E=pwE(r),v=st.pwj??0,c=v?E[v-1]:null,m={},cl={};for(let i=r[0];i<=r[1];i++)cl[i]='rg';
E.slice(0,v-1).forEach(e=>{cl[e.s]=cl[e.e]='sw'});
if(c&&c.fin){for(let i=r[0];i<=r[1];i++)cl[i]='sw'}else if(c){cl[c.s]=cl[c.e]=c.ok?'sel':'rd2';m[c.s]='start';m[c.e]=c.s==c.e?'':'end'}
return pick('pw',['[3, 7]','[0, 3]'])+cells([...PS],m,cl)+code(['while (start < end)','    if (s[start] != s[end]) return false','    start++, end--','return true'],c?(c.fin?3:c.ok?2:1):-1)+`<p class="ex">${c?(c.fin?`start = ${c.s} is no longer less than end = ${c.e}: every pair matched → return <b>true</b>.`:`start = ${c.s}, end = ${c.e}: s[${c.s}] = '${PS[c.s]}', s[${c.e}] = '${PS[c.e]}'. ${c.ok?'Equal → move inward: start++, end−−.':'Different → return <b>false</b> right away.'}`):`Substring ${PR[st.pw??0]} of "${PS}". Press the button to compare the first pair.`}</p>`+btn('pwj',E.length,'Compare first pair','Next step')};
// ---- longest palindromic substring
const bfE=()=>{const E=[],n=SB.length;for(let i=0;i<n;i++)for(let j=i;j<n;j++)E.push({g:i,i,j,hit:isP(SB.slice(i,j+1))});return E};
const bfw=()=>{const E=bfE(),v=st.bf??0,c=v?E[v-1]:null;let b=0,bi=0;E.slice(0,v).forEach(e=>{if(e.hit&&e.j-e.i+1>b){b=e.j-e.i+1;bi=e.i}});const cl={};for(let k=bi;k<bi+b;k++)cl[k]='rg';if(c)for(let k=c.i;k<=c.j;k++)cl[k]=c.hit?'sw':'sel';
return cells([...SB],{},cl)+`<p class="ex">${c?`Substring [${c.i}..${c.j}] = "<b>${SB.slice(c.i,c.j+1)}</b>": ${c.hit?'a palindrome, length '+(c.j-c.i+1):'not a palindrome'}.`:'Generate every substring [i..j] and test each one. Press the button for the first.'}</p><p class="ex">Best so far: <b>${b}</b>${b?` ("${SB.substr(bi,b)}")`:''} · substrings tested: <b>${v}</b> of ${E.length}</p>`+nxb('bf',E,'Test first substring','Next substring','Finish this start')};
const ceE=()=>{const n=SB.length,E=[];let bl=0,bs=0;for(let c=0;c<n;c++)for(const m of[0,1]){let l=c,r=c+m;for(;;){const k=l<0||r>=n?'out':SB[l]!=SB[r]?'miss':'ok',e={g:c,c,m,l,r,k};E.push(e);if(k!='ok'){e.len=r-l-1;if(e.len>bl){bl=e.len;bs=l+1}e.bl=bl;e.bs=bs;break}e.bl=bl;e.bs=bs;l--;r++}}return E};
