<style>

header{max-width:1180px;margin:auto;padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.qf{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid;font-size:14px;line-height:1.5}.qf.good{border-color:var(--gr);background:color-mix(in srgb,var(--gr) 14%,var(--cd))}.qf.bad{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 14%,var(--cd))}
.opt b{background:var(--bd);border-radius:6px;padding:1px 8px;font-size:12px}.opt.good{border-color:var(--gr);background:color-mix(in srgb,var(--gr) 18%,var(--cd))}.opt.bad{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 18%,var(--cd))}

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}.cd{border:1px solid var(--bd);border-radius:14px;padding:14px;background:var(--cc)}

.bt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}.bt label{color:var(--mu);font-size:14px}input[type=range]{accent-color:var(--ac)}

@media(max-width:820px){.wrap{grid-template-columns:1fr}#side{display:flex;gap:6px;overflow-x:auto}#side h3{display:none}#side button{white-space:nowrap;width:auto}.card{padding:18px}}

</style></head><body>
<header><div><small>INTERMEDIATE DSA · CLASS 2</small><h1>Introduction to Arrays &amp; Basics of AI</h1></div>
<button class="tg" id="tn" onclick="notes=!notes;go()"></button></header>
<nav id="tabs"></nav>
<div class="wrap"><aside id="side"></aside>
<section class="card"><div id="main"></div>
<div class="nav"><button class="ghost" id="bk" onclick="bk()">‹ Back</button><span>← → keys work too</span><button class="btn" id="nx" onclick="nx()">Next ›</button></div></section></div>
<script>
const $=s=>document.querySelector(s);let T=0,S=0,notes=true,rev={},st={};
const code=(l,h)=>'<pre class="code" style="margin:10px 0">'+l.map((x,i)=>`<span class="${i==h?'hl':''}"><i>${i+1}</i>${x}</span>`).join('')+'</pre>';
const cells=(a,m={},c={})=>`<div class="cells">${a.map((v,j)=>`<div class="cell ${c[j]||''}">${m[j]?`<u>${m[j]}</u>`:''}<b>${v}</b><small>[${j}]</small></div>`).join('')}</div>`;
const cards=a=>`<div class="g">${a.map(x=>`<div class="cd"><small>${x[0]}</small><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`;
const W=(h,n,r)=>({h,n,r}),info=(h,b,n)=>W(h,n,()=>b);
const think=(h,q,a,n)=>({h,n,th:1,r:k=>`<div class="think"><span class="tag">THINK FIRST</span><h3>${q}</h3><button class="btn" onclick="rev['${k}']=!rev['${k}'];go()">${rev[k]?'Hide':'Reveal'} the answer</button></div>`+(rev[k]?`<div class="ans"><small>ANSWER</small><p>${a}</p></div>`:'')});
const pickQ=(k,i,ok)=>{if(st[k]===ok)return;const t=st[k+'w']||[];if(i!==ok&&!t.includes(i))t.push(i);st[k+'w']=t;st[k]=i;st[k+'a']=(st[k+'a']||0)+1;go()};
const quiz=(h,q,c,o,ok,why,n)=>W(h,n,k=>{const R=Array.isArray(why)?why:o.map((_,i)=>i==ok?why:'This option does not match. Re-read the question and try again.'),s=st[k],t=st[k+'w']||[],done=s===ok,at=st[k+'a']||0;
return `<div class="card2"><small class="k">QUIZ</small><h3>${q}</h3>${c?code(c):''}<div class="opts">${o.map((x,i)=>`<button class="opt ${done&&i==ok?'good':t.includes(i)?'bad':''}" ${done?'disabled':''} onclick="pickQ('${k}',${i},${ok})"><b>${'ABCD'[i]}</b>${x}</button>`).join('')}</div>`+(s==null?'':done?`<div class="qf good"><b>✓ Correct${at>1?' (after '+at+' tries)':' on the first try'}.</b> ${R[ok]}</div>`:`<div class="qf bad"><b>✗ Option ${'ABCD'[s]} is not right.</b> ${R[s]}<div class="bt"><button class="btn" onclick="st['${k}']=null;go()">Try again</button></div></div>`)+`</div>`});
const sorter=(h,items,L,tail,n)=>W(h,n,k=>`<div class="card2">${items.map((t,i)=>{const v=st[k+i];return `<div class="row"><span>${t[0]}</span>${L.map((l,x)=>`<button class="opt sm ${v!=null&&x==t[1]?'good':v==x?'bad':''}" onclick="st['${k}${i}']=${x};go()">${l}</button>`).join('')}</div>`}).join('')}${items.every((_,i)=>st[k+i]!=null)?`<p class="ex"><b>${tail}</b></p>`:''}</div>`);
const set=(f,v)=>`${f};go()`;
/* reverse */
const rvI=n=>st.rv={n,a:Array.from({length:n},(_,x)=>x+1),i:0,j:n-1,sw:null,stop:0};
function rvS(){const r=st.rv;if(r.i<r.j){[r.a[r.i],r.a[r.j]]=[r.a[r.j],r.a[r.i]];r.sw=[r.i,r.j];r.i++;r.j--}else r.stop=1;go()}
/* brute rotate */
const brI=(n,k)=>st.br={n,k,a:Array.from({length:n},(_,x)=>x+1),r:0};
function brS(){const b=st.br;if(b.r<b.k){b.a.unshift(b.a.pop());b.r++}go()}
/* three reverse */
const tr=()=>st.tr??(st.tr={n:7,k:3,s:0});
function trA(){const {n,k,s}=tr(),e=k%n;let a=Array.from({length:n},(_,i)=>i+1);if(s>0)a.reverse();if(s>1)a=[...a.slice(0,e).reverse(),...a.slice(e)];if(s>2)a=[...a.slice(0,e),...a.slice(e).reverse()];return a}
/* dynamic */
const ST=(t,s)=>(s.st=t,s);
const dy=m=>st['dy'+m]??(st['dy'+m]={cap:1,len:0,c:[],t:0});
function dyAdd(m){const d=dy(m);if(d.len>=32)return;let c=1;if(d.len==d.cap){c=d.len+1;d.cap=m==2?d.cap*2:d.cap+1}d.len++;d.c.push(c);d.t+=c;go()}
const dyW=m=>W(m==1?'Grow by one slot':'Double the capacity',m==1?'Each time the array is full, make room for just one more slot. Keep appending.':'Each time the array is full, double its capacity. Keep appending.',k=>{const d=dy(m);return `<div class="cells" style="gap:4px">${Array.from({length:d.cap},(_,i)=>`<div class="cell ${i<d.len?'sel':'emp'}" style="min-width:30px;padding:8px 0"><b style="font-size:13px">${i<d.len?i+1:''}</b></div>`).join('')}</div><div class="bars">${d.c.map(c=>`<i class="${c>1?'big':''}" style="height:${Math.max(5,c*3)}px" title="cost ${c}"></i>`).join('')}</div><p class="ex">Length <b>${d.len}</b>, capacity <b>${d.cap}</b>. Last append cost <b>${d.c.at(-1)??'–'}</b>. Average cost per append: <b>${d.len?(d.t/d.len).toFixed(2):'–'}</b> → ${m==1?'<b>keeps climbing, about N/2 per append</b>':'<b>stays small, O(1) amortised</b>'}. Red bars are the resize appends.</p><div class="bt"><button class="btn" ${d.len>=32?'disabled':''} onclick="dyAdd(${m})">Append</button><button class="ghost" onclick="${set('st.dy'+m+'=null')}">Reset</button></div>`});
const TABS=[
{t:'Why it matters',s:[
think('The 1,000,000th element','Which is faster: reading the 1st element of an array or the 1,000,000th?','<b>Same speed.</b> One jump, wherever the element sits. That single property is why arrays sit under almost every data structure you will meet.','Take two guesses before revealing.'),
info('Today’s plan','<p>Every array problem today ends with the same two questions: <mark>what is the time complexity?</mark> and <mark>how much extra space?</mark></p>'+cards([['Part 1','Arrays','Indexing and O(1) access'],['Part 2','Reverse array','Two pointers and the stopping rule'],['Part 3','Rotate array','Brute force, then three reverses'],['Part 4','Dynamic arrays','Resizing and amortised O(1)'],['Part 5','AI awareness','What AI does well, and what stays yours']]),'Frame: fundamentals first, so the AI talk lands on something solid.')]},
{t:'Arrays',s:[
think('What is an array?','What is an array? Give an example, don’t define it.','A collection of items of the <b>same type</b>, stored one after another: <code>int arr[n]</code> holds arr[0] … arr[n-1].','Take two examples before revealing.'),
W('Index to address','Click a cell. Show that arr[i] is just base + i × size.',k=>{const a=[5,-4,8,9,10],i=st.i??0;return `<div class="cells">${a.map((v,j)=>`<div class="cell ${j==i?'sel':''}" style="cursor:pointer" onclick="${set('st.i='+j)}"><em>${1000+4*j}</em><b>${v}</b><small>[${j}]</small></div>`).join('')}</div><p class="ex">arr[${i}] = *(arr + ${i}) → address 1000 + ${i} × 4 = <b>${1000+4*i}</b>. One multiply, one add, one read: <b>O(1)</b> for any N. Index 0 means “zero steps from the start”.</p>`}),
quiz('First and last index','What are the first and last indices of an array of size N?',null,['1, N','0, N-1','1, N-1','0, N'],1,['That is 1-based counting. Arrays start at index 0, so the first index is 0 and N elements end at index N − 1.','Correct. Indexing starts at 0, so N elements occupy indices 0 … N − 1.','The last index is right, but the first element is arr[0], not arr[1]. Indexing starts at 0.','The first index is right, but arr[N] is one past the end. The last valid index is N − 1.'],'Ask why before showing.'),
W('Print every element','Traverse with one index, touching each element once.',k=>{const a=[5,-4,8,9,10],i=st.pa??0;return cells(a,{[i]:'i'},{[i]:'sel'})+code(['for (i → 0 to n-1) {','    print(arr[i])','}'],1)+`<p class="ex">Output so far: <b>${a.slice(0,i+1).join('  ')}</b> · ${i+1} of ${a.length} steps → O(N)</p><div class="bt"><button class="btn" onclick="${set('st.pa=Math.min(4,(st.pa??0)+1)')}">Next element</button><button class="ghost" onclick="${set('st.pa=0')}">Reset</button></div>`}),
quiz('Cost of access','Time complexity of accessing the element at index i in an array of size N?',null,['O(N)','O(1)','O(N·N)','O(log N)'],1,['O(N) would mean walking through elements one by one. An array computes the address directly (base + i × size), so no walking is needed.','Correct. The address is computed directly, so the cost does not depend on N.','There is no loop at all here, let alone nested loops. A single address calculation is far cheaper than N·N.','Logarithmic time needs repeated halving, as in binary search. Array access involves no search: it is one calculation.'],''),
quiz('Sum of 1st and 5th','int arr[5] = {5,-4,8,9,10}. Which prints the sum of the 1st and 5th elements?',null,['arr[0] + arr[5]','arr[0] + arr[4]','arr[1] + arr[5]','arr[1] + arr[4]'],1,['arr[0] is the 1st element, but arr[5] is out of bounds: the valid indices are 0 … 4, so the 5th element is arr[4].','Correct. The 1st element is index 0 and the 5th is index 4. Index 5 would be out of bounds.','arr[1] is the 2nd element, not the 1st, and arr[5] does not exist for an array of size 5.','arr[4] is the right 5th element, but arr[1] is the 2nd element. The 1st element is arr[0].'],'')]},
{t:'Reverse array',s:[
ST('ASK',think('Reverse in place','Reverse the array {1,2,3,4,5} to get {5,4,3,2,1}. What is your first idea?','Any idea is welcome. The most direct one: <b>build a new array</b> by reading the old one from the back. We’ll try that first, count what it costs, then improve it.','Take two ideas from the class before revealing.')),
ST('BRUTE FORCE',W('Copy into a new array','Fill a second array from the back of the first. Count the steps and the extra space.',k=>{const a=[1,2,3,4,5],n=5,c=st.cp??0,r=a.map((_,i)=>i<c?a[n-1-i]:'·'),mk={};if(c<n)mk[c]='i';return `<p class="ex">arr</p>`+cells(a,{},c<n?{[n-1-c]:'rg'}:{})+`<p class="ex">reversed (an extra array)</p>`+cells(r,mk,c?{[c-1]:'sw'}:{})+code(['reversed = new int[N]','for (i → 0 to N-1)','    reversed[i] = arr[N-1-i]'],c?2:0)+`<p class="ex">${c<n?`Next: reversed[${c}] = arr[${n-1-c}].`:'Done.'} Steps so far: <b>${c}</b> · extra cells used: <b>${n}</b> → time <b>O(N)</b>, space <b>O(N)</b>.</p><div class="bt"><button class="btn" ${c>=n?'disabled':''} onclick="${set('st.cp=(st.cp??0)+1')}">Copy next</button><button class="ghost" onclick="${set('st.cp=0')}">Reset</button></div>`})),
ST('OBSERVE',think('Spot the waste','In the copy, where does <code>arr[0]</code> end up? And <code>arr[N-1]</code>? What does that suggest about the extra array?','<b>arr[0] goes to the last slot and arr[N-1] to the first: they trade places.</b> If two elements only trade places, we can swap them inside the same array and never need the extra one.','Let them answer before you connect it to a swap.')),
ST('PREDICT',quiz('Count the swaps','Swap mirror pairs inside the same array: first with last, second with second-last, and so on. For N = 5, how many swaps are needed?',null,['1','2','3','5'],1,['Only the pair (0, 4) would be fixed. The pair (1, 3) also needs a swap.','Correct. Pairs (0,4) and (1,3). Index 2 is its own mirror, so it stays. Next you will see why that sets the stopping rule.','Three swaps would be needed for N = 6 (pairs (0,5), (1,4), (2,3)). For N = 5 the middle element index 2 has no partner.','One swap already fixes two elements, so at most N / 2 swaps are ever needed. Swapping once per element would undo the work.'],'Ask for N = 6 as well before moving on.')),
ST('OPTIMIZE',W('Two-pointer reverse','Switch N between 5 and 6 and compare how it stops.',k=>{if(!st.rv)rvI(6);const r=st.rv,m={},c={};if(!r.stop){m[r.i]='i';m[r.j]=r.i==r.j?'i,j':'j'}else{m[r.i]='i';m[r.j]=r.i==r.j?'i,j':'j'}if(r.sw)r.sw.forEach(x=>c[x]='sw');return cells(r.a,m,c)+code(['i = 0, j = N-1','while (i &lt; j) {','    swap(arr[i], arr[j])','    i++, j--','}'],r.stop?1:r.sw?2:1)+`<p class="ex">${r.stop?'i ≥ j → <b>STOP</b>.':`Next: swap A[${r.i}] and A[${r.j}] (i=${r.i}, j=${r.j}).`} Time <b>O(N)</b>, space <b>O(1)</b>.</p><div class="bt"><button class="btn" ${r.stop?'disabled':''} onclick="rvS()">Step</button><button class="ghost" onclick="${set('rvI(6)')}">N = 6</button><button class="ghost" onclick="${set('rvI(5)')}">N = 5</button></div>`},)),
ST('COMPARE',info('Brute force vs optimized','<p>Same time, but we removed the extra array. This was an optimization of <mark>space</mark>.</p>'+cards([['BRUTE FORCE','Copy to a new array','Time O(N) · Space O(N)'],['OPTIMIZED','Two pointers, swap in place','Time O(N) · Space O(1)']])+'<p class="ex">The loop stops as soon as <b>i ≥ j</b>: pointers cross for even N, meet on the untouched middle for odd N.</p>','Tie back to the N = 5 swap count.'))]},
{t:'Rotate array',s:[
ST('ASK',think('Rotate by 2','Rotate {1,2,3,4,5} right by K = 2. What is the result?','<b>{4,5,1,2,3}</b>. Each rotation moves the last element to the front: {5,1,2,3,4} first, then {4,5,1,2,3}.','Do one rotation by hand first.')),
ST('BRUTE FORCE',W('Brute force: one rotation at a time','Each rotation shifts about N elements. Watch the work add up.',k=>{if(!st.br)brI(5,3);const b=st.br,ops=b.r*b.n,big=(1e5*1e5)/1e8;return cells(b.a,{},{})+code(['for (r → 1 to K) {','    temp = arr[N-1]','    shift everything right by 1','    arr[0] = temp','}'],b.r?2:0)+`<div class="bt"><label>N <input type="range" min="4" max="8" value="${b.n}" onchange="brI(+this.value,st.br.k);go()"> ${b.n}</label><label>K <input type="range" min="1" max="8" value="${b.k}" onchange="brI(st.br.n,+this.value);go()"> ${b.k}</label></div><p class="ex">Rotations: <b>${b.r}/${b.k}</b> · element moves so far: <b>${ops}</b> · total <b>N×K = ${b.n*b.k}</b> → O(N·K). At N = K = 10⁵ that is 10¹⁰ moves, about <b>${big} s</b> at 10⁸ ops/s.</p><div class="bt"><button class="btn" ${b.r>=b.k?'disabled':''} onclick="brS()">Rotate once</button><button class="ghost" onclick="${set('brI(st.br.n,st.br.k)')}">Reset</button></div>`})),
ST('OBSERVE',W('Spot the pattern','Rotate {1…7} one step at a time and watch where the last elements go.',k=>{const r=st.ro??0,base=[1,2,3,4,5,6,7],rows=[];for(let q=0;q<=Math.min(r,3);q++){const a=[...base];for(let z=0;z<q;z++)a.unshift(a.pop());rows.push(a)}return rows.map((a,q)=>`<p class="ex">after ${q} rotation${q==1?'':'s'}</p>`+cells(a,{},Object.fromEntries(Array.from({length:q},(_,i)=>[i,'rg'])))).join('')+`<div class="bt"><button class="btn" ${r>=3?'disabled':''} onclick="${set('st.ro=(st.ro??0)+1')}">Rotate once more</button><button class="ghost" onclick="${set('st.ro=0;st.rop=0')}">Reset</button></div>`+(r>=3?`<div class="think"><span class="tag">THINK FIRST</span><h3>Compare the start and the end. What do you notice about the first 3 elements?</h3><button class="btn" onclick="${set('st.rop=!st.rop')}">${st.rop?'Hide':'Reveal'} the answer</button></div>`+(st.rop?`<div class="ans"><small>ANSWER</small><p>The <b>last K elements moved to the front in the same order</b>, and the other N−K follow. Brute force shuffles everything K times; we only need to move these two blocks once.</p></div>`:''):'')})),
ST('OPTIMIZE',W('Three reverses','Move through the stages. Push K past N to see K % N at work.',k=>{const t=tr(),e=t.k%t.n,L=['Given array','Reverse the entire array','Reverse the first K elements','Reverse the remaining N−K elements'],c={};const a=trA();a.forEach((_,i)=>{if(t.s==1||(t.s==2&&i<e)||(t.s==3&&i>=e))c[i]='rg'});return `<p class="ex"><b>${L[t.s]}</b></p>`+cells(a,{},c)+code(['K = K % N','reverse(arr, 0, N-1)','reverse(arr, 0, K-1)','reverse(arr, K, N-1)'],[0,0,2,3][t.s]==0&&t.s==0?-1:t.s)+`<div class="bt"><label>N <input type="range" min="4" max="9" value="${t.n}" onchange="st.tr={n:+this.value,k:st.tr.k,s:0};go()"> ${t.n}</label><label>K <input type="range" min="1" max="20" value="${t.k}" onchange="st.tr={n:st.tr.n,k:+this.value,s:0};go()"> ${t.k}</label></div><p class="ex">K % N = ${t.k} % ${t.n} = <b>${e}</b>${e==0?' → array comes back unchanged, no work needed.':''} Time <b>O(N)</b>, space <b>O(1)</b>.</p><div class="bt"><button class="btn" ${t.s>=3?'disabled':''} onclick="${set('st.tr.s++')}">Next stage</button><button class="ghost" onclick="${set('st.tr.s=0')}">Reset</button></div>`})),
ST('EDGE CASE',quiz('The edge case','N = 5 and K = 12. How many rotations are actually needed?',null,['12','2','7','0'],1,['Rotating 12 times works, but 10 of those rotations are wasted: every 5 rotations bring the array back to where it started.','Correct. After N rotations the array is back where it started, so K rotations equal K % N = 12 % 5 = 2.','12 − 5 = 7 removes only one full cycle. 7 still contains another full cycle of 5, so 7 % 5 = 2 is what remains.','Zero would be right only if K were a multiple of N. 12 is not a multiple of 5, so the array does change.'],'')),
ST('COMPARE',info('Brute force vs optimized','<p>Same result, very different cost once K grows.</p>'+cards([['BRUTE FORCE','Rotate one at a time','Time O(N·K) · Space O(1)'],['OPTIMIZED','Three reverses with K % N','Time O(N) · Space O(1)']])+'<p class="ex">At N = 10⁵ and K = 10⁵ − 1: about 10¹⁰ moves (around 100 s) vs about 10⁵ swaps (instant). If K were exactly N, K % N = 0 and the optimized version would do nothing at all.</p>','Link back to the cost counter in the brute-force step.'))]},
{t:'Dynamic arrays',s:[
ST('ASK',think('Drawback of normal arrays','What is the drawback of a normal array?','The <b>size must be declared beforehand</b>. A dynamic array resizes itself as you add elements.','One-line answer is enough.')),
ST('BRUTE FORCE',dyW(1)),
ST('OBSERVE',think('Why so costly?','Look at the cost bars. Why is growing by one slot so expensive, and what could we change so resizes become rare?','Every append after a full array copies <b>all N elements</b> into a slightly bigger array. Fix: grow by a lot at once, for example <b>double the capacity</b>, so the next many appends cost 1.','Let them propose a growth rule first.')),
ST('OPTIMIZE',dyW(2)),
ST('IN PRACTICE',info('In your language','<div class="g"><div class="cd"><small>Java</small><h4>ArrayList</h4><p>add(x) · get(i) · size() · clear()</p></div><div class="cd"><small>C++</small><h4>vector</h4><p>push_back(x) · a[i] · size() · clear()</p></div><div class="cd"><small>Python</small><h4>list</h4><p>append(x) · a[i] · len(a) · clear()</p></div></div><p class="ex">Lookups stay O(1). Appends are O(1) amortised, and O(N) only on the rare resize.</p>','Overview only. Full analysis comes in a later class.'))]},
{t:'AI awareness',s:[
think('The elephant in the room','“AI writes all the code now. Why should I learn?” What is the honest answer?','Every powerful tool (calculator, Excel, Google) raised the floor and made skilled people more valuable. <b>AI doesn’t replace developers. It replaces developers who refuse to learn it.</b>','Ask for a show of hands in chat first.'),
sorter('Whose territory?',[['Writing a working first draft fast',0],['Explaining why this line gave an error',0],['Deciding what is actually worth building',1],['Spotting a bug that passes every test',1],['Owning the 2 AM production failure',1],['Translating Python into Java',0]],['AI is strong','Your job'],'Developer + AI > AI alone > Developer alone.','Let them argue each row before they tap.'),
think('Why fundamentals matter more','AI solves a problem in seconds. How do you know its answer is right?','You check: <b>is it correct, is it optimal, does it survive edge cases, does it scale to millions of users, why this approach over another?</b> Without DSA you can only trust it blindly.','This is the most important step of the section.'),
sorter('Healthy or not?',[['“Explain why this line gave me an error.”',0],['“Solve this assignment for me.”',1],['“I tried for 30 minutes. Give me a hint.”',0],['“Generate the answer without me thinking.”',1]],['Healthy use','Not healthy'],'Struggle first, then peers, then AI hints, and only then the full answer.','Land the rule at the end.')]},
{t:'Wrap-up',s:[
info('The takeaway','<p style="font-size:24px;font-weight:700;line-height:1.3">Arrays give O(1) access. Two pointers and the three-reverse trick solve in place. AI helps most when you can judge its answer.</p>'+cards([['Arrays','Index → address','arr[i] is O(1); indexing starts at 0'],['Reverse','Stop at i ≥ j','O(N) time, O(1) space'],['Rotate','K % N, three reverses','O(N·K) becomes O(N)'],['Dynamic','Resize on full','Appends are O(1) amortised']]),'Summarise quickly from this page.'),
info('Assignment','<p>Unlock the assignment, then ask everyone to submit <mark>Array Rotation</mark>.</p><div class="card2"><b>Live solution session</b><p class="ex">1. Ask for a volunteer to solve it live.<br>2. Give them screen-share permission: Settings › Admin › Unmuted Audience Can Share › Audio, Video and Screen.<br>3. Guide them through it and keep the class involved.</p></div>','Unlock via the question-mark button on the top bar.')]}
];
function go(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;
$('#tn').textContent='Instructor notes: '+(notes?'on':'off');
$('#tabs').innerHTML=TABS.map((x,i)=>`<button class="${i==T?'on':''}" onclick="T=${i};S=0;go()"><i>0${i}</i>${x.t}</button>`).join('');
$('#side').innerHTML=`<h3>${tb.t}</h3>`+tb.s.map((x,i)=>`<button class="${i==S?'on':''}" onclick="S=${i};go()"><span>${i+1}</span>${x.h}</button>`).join('');
$('#main').innerHTML=`<small class="k">${tb.t.toUpperCase()} · STEP ${S+1} OF ${tb.s.length}</small>${tb.s.every(x=>x.st)?`<div class="stg">${[...new Set(tb.s.map(x=>x.st))].map(g=>`<span class="${g==s.st?'on':''}">${g}</span>`).join('›')}</div>`:''}<h2>${s.h}</h2>${s.r(k)}${notes&&s.n?`<div class="ins"><small>INSTRUCTOR</small><p>${s.n}</p></div>`:''}`;
const last=S==tb.s.length-1,nt=TABS[T+1];
$('#nx').textContent=s.th&&!rev[k]?'Reveal the answer ›':last?(nt?'Next: '+nt.t+' ›':'Done'):'Next ›';
$('#nx').disabled=last&&!nt&&!(s.th&&!rev[k]);$('#bk').disabled=!T&&!S}
function nx(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;if(s.th&&!rev[k])rev[k]=1;else if(S<tb.s.length-1)S++;else if(T<TABS.length-1){T++;S=0}go()}
function bk(){if(S)S--;else if(T){T--;S=TABS[T].s.length-1}go()}
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')nx();if(e.key=='ArrowLeft')bk()});
go();
</script></body></html>
