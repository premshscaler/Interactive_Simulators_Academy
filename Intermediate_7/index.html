<script>
const $=s=>document.querySelector(s);let T=0,S=0,notes=true,rev={},st={};

const cells=(a,m={},c={})=>`<div class="cells">${a.map((v,j)=>`<div class="cell ${c[j]||''}">${m[j]?`<u>${m[j]}</u>`:''}<b>${v}</b><small>[${j}]</small></div>`).join('')}</div>`;
const cards=a=>`<div class="g">${a.map(x=>`<div class="cd"><small>${x[0]}</small><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`;
const W=(h,n,r)=>({h,n,r}),info=(h,b,n)=>W(h,n,()=>b);
const think=(h,q,a,n)=>({h,n,th:1,r:k=>`<div class="think"><span class="tag">THINK FIRST</span><h3>${q}</h3><button class="btn" onclick="rev['${k}']=!rev['${k}'];go()">${rev[k]?'Hide':'Reveal'} the answer</button></div>`+(rev[k]?`<div class="ans"><small>ANSWER</small><p>${a}</p></div>`:'')});
const pickQ=(k,i,ok)=>{if(st[k]===ok)return;const t=st[k+'w']||[];if(i!==ok&&!t.includes(i))t.push(i);st[k+'w']=t;st[k]=i;st[k+'a']=(st[k+'a']||0)+1;go()};
const quiz=(h,q,c,o,ok,why,n)=>W(h,n,k=>{const R=Array.isArray(why)?why:o.map((_,i)=>i==ok?why:'This option does not match. Re-read the question and try again.'),s=st[k],t=st[k+'w']||[],done=s===ok,at=st[k+'a']||0;
return `<div class="card2"><small class="k">QUIZ</small><h3>${q}</h3>${c?code(c):''}<div class="opts">${o.map((x,i)=>`<button class="opt ${done&&i==ok?'good':t.includes(i)?'bad':''}" ${done?'disabled':''} onclick="pickQ('${k}',${i},${ok})"><b>${'ABCD'[i]}</b>${x}</button>`).join('')}</div>`+(s==null?'':done?`<div class="qf good"><b>✓ Correct${at>1?' (after '+at+' tries)':' on the first try'}.</b> ${R[ok]}</div>`:`<div class="qf bad"><b>✗ Option ${'ABCD'[s]} is not right.</b> ${R[s]}<div class="bt"><button class="btn" onclick="st['${k}']=null;go()">Try again</button></div></div>`)+`</div>`});
const sorter=(h,items,L,tail,n)=>W(h,n,k=>`<div class="card2">${items.map((t,i)=>{const v=st[k+i];return `<div class="row"><span>${t[0]}</span>${L.map((l,x)=>`<button class="opt sm ${v!=null&&x==t[1]?'good':v==x?'bad':''}" onclick="st['${k}${i}']=${x};go()">${l}</button>`).join('')}</div>`}).join('')}${items.every((_,i)=>st[k+i]!=null)?`<p class="ex"><b>${tail}</b></p>`:''}</div>`);
const set=(f,v)=>`${f};go()`;
const X=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n');
const ST=(t,s)=>(s.st=t,s);
const walk=(h,q,c,S_,ans)=>W(h,0,k=>{const v=st[k]??0;return `<div class="card2"><small class="k">WORK IT OUT</small><h3>${q}</h3>${c?code(X(c)):''}${S_.slice(0,v).map((s,i)=>`<div class="row"><span style="flex:0 0 26px"><b>${i+1}</b></span><span><b>${s[0]}</b><br>${s[1]}</span></div>`).join('')}${v>=S_.length?`<p class="ex"><b>Answer: ${ans}</b></p>`:''}<div class="bt"><button class="btn" ${v>=S_.length?'disabled':''} onclick="${set(`st['${k}']=(st['${k}']??0)+1`)}">${v?'Next step':'Show step 1'}</button><button class="ghost" onclick="${set(`st['${k}']=0`)}">Reset</button><span class="ex">${v} / ${S_.length}</span></div></div>`});
const sl=(k,min,max,d,l)=>`<label>${l} = <b>${st[k]??d}</b> <input type="range" min="${min}" max="${max}" value="${st[k]??d}" onchange="st.${k}=+this.value;go()"></label>`;
const btn=(k,max,first,nxt)=>{const v=st[k]??0;return `<div class="bt"><button class="btn" ${v>=max?'disabled':''} onclick="${set(`st.${k}=(st.${k}??0)+1`)}">${v?nxt:first}</button><button class="ghost" onclick="${set(`st.${k}=0`)}">Reset</button><span class="ex">${v} / ${max}</span></div>`};
const pick=(k,labels)=>`<div class="bt">${labels.map((l,i)=>`<button class="${i==(st[k]??0)?'btn':'ghost'}" onclick="${set(`st.${k}=${i};st.${k}j=0`)}">${l}</button>`).join('')}</div>`;
const sw=a=>`[${a.join(', ')}]`;
// ---------- call stack programs ----------
const seq=(mainS,initL,v0,calls,pl,out)=>{const s=[[mainS,['main'],'main() is called: its frame is pushed.']];let mv=v0;s.push([initL,['main · '+mv],'x and y live in main’s frame.']);
calls.forEach(c=>{s.push([c.l,['main · '+mv,c.n+' · '+c.a],'Call '+c.n+': a new frame is pushed on top.']);s.push([c.f,['main · '+mv,c.n+' · '+c.a],c.n+' computes and returns '+c.r+'.']);mv+=', '+c.v+' = '+c.r;s.push([c.l,['main · '+mv],'Frame popped. '+c.v+' = '+c.r+', back in main.']);});
s.push([pl,['main · '+mv],'print → '+out,[out]]);s.push([pl,[],'main returns: the stack is empty.']);return s};
const M0='main · x=10, y=20',F0='fun · a=10, b=20';
const CS=[
{n:'Example 1',c:['function add(x, y): return x + y','function product(x, y): return x * y','function subtract(x, y): return x - y','function main():','    x = 10; y = 20','    temp1 = add(x, y)','    temp2 = product(x, y)','    temp3 = subtract(x, y)','    print(temp1 + temp2 + temp3)'],s:seq(3,4,'x=10, y=20',[{l:5,f:0,n:'add',a:'x=10, y=20',r:30,v:'temp1'},{l:6,f:1,n:'product',a:'x=10, y=20',r:200,v:'temp2'},{l:7,f:2,n:'subtract',a:'x=10, y=20',r:-10,v:'temp3'}],8,'220')},
{n:'Example 2',c:['function add(x, y): return x + y','function main():','    x = 10; y = 20','    temp1 = add(x, y)','    temp2 = add(temp1, 30)','    temp3 = add(temp2, 40)','    print(temp3)'],s:seq(1,2,'x=10, y=20',[{l:3,f:0,n:'add',a:'x=10, y=20',r:30,v:'temp1'},{l:4,f:0,n:'add',a:'x=30, y=30',r:60,v:'temp2'},{l:5,f:0,n:'add',a:'x=60, y=40',r:100,v:'temp3'}],6,'100')},
{n:'Example 3',c:['function add(x, y): return x + y','function fun(a, b):','    sum = add(a, b)','    ans = sum * 10; return ans','function extra(w):','    print("Hello"); print(w)','function main():','    x = 10; y = 20','    z = fun(x, y)','    print(z)','    extra(z)'],s:[
[6,['main'],'main() is called.'],[7,[M0],'x and y live in main’s frame.'],[8,[M0,F0],'fun(x, y): a new frame is pushed.'],[2,[M0,F0,'add · x=10, y=20'],'fun calls add: a third frame sits on top.'],[0,[M0,F0,'add · x=10, y=20'],'add returns 30.'],[2,[M0,F0+', sum=30'],'add’s frame is popped. sum = 30.'],[3,[M0,F0+', sum=30, ans=300'],'ans = 300 and fun returns it.'],[8,[M0+', z=300'],'fun’s frame is popped. z = 300.'],[9,[M0+', z=300'],'print(z) → 300',['300']],[10,[M0+', z=300','extra · w=300'],'extra(z): a new frame, w gets a copy of 300.'],[5,[M0+', z=300','extra · w=300'],'prints Hello, then w (= 300, not 310)',['Hello','300']],[10,[M0+', z=300'],'extra returns: its frame is popped.'],[10,[],'main returns: the stack is empty.']]}];
const csw=k=>{const p=CS[st.cs??0],v=st.csj??0,s=v?p.s[v-1]:null,out=[].concat(...p.s.slice(0,v).map(x=>x[3]||[]));
return pick('cs',CS.map(x=>x.n))+code(p.c,s?s[0]:-1)+`<div class="g" style="grid-template-columns:1fr 1fr"><div class="cd"><small>CALL STACK (top first)</small>${s&&s[1].length?[...s[1]].reverse().map((f,i)=>`<div class="card2" style="padding:8px 12px;margin:6px 0;${i==0?'border-color:var(--ac)':''}"><b>${f}</b>${i==0?' <small class="k">TOP</small>':''}</div>`).join(''):'<p>empty</p>'}</div><div class="cd"><small>OUTPUT</small><p><b>${out.join('<br>')||'·'}</b></p></div></div><p class="ex">${s?s[2]:'Press the button to start main().'}</p>`+btn('csj',p.s.length,'Run first step','Next step')};
// ---------- stack vs heap programs ----------
const fr=(n,v)=>[n,v],hp=(a,v)=>[a,v];
const MM=[
{n:'1 · array',c:['function main():','    x = 10','    ar = new array[3]','    print(ar)        // #4k','    ar[1] = 7'],s:[
[0,[fr('main',[])],[],'main starts.'],[1,[fr('main',[['x',10]])],[],'x = 10 is a simple value: stored directly on the stack.'],[2,[fr('main',[['x',10],['ar','#4k']])],[hp('#4k',[0,0,0])],'new creates the array on the HEAP. ar holds only its address #4k.'],[3,[fr('main',[['x',10],['ar','#4k']])],[hp('#4k',[0,0,0])],'print(ar) shows the address #4k, not the contents.'],[4,[fr('main',[['x',10],['ar','#4k']])],[hp('#4k',[0,7,0])],'ar[1] = 7: follow #4k to the heap, write slot 1.']]},
{n:'2 · two refs',c:['x = 10','ar = new array[3]','ar2 = ar','ar = new array[5]','print(ar2)       // #4k'],s:[
[0,[fr('main',[['x',10]])],[],'x = 10 on the stack.'],[1,[fr('main',[['x',10],['ar','#4k']])],[hp('#4k',[0,0,0])],'ar points to a new heap array at #4k.'],[2,[fr('main',[['x',10],['ar','#4k'],['ar2','#4k']])],[hp('#4k',[0,0,0])],'ar2 = ar copies the ADDRESS. There is still only one array.'],[3,[fr('main',[['x',10],['ar','#7k'],['ar2','#4k']])],[hp('#4k',[0,0,0]),hp('#7k',[0,0,0,0,0])],'ar now points to a NEW array #7k. #4k is unchanged.'],[4,[fr('main',[['x',10],['ar','#7k'],['ar2','#4k']])],[hp('#4k',[0,0,0]),hp('#7k',[0,0,0,0,0])],'ar2 still holds #4k.']]},
{n:'3 · pass array',c:['function fun(a):','    a[1] = 5','function main():','    ar = new array[3]','    ar[0] = 90; ar[1] = 50','    fun(ar)','    print(ar[1])      // 5'],s:[
[2,[fr('main',[])],[],'main starts.'],[3,[fr('main',[['ar','#9k']])],[hp('#9k',[0,0,0])],'ar holds #9k.'],[4,[fr('main',[['ar','#9k']])],[hp('#9k',[90,50,0])],'Values are written on the heap.'],[5,[fr('main',[['ar','#9k']]),fr('fun',[['a','#9k']])],[hp('#9k',[90,50,0])],'fun(ar) receives a COPY OF THE ADDRESS. a and ar both point to #9k.'],[1,[fr('main',[['ar','#9k']]),fr('fun',[['a','#9k']])],[hp('#9k',[90,5,0])],'a[1] = 5 changes the one shared heap array.'],[6,[fr('main',[['ar','#9k']])],[hp('#9k',[90,5,0])],'fun’s frame is popped but the heap change stays: print(ar[1]) → 5.']]},
{n:'4 · 2D array',c:['y = 7.84','mat = new array[3][4]','print(mat[1])       // #2k','print(mat[1][3])    // 0'],s:[

const mmw=()=>{const p=MM[st.mm??0],v=st.mmj??0,s=v?p.s[v-1]:null;const box=f=>`<div class="card2" style="padding:8px 12px;margin:6px 0"><b>${f[0]}</b><br>${f[1].map(x=>`<span class="ex" style="margin-right:12px">${x[0]} = <b>${x[1]}</b></span>`).join('')||'<span class="ex">no locals</span>'}</div>`;

const nbrute=(k,a)=>{const n=a.length,E=nev(a),v=st[k]??0,c=v?E[v-1]:null,cl={},m={};let noble=0,cmp=0,sm=0;E.slice(0,v).forEach(e=>{if(e.t=='c')cmp++;if(e.t=='v'&&a.filter(y=>y<a[e.i]).length==a[e.i])noble++});

const nsorted=(k,a)=>{const s=[...a].sort((x,y)=>x-y),n=s.length,v=st[k]??0,i=v-2,cl={},m={};let c=0;for(let x=0;x<Math.max(0,i+1);x++)if(s[x]==x)c++;

const ndup=(k,a)=>{const s=[...a].sort((x,y)=>x-y),n=s.length,v=st[k]??0,i=v-2,cl={},m={};let cnt=0,ans=0,ch=0;for(let x=0;x<=i;x++){if(x==0)cnt=0;else if(s[x]!=s[x-1]){cnt=x;ch=1}else ch=0;if(cnt==s[x])ans++}
let msg=v?'Sorted.':'Press the button to sort the array.';if(v>=2){for(let x=0;x<=i;x++)cl[x]=s[x]==cnt&&x==i?'sw sel':'';cl[i]='sel '+(cnt==s[i]?'sw':'');m[i]='count='+cnt;msg=i==0?`First element: nothing is smaller, count = 0. arr[0] = ${s[0]} ${s[0]==0?'→ noble ✓':'≠ 0'}.`:s[i]!=s[i-1]?`arr[${i}] = ${s[i]} differs from the previous → count = i = <b>${i}</b>. ${cnt==s[i]?'count = arr[i] → noble ✓':'not noble'}`:`arr[${i}] = ${s[i]} equals the previous element → count stays <b>${cnt}</b> (the naive “arr[i] == i” would compare with ${i} and wrongly reject it). ${cnt==s[i]?'noble ✓':'not noble'}`}
return cells(v?s:a,m,cl)+code(['sort(arr); count = 0; ans = 0','if (arr[0] == 0) ans++','for (i → 1 to n-1)','    if (arr[i] != arr[i-1]) count = i','    if (count == arr[i]) ans++'],v<2?-1:i==0?1:s[i]!=s[i-1]?3:4)+`<p class="ex">${msg}</p><p class="ex">${v>=n+1?'Final noble count':'ans so far'}: <b>${v>=2?ans:0}</b>${v>=n+1?' · O(n log n) time, O(1) space.':''}</p>`+btn(k,n+1,'Sort the array','Next index')};

function go(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;
$('#tn').textContent='Instructor notes: '+(notes?'on':'off');
$('#tabs').innerHTML=TABS.map((x,i)=>`<button class="${i==T?'on':''}" onclick="T=${i};S=0;go()"><i>0${i}</i>${x.t}</button>`).join('');
$('#side').innerHTML=`<h3>${tb.t}</h3>`+tb.s.map((x,i)=>`<button class="${i==S?'on':''}" onclick="S=${i};go()"><span>${i+1}</span>${x.h}</button>`).join('');
$('#main').innerHTML=`<small class="k">${tb.t.toUpperCase()} · STEP ${S+1} OF ${tb.s.length}</small>${tb.s.every(x=>x.st)?`<div class="stg">${[...new Set(tb.s.map(x=>x.st))].map(g=>`<span class="${g==s.st?'on':''}">${g}</span>`).join('›')}</div>`:''}<h2>${s.h}</h2>${s.r(k)}${notes&&s.n?`<div class="ins"><small>INSTRUCTOR</small><p>${s.n}</p></div>`:''}`;
const last=S==tb.s.length-1,nt=TABS[T+1];
$('#nx').textContent=s.th&&!rev[k]?'Reveal the answer ›':last?(nt?'Next: '+nt.t+' ›':'Done'):'Next ›';
$('#nx').disabled=last&&!nt&&!(s.th&&!rev[k]);$('#bk').disabled=!T&&!S}
function nx(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;if(s.th&&!rev[k])rev[k]=1;else if(S<tb.s.length-1)S++;else if(T<TABS.length-1){T++;S=0}go()}
function bk(){if(S)S--;else if(T){T--;S=TABS[T].s.length-1}go()}
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')nx();if(e.key=='ArrowLeft')bk()});
go();
</script></body></html>
