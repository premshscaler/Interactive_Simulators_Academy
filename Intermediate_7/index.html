@keyframes fout{from{opacity:1;max-height:90px}to{opacity:0;transform:translateY(-26px) rotate(-3deg);max-height:0;padding-top:0;padding-bottom:0;margin:0;border-width:0}}
@keyframes fade{from{opacity:0}}
@keyframes flash{0%,35%{background:var(--ye);color:#1a1400}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes drop{from{transform:translateY(-140px);opacity:0}}
@keyframes lift{to{transform:translateY(-140px) rotate(-8deg);opacity:0}}
@keyframes pp{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:none}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes drw{to{stroke-dashoffset:0}}

<header><div><small>INTERMEDIATE DSA · CLASS 7</small><h1>Memory, Sorting &amp; Noble Integer</h1></div>
<button class="tg" id="tn" onclick="notes=!notes;go()"></button></header>
<nav id="tabs"></nav>
<div class="wrap"><aside id="side"></aside>
<section class="card"><div id="main"></div>
<div class="nav"><button class="ghost" id="bk" onclick="bk()">‹ Back</button><span>← → keys work too</span><button class="btn" id="nx" onclick="nx()">Next ›</button></div></section></div>
<script>
const $=s=>document.querySelector(s);let T=0,S=0,notes=true,rev={},st={};
const code=(l,h)=>'<pre class="code" style="margin:10px 0">'+l.map((x,i)=>`<span class="${i==h?'hl':''}"><i>${i+1}</i>${x}</span>`).join('')+'</pre>';
const cells=(a,m={},c={})=>`<div class="cells">${a.map((v,j)=>`<div class="cell ${c[j]||''}">${m[j]?`<u>${m[j]}</u>`:''}<b>${v}</b><small>[${j}]</small></div>`).join('')}</div>`;
const cards=a=>`<div class="g">${a.map(x=>`<div class="cd"><small>${x[0]}</small><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`;
const W=(h,n,r,n2)=>n2===undefined?{h,n,r}:{h,d:n,n:n2,r},info=(h,b,n)=>W(h,n,()=>b);
const think=(h,q,a,n)=>({h,n,th:1,r:k=>`<div class="think"><span class="tag">THINK FIRST</span><h3>${q}</h3><button class="btn" onclick="rev['${k}']=!rev['${k}'];go()">${rev[k]?'Hide':'Reveal'} the answer</button></div>`+(rev[k]?`<div class="ans"><small>ANSWER</small><p>${a}</p></div>`:'')});
const pickQ=(k,i,ok)=>{if(st[k]===ok)return;const t=st[k+'w']||[];if(i!==ok&&!t.includes(i))t.push(i);st[k+'w']=t;st[k]=i;st[k+'a']=(st[k+'a']||0)+1;go()};
const quiz=(h,q,c,o,ok,why,n)=>W(h,n,k=>{const R=Array.isArray(why)?why:o.map((_,i)=>i==ok?why:'This option does not match. Re-read the question and try again.'),s=st[k],t=st[k+'w']||[],done=s===ok,at=st[k+'a']||0;
return `<div class="card2"><small class="k">QUIZ</small><h3>${q}</h3>${c?code(c):''}<div class="opts">${o.map((x,i)=>`<button class="opt ${done&&i==ok?'good':t.includes(i)?'bad':''}" ${done?'disabled':''} onclick="pickQ('${k}',${i},${ok})"><b>${'ABCD'[i]}</b>${x}</button>`).join('')}</div>`+(s==null?'':done?`<div class="qf good"><b>✓ Correct${at>1?' (after '+at+' tries)':' on the first try'}.</b> ${R[ok]}</div>`:`<div class="qf bad"><b>✗ Option ${'ABCD'[s]} is not right.</b> ${R[s]}<div class="bt"><button class="btn" onclick="st['${k}']=null;go()">Try again</button></div></div>`)+`</div>`});
const sorter=(h,items,L,tail,n)=>W(h,n,k=>`<div class="card2">${items.map((t,i)=>{const v=st[k+i];return `<div class="row"><span>${t[0]}</span>${L.map((l,x)=>`<button class="opt sm ${v!=null&&x==t[1]?'good':v==x?'bad':''}" onclick="st['${k}${i}']=${x};go()">${l}</button>`).join('')}</div>`}).join('')}${items.every((_,i)=>st[k+i]!=null)?`<p class="ex"><b>${tail}</b></p>`:''}</div>`);
const fr=(n,v)=>[n,v],hp=(a,v)=>[a,v];
let FX=0,SHK=0,PLX=null,PT=0,AT=0,PA=new Set();
const set=(f,v)=>`${f};FX=1;go()`;
// ---------- animated call stack ----------
const fnorm=f=>typeof f=='string'?{n:f.split(' · ')[0],v:f.split(' · ')[1]||''}:f;
const csR=(fr,pv,anim)=>{fr=fr.map(fnorm);pv=pv.map(fnorm);const box=(f,c,ch)=>`<div class="frm ${c}"><b>${f.n}()</b>${c.includes('top')?' <small class="k">TOP · running</small>':''}${f.v?`<div class="fv ${ch?'fl':''}">${f.v}</div>`:''}</div>`;let h='';
if(anim&&pv.length>fr.length)for(let i=pv.length-1;i>=fr.length;i--)h+=box(pv[i],'fout');
for(let i=fr.length-1;i>=0;i--){const nw=anim&&(!pv[i]||pv[i].n!=fr[i].n);h+=box(fr[i],(i==fr.length-1?'top ':'')+(nw?'fin':''),anim&&!nw&&pv[i].v!=fr[i].v)}
return h||'<p class="ex">empty</p>'};
// ---------- animated stack + heap with arrows ----------
const isP=v=>typeof v=='string'&&v[0]=='#';
const memR=(cur,prev,anim)=>{const refs=new Set();cur.f.forEach(f=>f[1].forEach(x=>isP(x[1])&&refs.add(x[1])));cur.h.forEach(h=>h[1].forEach(x=>isP(x)&&refs.add(x)));
const pf=prev.f,ph=Object.fromEntries(prev.h.map(h=>[h[0],h[1]]));
const frame=(f,i,cls)=>{const p=pf[i]&&pf[i][0]==f[0]?Object.fromEntries(pf[i][1]):null;return `<div class="frm ${cls}"><b>${f[0]}()</b>${cls.includes('top')?' <small class="k">TOP</small>':''}<div class="vars">${f[1].map(x=>{const ch=anim&&p&&p[x[0]]!==x[1]&&!cls.includes('fout')?' fl':'';return isP(x[1])?`<span class="var ptr${ch}" data-ptr="${x[1]}" data-k="${f[0]}.${x[0]}">${x[0]} = ${x[1]}</span>`:`<span class="var${ch}">${x[0]} = <b>${x[1]}</b></span>`}).join('')||'<span class="ex" style="margin:0">no locals yet</span>'}</div></div>`};
let S='';if(anim&&pf.length>cur.f.length)for(let i=pf.length-1;i>=cur.f.length;i--)S+=frame(pf[i],i,'fout');
for(let i=cur.f.length-1;i>=0;i--)S+=frame(cur.f[i],i,(i==cur.f.length-1?'top ':'')+(anim&&(i>=pf.length||pf[i][0]!=cur.f[i][0])?'fade':''));
