 .rd2{border-color:var(--rd)}.gone b{text-decoration:line-through;opacity:.5}

<header><div><small>INTERMEDIATE DSA · CLASS 5</small><h1>Prefix Sum 2, Special Index &amp; Leaders</h1></div>
<button class="tg" id="tn" onclick="notes=!notes;go()"></button></header>
<nav id="tabs"></nav>
<div class="wrap"><aside id="side"></aside>
<section class="card"><div id="main"></div>
<div class="nav"><button class="ghost" id="bk" onclick="bk()">‹ Back</button><span>← → keys work too</span><button class="btn" id="nx" onclick="nx()">Next ›</button></div></section></div>
<script>
const $=s=>document.querySelector(s);let T=0,S=0,notes=true,rev={},st={};
const code=(l,h)=>'<pre class="code" style="margin:10px 0">'+l.map((x,i)=>`<span class="${i==h?'hl':''}"><i>${i+1}</i>${x}</span>`).join('')+'</pre>';
const cells=(a,m={},c={})=>`<div class="cells">${a.map((v,j)=>`<div class="cell ${c[j]||''}">${m[j]?`<u>${m[j]}</u>`:''}<b>${v}</b><small>[${j}]</small></div>`).join('')}</div>`;
const cards=a=>`<div class="g">${a.map(x=>`<div class="cd"><small>${x[0]}</small><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`;
const W=(h,n,r)=>({h,n,r}),info=(h,b,n)=>W(h,n,()=>b);
const think=(h,q,a,n)=>({h,n,th:1,r:k=>`<div class="think"><span class="tag">THINK FIRST</span><h3>${q}</h3><button class="btn" onclick="rev['${k}']=!rev['${k}'];go()">${rev[k]?'Hide':'Reveal'} the answer</button></div>`+(rev[k]?`<div class="ans"><small>ANSWER</small><p>${a}</p></div>`:'')});
const quiz=(h,q,c,o,ok,ex,n)=>W(h,n,k=>`<div class="card2"><small class="k">QUIZ</small><h3>${q}</h3>${c?code(c):''}<div class="opts">${o.map((t,i)=>`<button class="opt ${st[k]!=null?(i==ok?'good':i==st[k]?'bad':''):''}" onclick="st['${k}']=${i};go()"><b>${'ABCD'[i]}</b>${t}</button>`).join('')}</div>${st[k]!=null?`<p class="ex">${ex}</p>`:''}</div>`);
const sorter=(h,items,L,tail,n)=>W(h,n,k=>`<div class="card2">${items.map((t,i)=>{const v=st[k+i];return `<div class="row"><span>${t[0]}</span>${L.map((l,x)=>`<button class="opt sm ${v!=null&&x==t[1]?'good':v==x?'bad':''}" onclick="st['${k}${i}']=${x};go()">${l}</button>`).join('')}</div>`}).join('')}${items.every((_,i)=>st[k+i]!=null)?`<p class="ex"><b>${tail}</b></p>`:''}</div>`);
const set=(f,v)=>`${f};go()`;
const X=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n');
const ST=(t,s)=>(s.st=t,s);
const walk=(h,q,c,S_,ans)=>W(h,0,k=>{const v=st[k]??0;return `<div class="card2"><small class="k">WORK IT OUT</small><h3>${q}</h3>${c?code(X(c)):''}${S_.slice(0,v).map((s,i)=>`<div class="row"><span style="flex:0 0 26px"><b>${i+1}</b></span><span><b>${s[0]}</b><br>${s[1]}</span></div>`).join('')}${v>=S_.length?`<p class="ex"><b>Answer: ${ans}</b></p>`:''}<div class="bt"><button class="btn" ${v>=S_.length?'disabled':''} onclick="${set(`st['${k}']=(st['${k}']??0)+1`)}">${v?'Next step':'Show step 1'}</button><button class="ghost" onclick="${set(`st['${k}']=0`)}">Reset</button><span class="ex">${v} / ${S_.length}</span></div></div>`});
const sl=(k,min,max,d,l)=>`<label>${l} = <b>${st[k]??d}</b> <input type="range" min="${min}" max="${max}" value="${st[k]??d}" onchange="st.${k}=+this.value;go()"></label>`;
const PS=(a)=>a.reduce((r,x,i)=>(r.push((r[i-1]??0)+x),r),[]);
const qs=(k,Q)=>`<div class="bt">${Q.map((q,i)=>`<button class="${i==(st[k]??0)?'btn':'ghost'}" onclick="${set(`st.${k}=${i};st.${k}j=0`)}">s=${q[0]}, e=${q[1]}</button>`).join('')}</div>`;
const btn=(k,max,first,nxt)=>{const v=st[k]??0;return `<div class="bt"><button class="btn" ${v>=max?'disabled':''} onclick="${set(`st.${k}=(st.${k}??0)+1`)}">${v?nxt:first}</button><button class="ghost" onclick="${set(`st.${k}=0`)}">Reset</button><span class="ex">${v} / ${max}</span></div>`};
// range brute force, ONE index per click
const rbf=(k,A,Q,yes,my,mn,u,what)=>{const [L,R]=Q[st[k]??0],j=st[k+'j']??0,len=R-L+1,sh=Math.min(j,len);let s=0,c={},m='';
for(let x=0;x<sh;x++){const i=L+x,y=yes(A[i],i);c[i]=(y?'sw':'emp')+(x==sh-1?' sel':'');if(y)s+=u(A[i]);m=y?my(A[i],i):mn(A[i],i)}
const mk={[L]:'s',[R]:'e'};if(L==R)mk[L]='s,e';
return qs(k,Q)+cells(A,mk,c)+`<p class="ex">${sh?m:'Nothing checked yet. Press the button to look at index '+L+'.'}</p><p class="ex">Checked <b>${sh}</b> of ${len} indices · running ${what} <b>${s}</b></p>`+(sh>=len?`<p class="ex"><b>Query (${L}, ${R}) = ${s}</b> after ${len} checks. Every query repeats this loop.</p>`:'')+`<div class="bt"><button class="btn" ${sh>=len?'disabled':''} onclick="${set(`st.${k}j=(st.${k}j??0)+1`)}">${sh?'Check next index':'Check index '+L}</button><button class="ghost" onclick="${set(`st.${k}j=0`)}">Reset</button></div>`};
// build a prefix array one cell at a time
const pfb=(k,A,eff,msg,cl,hl,nm)=>{const i=st[k]??0,p=PS(eff);return `<p class="ex">A</p>`+cells(A,{[i]:'i'},{[i]:'sel'})+`<p class="ex">counted values</p>`+cells(eff.map((v,x)=>x<=i?v:'·'),{},Object.fromEntries(eff.map((v,x)=>[x,x<=i?(v?'sw':'emp'):'emp'])))+`<p class="ex">${nm}</p>`+cells(A.map((_,x)=>x<=i?p[x]:'·'),{},{[i]:'sw'})+code(cl,hl(i))+`<p class="ex">${msg(i,p)}</p>`+btn(k,A.length-1,'Next cell','Next cell')};
// improved range query visual: blue = pf[e], green = removed, yellow = answer
const pfq=(k,A,eff,Q,nm)=>{const [L,R]=Q[st[k]??0],g=st[k+'j']??0,p=PS(eff),pl=L?p[L-1]:0,n=A.length;const col=(i)=>{let t='';if(g>=1&&i<=R)t='var(--ac)';if(g>=2&&i<L)t='var(--gr)';if(g>=3&&i>=L&&i<=R)t='var(--ye)';if(!g&&i>=L&&i<=R)t='var(--ye)';return t?`background:color-mix(in srgb,${t} 32%,var(--cc));border-color:${t}`:''};
const row=(l,f)=>`<span class="l">${l}</span>`+A.map((_,i)=>f(i)).join('');const bar=(l,lo,hi,c)=>row(l,i=>`<i class="bn" style="${i>=lo&&i<=hi?`background:${c};border-style:solid`:''}"></i>`);
let h=`<div class="pgw"><div class="pg" style="grid-template-columns:96px repeat(${n},minmax(36px,1fr))">`+row('index',i=>`<span class="l" style="text-align:center">${i}</span>`)+row('A',i=>`<span class="c" style="${col(i)}">${A[i]}</span>`)+row('counted',i=>`<span class="c" style="opacity:.8;${col(i)}">${eff[i]}</span>`)+row(nm,i=>`<span class="c" style="${g>=1&&i==R?'border-color:var(--ac);background:color-mix(in srgb,var(--ac) 45%,var(--cc))':''}${g>=2&&L&&i==L-1?'border-color:var(--gr);background:color-mix(in srgb,var(--gr) 45%,var(--cc))':''}">${p[i]}</span>`);
if(g>=1)h+=bar(nm+'['+R+'] covers',0,R,'var(--ac)');if(g>=2)h+=L?bar(nm+'['+(L-1)+'] covers',0,L-1,'var(--gr)'):row('nothing before',()=>'<i class="bn"></i>');if(g>=3)h+=bar('left over',L,R,'var(--ye)');h+='</div></div>';
const T_=[`Yellow = the range ${L} to ${R} we want. Only the "counted" row is added.`,`<b>Blue:</b> ${nm}[${R}] = <b>${p[R]}</b> adds everything from index 0 to ${R}. That is the range <i>plus</i> a prefix we do not want.`,L?`<b>Green:</b> ${nm}[${L-1}] = <b>${pl}</b> is exactly that unwanted prefix, indices 0 to ${L-1}.`:`s = 0, so there is no prefix to remove. Treat ${nm}[−1] as 0.`,`Blue − green leaves only yellow: ${p[R]} − ${pl} = <b>${p[R]-pl}</b>. One subtraction, whatever the range size.`];
return qs(k,Q)+h+`<p class="ex">${T_[g]}</p>`+`<div class="bt"><button class="btn" ${g>=3?'disabled':''} onclick="${set(`st.${k}j=(st.${k}j??0)+1`)}">${g?'Next':'Show '+nm+'[e]'}</button><button class="ghost" onclick="${set(`st.${k}j=0`)}">Reset</button></div>`};
const A1=[2,3,1,6,4,5],Q1=[[1,3],[2,5],[0,5],[2,2]],E1=A1.map((x,i)=>i%2?x:0);
const A3=[4,7,2,9,6,5,8,3],Q3=[[0,3],[2,5],[3,7],[4,4]],E3=A3.map(x=>x%2?0:1);
const A2=[4,3,2,7,6,-2],PE=PS(A2.map((x,i)=>i%2?0:x)),PO=PS(A2.map((x,i)=>i%2?x:0));
const sum=(b,o)=>b.reduce((s,x,i)=>s+(i%2==o?x:0),0);
const LA=[[16,17,4,3,5,2],[10,8,6,4,2]];
const lsel=k=>`<div class="bt">${LA.map((a,i)=>`<button class="${i==(st[k]??0)?'btn':'ghost'}" onclick="${set(`st.${k}=${i};st.${k}j=0`)}">[${a.join(', ')}]</button>`).join('')}</div>`;
const lev=a=>{const e=[];a.forEach((x,i)=>{let ok=true;for(let j=i+1;j<a.length;j++){const g=x>a[j];e.push({i,j,g});if(!g){ok=false;break}}e.push({i,v:ok})});return e};
const TABS=[
{t:'Recap & plan',s:[
think('Recap before we start','pf[i] = pf[i-1] + A[i] lets us answer any range sum as pf[e] − pf[s−1]. What if we only want the elements at <b>odd indices</b> in the range?','Pretend every even-indexed element is <b>0</b> and build the prefix array on that. Same subtraction, new building rule.','Take one or two guesses before revealing.'),
info('Today’s plan','<p>Four problems. All reuse the same prefix-sum idea with a small twist.</p>'+cards([['Problem 1','Sum of odd-indexed elements','Brute force, then PSo'],['Problem 2','Special index','Remove one index: left stays, right flips'],['Problem 3','Even numbers in a range','Prefix count instead of prefix sum'],['Problem 4','Leaders in an array','Scan from the right, keep the max']]),'Every brute force below runs one step per click. Let students predict each step.')]},
{t:'Odd-indexed sum',s:[
think('Problem 1','A = [2, 3, 1, 6, 4, 5]. Query (1, 3): sum of the elements at <b>odd indices</b> from index 1 to 3. What is the answer, and what would you do for thousands of queries?','Odd indices in 1..3 are 1 and 3: 3 + 6 = <b>9</b>. Brute force loops from s to e for every query: O(N·Q).','Give 5 minutes to think. Ask for the method first.'),
ST('BRUTE FORCE',W('Brute force, one index at a time','Press the button to look at each index in the range. Add it only if the index is odd.',k=>rbf('b1',A1,Q1,(v,i)=>i%2==1,(v,i)=>`Index ${i} is odd → add A[${i}] = ${v}.`,(v,i)=>`Index ${i} is even → skip it.`,v=>v,'sum'),'Pause on every click and ask: odd or even?')),
ST('OBSERVE',think('Which elements count?','Range sum needs a prefix array. But we only want odd-indexed elements. How do we make an ordinary prefix sum ignore the even indices?','Assume the even-indexed elements are <b>0</b>, then build the prefix sum. Zeros add nothing, so they are skipped automatically.','Hint: should we take the prefix of the whole array?')),
ST('OPTIMIZE',W('Build PSo cell by cell','i odd: add A[i]. i even: carry the previous value forward.',k=>pfb('p1',A1,E1,(i,p)=>i==0?'Index 0 is even → PSo[0] = 0.':i%2?`i = ${i} is odd → PSo[${i}] = PSo[${i-1}] + A[${i}] = ${p[i-1]} + ${A1[i]} = <b>${p[i]}</b>.`:`i = ${i} is even → carry forward: PSo[${i}] = PSo[${i-1}] = <b>${p[i]}</b>.`,['PSo[0] = 0','for (i → 1 to N-1)','    if (i % 2 == 1) PSo[i] = PSo[i-1] + A[i]','    else            PSo[i] = PSo[i-1]'],i=>i==0?0:i%2?2:3,'PSo'),'Final PSo = 0 3 3 9 9 14.')),
ST('OPTIMIZE',quiz('Quiz 1','Build the odd-index prefix sum for [2, 4, 3, 1, 5].',null,['1, 6, 9, 10, 15','2, 2, 5, 5, 10','0, 4, 4, 5, 5','0, 4, 7, 8, 8'],2,'Treat even indices as 0: 0,4,0,1,0 → prefix 0, 4, 4, 5, 5.','Ask them to write the counted row first.')),
ST('OPTIMIZE',W('Answer a query: see the range','Step through. Blue minus green leaves exactly the yellow range.',k=>pfq('q1',A1,E1,Q1,'PSo'),'Try (0,5) to show s = 0, and (2,2) to show an answer of 0.')),
ST('COMPARE',info('Complexity','<p>Same machinery as the plain prefix sum.</p>'+cards([['BRUTE FORCE','Loop s to e per query','TC O(N·Q) · SC O(1)'],['PREFIX SUM','Build PSo once, subtract per query','TC O(N+Q) · SC O(N)'],['QUERY','if s == 0: PSo[e] else PSo[e] − PSo[s−1]','O(1) each']]),'Mention the s == 0 edge case.'))]},
{t:'Special index',s:[
think('Problem 2','A = [4, 3, 2, 7, 6, −2]. An index is <b>special</b> if, after removing it, sum of even-indexed elements = sum of odd-indexed elements. How would you check one index? How many are special?','Remove it, re-index, add up both sets. Answer: <b>2</b> special indices (i = 0 and i = 2).','Do not reveal the count until the brute force finishes.'),
ST('BRUTE FORCE',W('Brute force: remove each index in turn','One removal per click. Rebuild the array and re-sum both parities.',k=>{const v=st.sp??0;let cnt=0,rows='';for(let x=0;x<v;x++){const b=A2.filter((_,y)=>y!=x),e=sum(b,0),o=sum(b,1);if(e==o)cnt++;rows+=`<div class="row"><span>remove i=${x}: [${b.join(', ')}] → Se = ${e}, So = ${o}</span><b style="color:var(--${e==o?'gr':'rd'})">${e==o?'special':'no'}</b></div>`}
let top='';if(v){const x=v-1,b=A2.filter((_,y)=>y!=x),e=sum(b,0),o=sum(b,1),c={};c[x]='rd2 gone';top=`<p class="ex">Original (index ${x} removed)</p>`+cells(A2,{[x]:'✕'},c)+`<p class="ex">New array, re-indexed: even positions yellow, odd positions green</p>`+cells(b,Object.fromEntries(b.map((_,j)=>[j,j%2?'odd':'even'])),Object.fromEntries(b.map((_,j)=>[j,j%2?'sw':'rg'])))+`<p class="ex">Se = ${b.filter((_,j)=>j%2==0).join(' + ')} = <b>${e}</b> · So = ${b.filter((_,j)=>j%2).join(' + ')||0} = <b>${o}</b> → <b>${e==o?'equal: special!':'not equal'}</b></p>`}
return top+rows+`<p class="ex">Special so far: <b>${cnt}</b>${v>=6?' · final answer <b>'+cnt+'</b>. Each removal costs O(N), total O(N²).':''}</p>`+btn('sp',6,'Remove index 0','Remove next index')},'Ask: what changes in the array after a removal?')),
ST('QUIZ',quiz('Quiz 2','A = [4, 1, 3, 7, 10]. Sum of elements at <b>ODD</b> indices after removing index 2?',null,['8','14','11','9'],2,'New array [4,1,7,10]. Odd positions: 1 + 10 = 11. Odd sum of left [0..1] + even sum of right [3..4].','Notice which elements flipped parity.')),
ST('QUIZ',quiz('Quiz 3','A = [2, 3, 1, 4, 0, −1, 2, −2, 10, 8]. ODD-index sum after removing index 3?',null,['8','15','12','21'],1,'Odd in [0..2]: A[1] = 3. Even in [4..9]: A[4]+A[6]+A[8] = 0+2+10. Total 15.','')),
ST('QUIZ',quiz('Quiz 4','Same array. EVEN-index sum after removing index 3?',null,['15','8','10','12'],1,'Even in [0..2]: 2 + 1. Odd in [4..9]: A[5]+A[7]+A[9] = −1−2+8. Total 3 + 5 = 8.','')),
ST('OBSERVE',W('Left stays, right flips','Choose the removed index, then reveal each part.',k=>{const i=st.so??2,g=st.sog??0,n=6,c={},m={};A2.forEach((_,j)=>{if(j==i){if(g>=1){c[j]='rd2 gone';m[j]='✕'}}else if(j<i){if(g>=1){c[j]='sw';m[j]=j%2?'odd':'even'}}else if(g>=2){c[j]='rd2';m[j]=(j-1)%2?'odd':'even'}});const Se=(i?PE[i-1]:0)+PO[n-1]-PO[i],So=(i?PO[i-1]:0)+PE[n-1]-PE[i];
const T_=['Pick an index to remove. Think about which elements change position.','<b>Green:</b> everything left of i keeps its index, so its parity stays the same.','<b>Red:</b> everything right of i moves one place left, so odd becomes even and even becomes odd. Labels show the NEW parity.',`<b>newEven</b> = evenLeft + oddRight = ${i?PE[i-1]:0} + ${PO[n-1]-PO[i]} = <b>${Se}</b><br><b>newOdd</b> = oddLeft + evenRight = ${i?PO[i-1]:0} + ${PE[n-1]-PE[i]} = <b>${So}</b><br>${Se==So?'Equal → <b>special</b>.':'Not equal → not special.'}`];
return `<div class="bt">${A2.map((_,j)=>`<button class="${j==i?'btn':'ghost'}" onclick="${set(`st.so=${j};st.sog=0`)}">i=${j}</button>`).join('')}</div>`+cells(A2,m,c)+`<p class="ex">${T_[g]}</p>`+btn('sog',3,'Left part','Next')},'Each part is a prefix-array lookup.')),
ST('OPTIMIZE',info('Code and complexity','<p>Build PSe and PSo once, then each index is O(1). Treat PS[−1] as 0 (that handles i = 0).</p>'+code(['for (i → 0 to n-1) {','    Se = PSe[i-1] + PSo[n-1] - PSo[i]','    So = PSo[i-1] + PSe[n-1] - PSe[i]','    if (Se == So) count++','}'])+cards([['BRUTE FORCE','Remove and re-sum','TC O(N²) · SC O(N)'],['PREFIX','PSe and PSo','TC O(N) · SC O(N)']]),'Handle i = 0 separately in code.'))]},
{t:'Even count in range',s:[
think('Problem 3','A = [4, 7, 2, 9, 6, 5, 8, 3]. Query (2, 5): how many <b>even numbers</b> are there from index 2 to 5? What changes compared with Problem 1?','Elements 2 and 6 → <b>2</b>. Problem 1 tested the <b>index</b>; now we test the <b>element</b> (A[i] % 2 == 0) and add <b>1</b> to count instead of adding the value.','The script heading says sum, but the pseudocode counts.'),
ST('BRUTE FORCE',W('Brute force, one element at a time','Test A[i] % 2 for each element in the range.',k=>rbf('b3',A3,Q3,(v)=>v%2==0,(v,i)=>`A[${i}] = ${v} is even → count it (+1).`,(v,i)=>`A[${i}] = ${v} is odd → skip it.`,()=>1,'count'),'Contrast with Problem 1: the test is on the value.')),
ST('OPTIMIZE',W('Build the prefix count','Even value: previous + 1. Odd value: carry forward.',k=>pfb('p3',A3,E3,(i,p)=>A3[i]%2==0?`A[${i}] = ${A3[i]} is even → PSe[${i}] = ${i?'PSe['+(i-1)+'] + 1 = '+p[i-1]+' + 1':'1'} = <b>${p[i]}</b>.`:`A[${i}] = ${A3[i]} is odd → carry forward: PSe[${i}] = PSe[${i-1}] = <b>${p[i]}</b>.`,['PSe[0] = (A[0] % 2 == 0) ? 1 : 0','for (i → 1 to N-1)','    if (A[i] % 2 == 0) PSe[i] = PSe[i-1] + 1','    else               PSe[i] = PSe[i-1]'],i=>i==0?0:A3[i]%2==0?2:3,'PSe'),'Script pseudocode sets PSe[0] = 1 always. That is wrong when A[0] is odd, so the corrected line is shown here.')),
ST('OPTIMIZE',W('Answer a query: see the range','Identical to Problem 1: only the counted row changed.',k=>pfq('q3',A3,E3,Q3,'PSe'),'Same subtraction PSe[e] − PSe[s−1].')),
ST('COMPARE',info('Complexity','<p>Same query formula, different build rule.</p>'+cards([['BRUTE FORCE','Test each element per query','TC O(N·Q)'],['PREFIX COUNT','Build PSe once','TC O(N+Q) · SC O(N)']]),''))]},
{t:'Leaders',s:[
think('Problem 4','An element is a <b>leader</b> if it is strictly greater than every element to its right. The last element always is. A = [16, 17, 4, 3, 5, 2]. Which are leaders?','<b>17, 5, 2</b>.','Let learners check each element aloud.'),
ST('QUIZ',quiz('Quiz 5','How many leaders in [10, 8, 6, 4, 2]?',null,['1','2','3','5'],3,'Each element beats everything on its right, so all <b>5</b> are leaders.','')),
ST('BRUTE FORCE',W('Brute force: compare with everything on the right','One comparison per click. Stop as soon as a bigger or equal element appears.',k=>{const a=LA[st.lb??0],ev=lev(a),v=st.lbj??0,sh=ev.slice(0,v),c={};let msg='Press the button to start with index 0.',cmp=0;sh.forEach((e,x)=>{if(e.v!==undefined)c[e.i]=e.v?'sw':'rd2';else cmp++});const l=sh[sh.length-1];if(l){if(l.v===undefined){c[l.i]='sel';c[l.j]='rg';msg=`Is A[${l.i}] = ${a[l.i]} > A[${l.j}] = ${a[l.j]}? ${l.g?'Yes, keep checking.':'No → not a leader, stop.'}`}else msg=l.v?`A[${l.i}] = ${a[l.i]} beat everything on its right → <b>leader</b>.`:`A[${l.i}] = ${a[l.i]} is not a leader.`}
const done=v>=ev.length;return lsel('lb')+cells(a,{},c)+`<p class="ex">${msg}</p><p class="ex">Leaders so far: <b>${a.filter((_,i)=>c[i]=='sw').join(', ')||'none'}</b> · comparisons used: <b>${cmp}</b>${done?' · O(N²) in the worst case.':''}</p>`+`<div class="bt"><button class="btn" ${done?'disabled':''} onclick="${set('st.lbj=(st.lbj??0)+1')}">${v?'Next comparison':'Start'}</button><button class="ghost" onclick="${set('st.lbj=0')}">Reset</button></div>`},'Notice the repeated work on the right side.')),
ST('OPTIMIZE',think('Spot the waste','Element 3 is compared with 5 and 2. Do we need both?','No: it only needs to beat the <b>maximum</b> on its right. Scan from the right and remember that maximum.','')),
ST('OPTIMIZE',W('Scan from the right','Keep max_from_right. If A[i] > max, it is a leader and the max updates.',k=>{const a=LA[st.lo??0],n=a.length,g=st.loj??0;let mx=-1e9,c={},msg='Start at the rightmost element.',hl=0;for(let t=0;t<g;t++){const i=n-1-t,ok=t==0||a[i]>mx;c[i]=ok?'sw':'rd2';if(t==g-1){c[i]+=' sel';msg=t==0?`A[${i}] = ${a[i]} is the last element → always a leader. max = ${a[i]}.`:ok?`A[${i}] = ${a[i]} > max ${mx}? Yes → leader, new max = ${a[i]}.`:`A[${i}] = ${a[i]} > max ${mx}? No → not a leader, max stays ${mx}.`;hl=t==0?0:ok?3:2}if(ok)mx=a[i]}
return lsel('lo')+cells(a,{},c)+code(['max = A[N-1]; leaders.push(max)','for (i → N-2 down to 0)','    if (A[i] > max)','        leaders.push(A[i]); max = A[i]'],hl)+`<p class="ex">${msg}</p><p class="ex">max_from_right = <b>${g?mx:'·'}</b> · leaders: <b>${a.filter((_,i)=>(c[i]||'').startsWith('sw')).reverse().join(', ')||'none'}</b> · comparisons: <b>${Math.max(0,g-1)}</b></p>`+`<div class="bt"><button class="btn" ${g>=n?'disabled':''} onclick="${set('st.loj=(st.loj??0)+1')}">${g?'Next element':'Start from the right'}</button><button class="ghost" onclick="${set('st.loj=0')}">Reset</button></div>`},'Try both arrays. The second one makes every element a leader.')),
ST('COMPARE',info('Complexity','<p>One pass instead of N passes.</p>'+cards([['BRUTE FORCE','Two nested loops','TC O(N²) · SC O(1)'],['RIGHT SCAN','One variable: max_from_right','TC O(N) · SC O(1)']]),''))]}
];
function go(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;
$('#tn').textContent='Instructor notes: '+(notes?'on':'off');
$('#tabs').innerHTML=TABS.map((x,i)=>`<button class="${i==T?'on':''}" onclick="T=${i};S=0;go()"><i>0${i}</i>${x.t}</button>`).join('');
$('#side').innerHTML=`<h3>${tb.t}</h3>`+tb.s.map((x,i)=>`<button class="${i==S?'on':''}" onclick="S=${i};go()"><span>${i+1}</span>${x.h}</button>`).join('');
$('#main').innerHTML=`<small class="k">${tb.t.toUpperCase()} · STEP ${S+1} OF ${tb.s.length}</small>${tb.s.every(x=>x.st)?`<div class="stg">${[...new Set(tb.s.map(x=>x.st))].map(g=>`<span class="${g==s.st?'on':''}">${g}</span>`).join('›')}</div>`:''}<h2>${s.h}</h2>${s.r(k)}${notes&&s.n?`<div class="ins"><small>INSTRUCTOR</small><p>${s.n}</p></div>`:''}`;
const last=S==tb.s.length-1,nt=TABS[T+1];
$('#nx').textContent=s.th&&!rev[k]?'Reveal the answer ›':last?(nt?'Next: '+nt.t+' ›':'Done'):'Next ›';
$('#nx').disabled=last&&!nt&&!(s.th&&!rev[k]);$('#bk').disabled=!T&&!S}
function nx(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;if(s.th&&!rev[k])rev[k]=1;else if(S<tb.s.length-1)S++;else if(T<TABS.length-1){T++;S=0}go()}
function bk(){if(S)S--;else if(T){T--;S=TABS[T].s.length-1}go()}
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')nx();if(e.key=='ArrowLeft')bk()});
go();
</script></body></html>
