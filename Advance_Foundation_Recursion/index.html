<header><div><small>DSA · RECURSION</small><h1>Recursion: Call Stack, Factorial &amp; Fibonacci</h1></div>
<button class="tg" id="tn" onclick="notes=!notes;go()"></button></header>
<nav id="tabs"></nav>
<div class="wrap"><aside id="side"></aside>
<section class="card"><div id="main"></div>
<div class="nav"><button class="ghost" id="bk" onclick="bk()">‹ Back</button><span>← → keys work too</span><button class="btn" id="nx" onclick="nx()">Next ›</button></div></section></div>
<script>
const $=s=>document.querySelector(s);let T=0,S=0,notes=true,rev={},st={};
const code=(l,h)=>'<pre class="code" style="margin:10px 0">'+l.map((x,i)=>`<span class="${i==h?'hl':''}"><i>${i+1}</i>${x}</span>`).join('')+'</pre>';
const cells=(a,m={},c={})=>`<div class="cells">${a.map((v,j)=>`<div class="cell ${c[j]||''}">${m[j]?`<u>${m[j]}</u>`:''}<b>${v}</b><small>[${j}]</small></div>`).join('')}</div>`;
const cards=a=>`<div class="g">${a.map(x=>`<div class="cd"><small>${x[0]}</small><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`;
const W=(h,n,r)=>({h,n,r}),info=(h,b,n)=>W(h,n,()=>b);
const think=(h,q,a,n)=>({h,n,th:1,r:k=>`<div class="think"><span class="tag">THINK FIRST</span><h3>${q}</h3><button class="btn" onclick="rev['${k}']=!rev['${k}'];go()">${rev[k]?'Hide':'Reveal'} the answer</button></div>`+(rev[k]?`<div class="ans"><small>ANSWER</small><p>${a}</p></div>`:'')});
const pickQ=(k,i,ok)=>{if(st[k]===ok)return;const t=st[k+'w']||[];if(i!==ok&&!t.includes(i))t.push(i);st[k+'w']=t;st[k]=i;st[k+'a']=(st[k+'a']||0)+1;go()};
const quiz=(h,q,c,o,ok,why,n)=>W(h,n,k=>{const R=Array.isArray(why)?why:o.map((_,i)=>i==ok?why:'This option does not match. Re-read the question and try again.'),s=st[k],t=st[k+'w']||[],done=s===ok,at=st[k+'a']||0;
return `<div class="card2"><small class="k">QUIZ</small><h3>${q}</h3>${c?code(c):''}<div class="opts">${o.map((x,i)=>`<button class="opt ${done&&i==ok?'good':t.includes(i)?'bad':''}" ${done?'disabled':''} onclick="pickQ('${k}',${i},${ok})"><b>${'ABCD'[i]}</b>${x}</button>`).join('')}</div>`+(s==null?'':done?`<div class="qf good"><b>✓ Correct${at>1?' (after '+at+' tries)':' on the first try'}.</b> ${R[ok]}</div>`:`<div class="qf bad"><b>✗ Option ${'ABCD'[s]} is not right.</b> ${R[s]}<div class="bt"><button class="btn" onclick="st['${k}']=null;go()">Try again</button></div></div>`)+`</div>`});
const sorter=(h,items,L,tail,n)=>W(h,n,k=>`<div class="card2">${items.map((t,i)=>{const v=st[k+i];return `<div class="row"><span>${t[0]}</span>${L.map((l,x)=>`<button class="opt sm ${v!=null&&x==t[1]?'good':v==x?'bad':''}" onclick="st['${k}${i}']=${x};go()">${l}</button>`).join('')}</div>`}).join('')}${items.every((_,i)=>st[k+i]!=null)?`<p class="ex"><b>${tail}</b></p>`:''}</div>`);
const set=(f,v)=>`${f};go()`;
const X=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n');
const ST=(t,s)=>(s.st=t,s);
const walk=(h,q,c,S_,ans)=>W(h,0,k=>{const v=st[k]??0;return `<div class="card2"><small class="k">WORK IT OUT</small><h3>${q}</h3>${c?code(X(c)):''}${S_.slice(0,v).map((s,i)=>`<div class="row"><span style="flex:0 0 26px"><b>${i+1}</b></span><span><b>${s[0]}</b><br>${s[1]}</span></div>`).join('')}${v>=S_.length?`<p class="ex"><b>Answer: ${ans}</b></p>`:''}<div class="bt"><button class="btn" ${v>=S_.length?'disabled':''} onclick="${set(`st['${k}']=(st['${k}']??0)+1`)}">${v?'Next step':'Show step 1'}</button><button class="ghost" onclick="${set(`st['${k}']=0`)}">Reset</button><span class="ex">${v} / ${S_.length}</span></div></div>`});
const sl=(k,min,max,d,l)=>`<label>${l} = <b>${st[k]??d}</b> <input type="range" min="${min}" max="${max}" value="${st[k]??d}" onchange="st.${k}=+this.value;go()"></label>`;
const btn=(k,max,first,nxt)=>{const v=st[k]??0;return `<div class="bt"><button class="btn" ${v>=max?'disabled':''} onclick="${set(`st.${k}=(st.${k}??0)+1`)}">${v?nxt:first}</button><button class="ghost" onclick="${set(`st.${k}=0`)}">Reset</button><span class="ex">${v} / ${max}</span></div>`};
const pick=(k,labels)=>`<div class="bt">${labels.map((l,i)=>`<button class="${i==(st[k]??0)?'btn':'ghost'}" onclick="${set(`st.${k}=${i};st.${k}j=0`)}">${l}</button>`).join('')}</div>`;
const rvl=(k,items)=>{const v=st[k]??0;return items.slice(0,v).map(x=>`<div class="card2" style="padding:10px 14px;margin:8px 0"><small class="k">${x[0]}</small><br><b>${x[1]}</b>${x[2]?`<br><span class="ex">${x[2]}</span>`:''}</div>`).join('')+btn(k,items.length,'Reveal first','Reveal next')};
const cb=(k,L,N)=>{const v=st[k]??0;return (v?code(L.slice(0,v),v-1)+`<p class="ex">${N[v-1]}</p>`:`<p class="ex">Empty function. Press the button to write the first line.</p>`)+btn(k,L.length,'Write first line','Write next line')};
// ---------- recursion tracer ----------
const TR=(kind,args)=>{const S=[],stk=[],out=[];let calls=0,mx=0,last;const iv=['sum','fact','fs','fib'].includes(kind);
const snap=(note,line,res)=>S.push({st:stk.map(f=>[f.t,f.s]),out:[...out],note,line,calls,d:stk.length,mx,iv,rv:last,res});
const enter=t=>{stk.push({t,s:'running'});calls++;mx=Math.max(mx,stk.length);snap(`Call ${t}: a new frame is pushed on top of the stack.`,0)};
const leave=(note,line,val)=>{stk[stk.length-1].s=val===undefined?'done':'returns '+val;if(val!==undefined)last=val;snap(note,line);stk.pop()};
const wait=s=>{stk[stk.length-1].s=s};
const R={
sum:N=>{enter(`sum(${N})`);if(N==0){leave('Base case N == 0: return 0 without calling again.',1,0);return 0}wait(`waiting for sum(${N-1})`);const c=R.sum(N-1),r=c+N;leave(`Back in sum(${N}): sum(${N-1}) gave ${c}, so return ${c} + ${N} = ${r}.`,3,r);return r},
fact:N=>{enter(`factorial(${N})`);if(N==0){leave('Base case N == 0: 0! = 1, return 1.',1,1);return 1}wait(`waiting for factorial(${N-1})`);const c=R.fact(N-1),r=N*c;leave(`Back in factorial(${N}): return ${N} × ${c} = ${r}.`,2,r);return r},
inc:N=>{enter(`increasing(${N})`);if(N==0){leave('Base case N == 0: nothing to print, return.',1);return}wait(`waiting for increasing(${N-1})`);R.inc(N-1);out.push(N);leave(`The smaller problem is finished, so print ${N} now, then return.`,3)},
dec:N=>{enter(`decreasing(${N})`);if(N==0){leave('Base case N == 0: return.',1);return}out.push(N);snap(`Print ${N} first, before the recursive call.`,2);wait(`waiting for decreasing(${N-1})`);R.dec(N-1);leave(`decreasing(${N}) is finished: return.`,3)},
arr:(A,i)=>{enter(`printArray(arr, ${i})`);if(i==A.length){leave(`Base case: index ${i} equals the size, nothing left to print.`,1);return}out.push(A[i]);snap(`Print arr[${i}] = ${A[i]}.`,2);wait(`waiting for printArray(arr, ${i+1})`);R.arr(A,i+1);leave('The rest is printed: return.',3)},
fs:(A,i)=>{enter(`findSum(arr, ${i})`);if(i==A.length-1){leave(`Base case: last element, return arr[${i}] = ${A[i]}.`,1,A[i]);return A[i]}wait(`waiting for findSum(arr, ${i+1})`);const c=R.fs(A,i+1),r=A[i]+c;leave(`Return arr[${i}] + rest = ${A[i]} + ${c} = ${r}.`,2,r);return r},
fib:N=>{enter(`fibonacci(${N})`);if(N<2){leave(`Base case: fibonacci(${N}) = ${N}.`,N==0?1:2,N);return N}wait(`waiting for fibonacci(${N-1})`);const a=R.fib(N-1);wait(`got ${a}, waiting for fibonacci(${N-2})`);const b=R.fib(N-2),r=a+b;leave(`fibonacci(${N}) = ${a} + ${b} = ${r}.`,3,r);return r}};
const res=R[kind](...args);snap('The first call has returned: the stack is empty and the program carries on.',-1,res);return S};
const KC={sum:['function sum(N)','    if (N == 0) return 0          // base case','    ans = sum(N - 1)              // subproblem','    return ans + N'],fact:['function factorial(N)','    if (N == 0) return 1          // base case','    return N * factorial(N - 1)'],inc:['function increasing(N)','    if (N == 0) return','    increasing(N - 1)             // subproblem','    print(N)'],dec:['function decreasing(N)','    if (N == 0) return','    print(N)','    decreasing(N - 1)'],arr:['function printArray(arr, index)','    if (index == arr.size) return','    print(arr[index])','    printArray(arr, index + 1)'],fs:['function findSum(arr, index)','    if (index == arr.size - 1) return arr[index]','    return arr[index] + findSum(arr, index + 1)'],fib:['function fibonacci(N)','    if (N == 0) return 0','    if (N == 1) return 1','    return fibonacci(N - 1) + fibonacci(N - 2)']};
const rb=(k,max)=>{const v=st[k]??0;return `<div class="bt"><button class="btn" ${v>=max?'disabled':''} onclick="${set(`st.${k}=(st.${k}??0)+1`)}">${v?'Next step':'First call'}</button><button class="ghost" ${v>=max?'disabled':''} onclick="${set(`st.${k}=Math.min(${max},(st.${k}??0)+5)`)}">+5 steps</button><button class="ghost" onclick="${set(`st.${k}=0`)}">Reset</button><span class="ex">${v} / ${max}</span></div>`};
const recv=(k,S,L,start)=>{const v=Math.min(st[k]??0,S.length),s=v?S[v-1]:null;
return code(L,s?s.line:-1)+`<div class="g" style="grid-template-columns:1.3fr 1fr"><div class="cd"><small>CALL STACK (top first)</small>${s&&s.st.length?[...s.st].reverse().map((f,i)=>`<div class="card2" style="padding:8px 12px;margin:6px 0;${i==0?'border-color:var(--ac)':''}"><b>${f[0]}</b> <span class="ex">${f[1]}</span>${i==0?' <small class="k">TOP</small>':''}</div>`).join(''):'<p>empty</p>'}</div><div class="cd">${S[0]&&S[0].iv?`<small>RETURN VALUE</small><p><b>${s&&s.res!==undefined?s.res:(s&&s.rv!==undefined?s.rv:'·')}</b></p><p class="ex">${s&&s.res!==undefined?'final result of the first call':(s&&s.rv!==undefined?'most recent value returned by a call':'nothing has returned yet')}</p>`:`<small>OUTPUT</small><p><b>${s&&s.out.length?s.out.join(' '):'·'}</b></p>${s&&s.out.length?'':'<p class="ex">nothing printed yet</p>'}`}<small>COUNTERS</small><p class="ex">calls so far: <b>${s?s.calls:0}</b><br>stack depth now: <b>${s?s.d:0}</b><br>deepest so far: <b>${s?s.mx:0}</b></p></div></div><p class="ex">${s?s.note:start}</p>`+rb(k,S.length)};
const recw=(pk,opts,start)=>{const o=opts[st[pk]??0];return pick(pk,opts.map(x=>x.l))+recv(pk+'j',TR(o.kind,o.a),KC[o.kind],start||'Press the button to make the first call.')};
// ---------- expression trace (hand-written) ----------
const EXL=['function add(x, y): return x + y','function mul(x, y): return x * y','function sub(x, y): return x - y','function main():','    x = 10, y = 20','    print(sub(mul(add(x, y), 30), 75))'];
const M0='main · x=10, y=20';
const EXR=[[3,['main'],'main() starts: its frame is pushed.'],[4,[M0],'x and y live in main’s frame.'],[5,[M0],'print needs sub(…), which needs mul(…), which needs add(10, 20). Arguments are worked out before a function is called, so add goes first. Only main is on the stack so far.'],[0,[M0,'add(10, 20) · running'],'add(10, 20) is called: a new frame is pushed on top of main.'],[0,[M0,'add(10, 20) · returns 30'],'add returns 10 + 20 = 30. Its frame is popped next.'],[1,[M0,'mul(30, 30) · running'],'With add’s result 30 in hand, mul(30, 30) is called. add’s frame is already gone.'],[1,[M0,'mul(30, 30) · returns 900'],'mul returns 30 × 30 = 900. Its frame is popped next.'],[2,[M0,'sub(900, 75) · running'],'Now sub(900, 75) is called.'],[2,[M0,'sub(900, 75) · returns 825'],'sub returns 900 − 75 = 825. Its frame is popped next.'],[5,[M0],'print(825)',['825']],[-1,[],'main returns: its frame is popped and the stack is empty.',['825']]];
const EX=EXR.map((x,i)=>({line:x[0],st:x[1].map(t=>{const p=t.split(' · ');return [p[0],p[1]||'']}),note:x[2],out:x[3]||[],calls:1+EXR.slice(0,i+1).filter(y=>y[1].length&&/running$/.test(y[1][y[1].length-1])).length,d:x[1].length,mx:Math.max(...EXR.slice(0,i+1).map(y=>y[1].length))}));
// ---------- no base case ----------
const nbw=()=>{const v=st.nb??0,K=10,fr=[];for(let i=0;i<Math.min(v,K);i++)fr.push(`sum(${3-i})`);
return `<div class="g" style="grid-template-columns:1.3fr 1fr"><div class="cd"><small>CALL STACK (top first)</small>${fr.length?[...fr].reverse().map((f,i)=>`<div class="card2" style="padding:8px 12px;margin:6px 0;${i==0&&v<K?'border-color:var(--ac)':'border-color:var(--rd)'}"><b>${f}</b> <span class="ex">waiting for sum(${+f.slice(4,-1)-1})</span></div>`).join(''):'<p>empty</p>'}</div><div class="cd"><small>CODE</small>${code(['function sum(N)','    ans = sum(N - 1)','    return ans + N'],v?1:-1)}</div></div><p class="ex">${!v?'There is no base case. Call sum(3) and see where it ends.':v>=K?'<b style="color:var(--rd)">Stack overflow:</b> the stack is full and the program crashes. Nothing ever told sum to stop at N = 0; it just kept going into negative numbers. (A real stack holds thousands of frames; we use 10 to keep the picture small.)':`sum(${4-v}) calls sum(${3-v}), which would call sum(${2-v})… we are ${v} frame${v>1?'s':''} deep and N is ${4-v}.`}</p>`+btn('nb',K,'Call sum(3)','Next call')};
// ---------- counting ----------
const cntw=(pk,kind,Ns,args,lab,items)=>{const n=Ns[st[pk]??0],S=TR(kind,args(n)),last=S[S.length-1],v=st[pk+'j']??0;const I=items(n,last);
return pick(pk,Ns.map(x=>lab+' = '+x))+I.slice(0,v).map(x=>`<div class="card2" style="padding:10px 14px;margin:8px 0"><small class="k">${x[0]}</small><br><b>${x[1]}</b><br><span class="ex">${x[2]}</span></div>`).join('')+btn(pk+'j',I.length,'Reveal the number of calls','Reveal next')};
const fibtab=()=>{const v=st.ft??0,rows=[];for(let n=1;n<=Math.min(v,10);n++){const S=TR('fib',[n]),l=S[S.length-1];rows.push([n,l.calls,2**n-1,l.mx])}
return `<div class="row" style="font-weight:700"><span>N</span><span>actual calls</span><span>2ᴺ − 1</span><span>deepest stack</span></div>`+rows.map(r=>`<div class="row"><span>${r[0]}</span><span><b>${r[1]}</b></span><span>${r[2]}</span><span>${r[3]}</span></div>`).join('')+`<p class="ex">${v?`fibonacci(${v}) makes <b>${rows[v-1][1]}</b> calls. The count roughly multiplies by 1.6 each time N grows by 1: exponential, so O(2ᴺ) is a valid upper bound. The stack never holds more than <b>${rows[v-1][3]}</b> frames at once.`:'Count the calls for N = 1, 2, 3 … one value at a time.'}</p>`+btn('ft',10,'Count for N = 1','Next N')};
const TABS=[

function bk(){if(S)S--;else if(T){T--;S=TABS[T].s.length-1}go()}
