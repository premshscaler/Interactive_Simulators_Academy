<style>

<header><div><small>INTERMEDIATE DSA · CLASS 4</small><h1>Prefix Sum, Carry Forward &amp; Subarrays</h1></div>
<button class="tg" id="tn" onclick="notes=!notes;go()"></button></header>
<nav id="tabs"></nav>
<div class="wrap"><aside id="side"></aside>
<section class="card"><div id="main"></div>
<div class="nav"><button class="ghost" id="bk" onclick="bk()">‹ Back</button><span>← → keys work too</span><button class="btn" id="nx" onclick="nx()">Next ›</button></div></section></div>
<script>
const $=s=>document.querySelector(s);let T=0,S=0,notes=true,rev={},st={};
const code=(l,h)=>'<pre class="code" style="margin:10px 0">'+l.map((x,i)=>`<span class="${i==h?'hl':''}"><i>${i+1}</i>${x}</span>`).join('')+'</pre>';
const cells=(a,m={},c={})=>`<div class="cells">${a.map((v,j)=>`<div class="cell ${c[j]||''}">${m[j]?`<u>${m[j]}</u>`:''}<b>${v}</b><small>[${j}]</small></div>`).join('')}</div>`;
const cards=a=>`<div class="g">${a.map(x=>`<div class="cd"><small>${x[0]}</small><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`;
const W=(h,n,r)=>({h,n,r}),info=(h,b,n)=>W(h,n,()=>b);
const think=(h,q,a,n)=>({h,n,th:1,r:k=>`<div class="think"><span class="tag">THINK FIRST</span><h3>${q}</h3><button class="btn" onclick="rev['${k}']=!rev['${k}'];go()">${rev[k]?'Hide':'Reveal'} the answer</button></div>`+(rev[k]?`<div class="ans"><small>ANSWER</small><p>${a}</p></div>`:'')});
const quiz=(h,q,c,o,ok,ex,n)=>W(h,n,k=>`<div class="card2"><small class="k">QUIZ</small><h3>${q}</h3>${c?code(c):''}<div class="opts">${o.map((t,i)=>`<button class="opt ${st[k]!=null?(i==ok?'good':i==st[k]?'bad':''):''}" onclick="st['${k}']=${i};go()"><b>${'ABCD'[i]}</b>${t}</button>`).join('')}</div>${st[k]!=null?`<p class="ex">${ex}</p>`:''}</div>`);
const sorter=(h,items,L,tail,n)=>W(h,n,k=>`<div class="card2">${items.map((t,i)=>{const v=st[k+i];return `<div class="row"><span>${t[0]}</span>${L.map((l,x)=>`<button class="opt sm ${v!=null&&x==t[1]?'good':v==x?'bad':''}" onclick="st['${k}${i}']=${x};go()">${l}</button>`).join('')}</div>`}).join('')}${items.every((_,i)=>st[k+i]!=null)?`<p class="ex"><b>${tail}</b></p>`:''}</div>`);
const set=(f,v)=>`${f};go()`;
const X=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n');
const ST=(t,s)=>(s.st=t,s);
const walk=(h,q,c,S_,ans)=>W(h,0,k=>{const v=st[k]??0;return `<div class="card2"><small class="k">WORK IT OUT</small><h3>${q}</h3>${c?code(X(c)):''}${S_.slice(0,v).map((s,i)=>`<div class="row"><span style="flex:0 0 26px"><b>${i+1}</b></span><span><b>${s[0]}</b><br>${s[1]}</span></div>`).join('')}${v>=S_.length?`<p class="ex"><b>Answer: ${ans}</b></p>`:''}<div class="bt"><button class="btn" ${v>=S_.length?'disabled':''} onclick="${set(`st['${k}']=(st['${k}']??0)+1`)}">${v?'Next step':'Show step 1'}</button><button class="ghost" onclick="${set(`st['${k}']=0`)}">Reset</button><span class="ex">${v} / ${S_.length}</span></div></div>`});
const sl=(k,min,max,d,l)=>`<label>${l} = <b>${st[k]??d}</b> <input type="range" min="${min}" max="${max}" value="${st[k]??d}" onchange="st.${k}=+this.value;go()"></label>`;
const A1=[-3,6,2,4,5,2,8,-9,3,1],QS=[[4,8],[3,7],[1,3],[0,4],[7,7]];
const PF=a=>a.reduce((r,x,i)=>(r.push((r[i-1]??0)+x),r),[]);
const qsel=k=>`<div class="bt">${QS.map((q,i)=>`<button class="${i==(st[k]??0)?'btn':'ghost'}" onclick="${set(`st.${k}=${i};st.${k}j=0`)}">L=${q[0]}, R=${q[1]}</button>`).join('')}</div>`;
const TABS=[
{t:'Why it matters',s:[
think('30 days of expenses','You have 30 days of expenses. People keep asking: total from day 5 to 18? Day 10 to 25? Day 1 to 30? Thousands of such questions. What do you do?','<b>Prepare once, answer each question instantly.</b> That is <b>prefix sum</b>. When the answer at a position depends on something we already saw, we <b>carry it forward</b>.','Take two ideas before revealing.'),
info('Today’s plan','<p>Both techniques turn repeated or nested work into a single pass.</p>'+cards([['Part 1','Range sum query','Brute force, then prefix sum'],['Part 2','Even-indexed sums','Prefix sum, with a twist'],['Part 3','ag pairs','Carry forward'],['Part 4','Subarrays','Definition and counting'],['Part 5','Print all subarrays','Triple loop, O(N³)'],['Part 6','AI prompting','RCTF for hints, not answers']]),'Say the two names out loud: prefix sum and carry forward.')]},
{t:'Range sum query',s:[
ST('ASK',think('Range sum queries','A = [-3, 6, 2, 4, 5, 2, 8, -9, 3, 1]. A query (4, 8) asks for the sum of A[4] to A[8]. What is it, and how would you answer thousands of such queries?','The sum is <b>9</b> (5 + 2 + 8 − 9 + 3). The simplest idea: for each query, loop from L to R and add.','Ask for the method before the number.')),
ST('BRUTE FORCE',W('Add it up for every query','Pick a query and add the elements one by one.',k=>{const [L,R]=QS[st.bq??0],j=st.bqj??0,len=R-L+1,sh=Math.min(j,len);let s=0;const c={};for(let x=0;x<sh;x++){s+=A1[L+x];c[L+x]='sw'}return qsel('bq')+cells(A1,{[L]:L==R?'L,R':'L',[R]:L==R?'L,R':'R'},c)+`<p class="ex">Added ${sh} of ${len} elements · running sum <b>${s}</b>. Cost of this query: <b>${len}</b> additions.</p><div class="bt"><button class="btn" ${sh>=len?'disabled':''} onclick="${set('st.bqj=(st.bqj??0)+1')}">Add next</button></div><p class="ex">Worst case every query spans the whole array: N·Q work, O(N·Q). For N = Q = 10⁵ that is <b>10¹⁰</b> steps → <b>TLE</b>.</p>`})),
ST('OBSERVE',think('The cricket scoreboard','Only the cumulative score after each over is shown: 2, 8, 14, 29, 31, 49, 65, 79, 88, 97. How many runs were scored in just the 7th over?','<b>65 − 49 = 16</b>: score after over 7 minus score after over 6.','Then ask for overs 6 to 10 and 3 to 6.')),
ST('OBSERVE',W('The scoreboard trick','Drag the over range. Every answer is one subtraction.',k=>{const S_=[2,8,14,29,31,49,65,79,88,97],a=st.ca??7,b=Math.max(a,st.cb??7),lo=a>1?S_[a-2]:0,c={};S_.forEach((_,i)=>{if(i+1>=a&&i+1<=b)c[i]='rg'});return cells(S_,{},c)+`<div class="bt">${sl('ca',1,10,7,'from over')}${sl('cb',1,10,7,'to over')}</div><p class="ex">Overs ${a} to ${b}: score[${b}] − ${a>1?'score['+(a-1)+']':'0'} = ${S_[b-1]} − ${lo} = <b>${S_[b-1]-lo}</b>. Same cost for any range.</p>`})),
ST('OBSERVE',think('Spot the repeat','pf[2] = A0 + A1 + A2 and pf[3] = A0 + A1 + A2 + A3. What is being added again and again?','Everything up to index 2 is recomputed. Instead <b>pf[3] = pf[2] + A[3]</b>: reuse the previous sum.','Point at the shared prefix.')),
ST('OPTIMIZE',W('Build the prefix array','pf[i] = pf[i-1] + A[i]. Step through, then compare the work.',k=>{const a=[2,5,-1,7,1],i=st.pb??0,p=PF(a);return `<p class="ex">A</p>`+cells(a,{[i]:'i'},{[i]:'sel'})+`<p class="ex">pf</p>`+cells(a.map((_,x)=>x<=i?p[x]:'·'),{},{[i]:'sw'})+code(['pf[0] = A[0]','for (i → 1 to N-1)','    pf[i] = pf[i-1] + A[i]'],i?2:0)+`<p class="ex">${i?`pf[${i}] = pf[${i-1}] + A[${i}] = ${p[i-1]} + ${a[i]} = <b>${p[i]}</b>.`:'pf[0] = A[0].'} Additions so far: reuse <b>${i}</b> vs recomputing from scratch <b>${i*(i+1)/2}</b>.</p><div class="bt"><button class="btn" ${i>=4?'disabled':''} onclick="${set('st.pb=(st.pb??0)+1')}">Next cell</button><button class="ghost" onclick="${set('st.pb=0')}">Reset</button></div>`})),
ST('OPTIMIZE',W('Answer a query in one subtraction','Step through: pf[R] covers 0 to R, pf[L−1] covers 0 to L−1, and the difference is exactly the range.',k=>{const [L,R]=QS[st.pq??0],g=st.pqj??0,p=PF(A1),pl=L?p[L-1]:0;const row=(lab,f)=>`<span class="l">${lab}</span>`+A1.map((_,i)=>f(i)).join('');const bar=(lab,lo,hi,c)=>row(lab,i=>`<i class="bn" style="${i>=lo&&i<=hi?`background:${c};border-style:solid`:''}"></i>`);let h=`<div class="pgw"><div class="pg">`+row('index',i=>`<span class="l" style="text-align:center">${i}</span>`)+row('A',i=>`<span class="c" style="${i>=L&&i<=R?'background:color-mix(in srgb,var(--ye) 35%,var(--cc));border-color:var(--ye)':''}">${A1[i]}</span>`)+row('pf',i=>`<span class="c" style="${g>=1&&i==R?'border-color:var(--ac);background:color-mix(in srgb,var(--ac) 30%,var(--cc))':''}${g>=2&&L&&i==L-1?'border-color:var(--gr);background:color-mix(in srgb,var(--gr) 30%,var(--cc))':''}">${p[i]}</span>`);if(g>=1)h+=bar('pf['+R+']',0,R,'var(--ac)');if(g>=2&&L)h+=bar('pf['+(L-1)+']',0,L-1,'var(--gr)');if(g>=3)h+=bar('answer',L,R,'var(--ye)');h+='</div></div>';const T_=['The yellow cells are the range we want. We need their sum.',`<b>pf[${R}] = ${p[R]}</b> is the sum of everything from index 0 to ${R}: the range <i>plus</i> everything before it.`,L?`<b>pf[${L-1}] = ${pl}</b> is the sum of everything before L (indices 0 to ${L-1}).`:'L = 0, so nothing lies before the range: treat pf[−1] as 0.',`Subtract: ${p[R]} − ${L?'('+pl+')':'0'} = <b>${p[R]-pl}</b>. The shared part cancels and exactly indices ${L} to ${R} remain.`];return qsel('pq')+h+`<p class="ex">${T_[g]}</p><div class="bt"><button class="btn" ${g>=3?'disabled':''} onclick="${set('st.pqj=(st.pqj??0)+1')}">${g?'Next':'Show pf[R]'}</button><button class="ghost" onclick="${set('st.pqj=0')}">Reset</button></div>`})),
ST('COMPARE',info('Brute force vs prefix sum','<p>Pay O(N) once, then every query is O(1).</p>'+cards([['BRUTE FORCE','Loop L to R each time','Time O(N·Q) · Space O(1)'],['PREFIX SUM','Build pf, then subtract','Time O(N+Q) · Space O(N)'],['IN PLACE','Overwrite A with its prefix sums','Time O(N+Q) · Space O(1) extra']])+'<p class="ex">At N = Q = 10⁵: about 10¹⁰ steps vs about 2 × 10⁵.</p>','Mention modifying the input array is a space optimisation.'))]},
{t:'Even-indexed sum',s:[
ST('ASK',think('Even-indexed range sum','A = {2, 3, 1, 6, 4, 5}. A query (s, e) asks for the sum of the <b>even-indexed</b> elements from s to e. Query (2, 5)? And how would you handle many queries?','Query (2, 5) = A[2] + A[4] = <b>5</b>. Loop and add even indexes: O(N·Q).','Ask for the answer to (0,4) and (3,3) as well: 7 and 0.')),
ST('BRUTE FORCE',W('Loop through a query, step by step','Pick a query and reveal one loop step at a time.',k=>{const a=[2,3,1,6,4,5],Qs=[[1,3],[2,5],[0,4],[3,3]],qi=st.eb??0,[s,e]=Qs[qi],n=e-s+1,j=Math.min(st.ebj??0,n);let sum=0;const log=[],c={};for(let x=0;x<j;x++){const i=s+x,ev=i%2==0;if(ev)sum+=a[i];if(ev)c[i]='sw';log.push(`<div class="row"><span style="flex:0 0 60px">i = ${i}</span><span>${ev?`even → add A[${i}] = ${a[i]}, sum = <b>${sum}</b>`:'odd → skip'}</span></div>`)}if(j<n)c[s+j]='sel';return `<div class="bt">${Qs.map((q,i)=>`<button class="${i==qi?'btn':'ghost'}" onclick="${set(`st.eb=${i};st.ebj=0`)}">(${q[0]}, ${q[1]})</button>`).join('')}</div>`+cells(a,j<n?{[s+j]:'i'}:{},c)+code(['sum = 0','for (i → s to e)','    if (i % 2 == 0) sum += A[i]'],j?2:0)+log.join('')+`<p class="ex">Steps used: <b>${j}</b> of ${n}${j>=n?` · answer <b>${sum}</b>`:''}. Every query repeats this scan: <b>O(N·Q)</b>.</p><div class="bt"><button class="btn" ${j>=n?'disabled':''} onclick="${set('st.ebj=(st.ebj??0)+1')}">${j?'Next step':'Start the loop'}</button><button class="ghost" onclick="${set('st.ebj=0')}">Reset</button></div>`})),
ST('OBSERVE',think('Which prefix sum?','Whenever you see range sums, think prefix sum. But should the prefix cover the entire array?','<b>No: only even-indexed elements.</b> Pretend odd-indexed elements are 0, then build the prefix sum as usual.','Let them suggest “treat odd as zero” first.')),
ST('OPTIMIZE',W('Prefix sum of even indices','Odd indices are crossed out (treated as 0). Step through PSe.',k=>{const a=[2,3,1,6,4,5],i=st.pe??0,e=[];a.forEach((v,x)=>e.push((e[x-1]??0)+(x%2?0:v)));const Qs=[[1,3],[2,5],[0,4],[3,3]];return cells(a.map((v,x)=>x%2?`<s>${v}</s>`:v),{[i]:'i'},{[i]:'sel'})+`<p class="ex">PSe</p>`+cells(a.map((_,x)=>x<=i?e[x]:'·'),{},{[i]:'sw'})+`<p class="ex">${i%2?`i = ${i} is odd: PSe[${i}] = PSe[${i-1}] = <b>${e[i]}</b>`:i?`i = ${i} is even: PSe[${i}] = PSe[${i-1}] + A[${i}] = ${e[i-1]} + ${a[i]} = <b>${e[i]}</b>`:'PSe[0] = A[0]'}.</p>`+(i>=5?`<p class="ex">Queries: ${Qs.map(([s,t])=>`(${s},${t}) → ${s?`PSe[${t}] − PSe[${s-1}] = ${e[t]} − ${e[s-1]}`:`PSe[${t}]`} = <b>${e[t]-(s?e[s-1]:0)}</b>`).join(' · ')}</p>`:'')+`<div class="bt"><button class="btn" ${i>=5?'disabled':''} onclick="${set('st.pe=(st.pe??0)+1')}">Next cell</button><button class="ghost" onclick="${set('st.pe=0')}">Reset</button></div>`})),
ST('OPTIMIZE',walk('Build PSe for a new array','Construct the even-index prefix sum of [2, 4, 3, 1, 5].',0,[['Index 0 (even)','PSe[0] = 2.'],['Index 1 (odd)','Copy: PSe[1] = PSe[0] = 2.'],['Index 2 (even)','PSe[2] = 2 + 3 = 5.'],['Index 3 (odd)','Copy: PSe[3] = 5.'],['Index 4 (even)','PSe[4] = 5 + 5 = 10.']],'2, 2, 5, 5, 10')),
ST('COMPARE',info('Brute force vs prefix sum','<p>Same idea as before, applied only to the elements we care about.</p>'+cards([['BRUTE FORCE','Scan s to e per query','Time O(N·Q) · Space O(1)'],['PSe','Build once, subtract per query','Time O(N+Q) · Space O(N)']])))]},
{t:'ag pairs',s:[
ST('ASK',think('Count ag pairs','Count pairs (i, j) with i &lt; j, s[i] = a and s[j] = g. For “abegag”, what is the count and which pairs are they?','<b>3 pairs</b>: (0,3), (0,5) and (4,5).','Let them find the pairs by hand.')),
ST('BRUTE FORCE',W('Check every a against every later g','Step through the nested loops. Each Next is one comparison.',k=>{const SS=['abegag','acgdgag','bcaggaag'],si=st.ab??0,s=SS[si],E=[];for(let i=0;i<s.length;i++)if(s[i]=='a')for(let j=i+1;j<s.length;j++)E.push([i,j,s[j]=='g']);const n=Math.min(st.abj??0,E.length),sh=E.slice(0,n),cur=sh.at(-1),pairs=sh.filter(e=>e[2]),c={};pairs.forEach(e=>{c[e[0]]='sw';c[e[1]]='sw'});if(cur){c[cur[0]]='sel';if(!cur[2])c[cur[1]]='sel'}return `<div class="bt">${SS.map((x,i)=>`<button class="${i==si?'btn':'ghost'}" onclick="${set(`st.ab=${i};st.abj=0`)}">${x}</button>`).join('')}</div>`+cells([...s],cur?{[cur[0]]:'a',[cur[1]]:'j'}:{},c)+code(['for (i → 0 to n-1)','  if s[i] == a:','    for (j → i+1 to n-1)','      if s[j] == g: result++'],cur?(cur[2]?3:2):0)+`<p class="ex">${cur?`a at index ${cur[0]}, checking j = ${cur[1]}: s[${cur[1]}] is “${s[cur[1]]}” → ${cur[2]?'<b>pair!</b>':'not a g'}`:'Press Start to begin with the first a.'}</p><p class="ex">Comparisons: <b>${n}</b> · pairs found: <b>${pairs.length}</b>${pairs.length?' → '+pairs.map(e=>`(${e[0]},${e[1]})`).join(' '):''}${n>=E.length&&n?`. Every a rescanned everything to its right: <b>O(n²)</b>.`:''}</p><div class="bt"><button class="btn" ${n>=E.length?'disabled':''} onclick="${set('st.abj=(st.abj??0)+1')}">${n?'Next comparison':'Start'}</button><button class="ghost" onclick="${set('st.abj=0')}">Reset</button></div>`})),
ST('OBSERVE',think('Flip the view','Instead of starting from each a, stand on a g. What do you need to know to add all the pairs that end there?','<b>How many a’s are to its left.</b> Keep that count while scanning and add it whenever you meet a g.','Say “carry the count forward”.')),
ST('OBSERVE',W('What does each g need?','Click every g. See which a’s lie to its left.',k=>{const s='acbagkagg',sel=st.ags,done=st.agc??(st.agc={}),c={};if(sel!=null){for(let x=0;x<sel;x++)if(s[x]=='a')c[x]='rg';c[sel]='sel'}const cnt=i=>[...s.slice(0,i)].filter(x=>x=='a').length,gs=[...s].map((x,i)=>x=='g'?i:-1).filter(i=>i>=0);return `<div class="cells">${[...s].map((ch,i)=>`<div class="cell ${c[i]||''}" style="${ch=='g'?'cursor:pointer;border-color:var(--ye)':'opacity:.7'}" ${ch=='g'?`onclick="${set(`st.ags=${i};st.agc[${i}]=1`)}"`:''}><b>${ch}</b><small>[${i}]</small></div>`).join('')}</div>`+(sel!=null?`<p class="ex">g at index ${sel}: the a’s to its left are at ${[...s.slice(0,sel)].map((x,i)=>x=='a'?i:-1).filter(i=>i>=0).join(', ')} → <b>${cnt(sel)}</b> pairs end here.</p>`:'<p class="ex">Yellow-bordered cells are the g’s. Click one.</p>')+(gs.every(i=>done[i])?`<p class="ex">Total = ${gs.map(cnt).join(' + ')} = <b>${gs.reduce((t,i)=>t+cnt(i),0)}</b>. No nested loop needed, only a running count of a’s.</p>`:`<p class="ex">g’s checked: ${gs.filter(i=>done[i]).length} of ${gs.length}</p>`)+`<div class="bt"><button class="ghost" onclick="${set('st.ags=null;st.agc={}')}">Reset</button></div>`})),
ST('OPTIMIZE',W('Carry the count of a forward','One pass over “acbagkagg”. Watch the two counters.',k=>{const s='acbagkagg',i=st.ag??-1,log=[];let ca=0,r=0;for(let x=0;x<=i;x++){if(s[x]=='a'){ca++;log.push(`index ${x}: a → count_a = ${ca}`)}else if(s[x]=='g'){r+=ca;log.push(`index ${x}: g → result += ${ca} → ${r}`)}else log.push(`index ${x}: “${s[x]}” → nothing`)}const ch=i>=0?s[i]:'',as=[...s.slice(0,i+1)].map((x,y)=>x=='a'?y:-1).filter(y=>y>=0),c={};as.forEach(y=>c[y]='rg');if(i>=0)c[i]='sel';let bf=0;for(let a=0;a<s.length;a++)if(s[a]=='a')bf+=s.length-1-a;return cells([...s],i>=0?{[i]:'i'}:{},c)+`<div class="g"><div class="cd"><small>count_a</small><h4>${ca}</h4><p>a’s seen so far${as.length?' (at '+as.join(', ')+')':''}</p></div><div class="cd"><small>result</small><h4>${r}</h4><p>pairs counted so far</p></div><div class="cd"><small>characters read</small><h4>${i+1} / ${s.length}</h4><p>one pass, no rescans</p></div></div>`+code(['for each character c in the string','    if c == a: count_a++','    else if c == g: result += count_a'],ch=='a'?1:ch=='g'?2:0)+log.slice(-4).map(l=>`<div class="row"><span>${l}</span></div>`).join('')+(i>=8?`<p class="ex"><b>Final: ${r} pairs in ${s.length} steps.</b> Brute force on this string needed ${bf} comparisons.</p>`:'')+`<div class="bt"><button class="btn" ${i>=8?'disabled':''} onclick="${set('st.ag=(st.ag??-1)+1')}">${i<0?'Start':'Next character'}</button><button class="ghost" onclick="${set('st.ag=-1')}">Reset</button></div>`})),
ST('COMPARE',info('Brute force vs carry forward','<p>Instead of looking back again and again, remember what matters.</p>'+cards([['BRUTE FORCE','Nested loops over a and g','Time O(n²) · Space O(1)'],['CARRY FORWARD','One pass, one counter','Time O(n) · Space O(1)']])+'<p class="ex">Carry forward turns many nested-loop solutions into single-pass ones.</p>'))]},
{t:'Subarrays',s:[
think('What is a subarray?','Which of {1,6,8}, {1,4}, {6,1,4,2} and {7,8,4} is a subarray of {2,4,1,6,-3,7,8,4}, and why?','Only <b>{7,8,4}</b>. {1,6,8} and {1,4} skip elements (not contiguous); {6,1,4,2} changes the order. A subarray is contiguous and keeps the original order. It can be named by (start, end) or (start, length).','Show 2 to 5 and “start 2, length 4” for {1,6,-3,7}.'),
walk('Count the subarrays','How many subarrays does [4, 2, 10, 3, 12, −2, 15] have?',0,[['Start at index 0','End can be 0, 1, …, 6: <b>7</b> subarrays.'],['Start at index 1','End can be 1, …, 6: <b>6</b> subarrays.'],['Pattern','Start at index i gives N − i subarrays. The last start gives 1.'],['Add up','7 + 6 + 5 + 4 + 3 + 2 + 1 = N(N+1)/2.']],'28 subarrays')]},
{t:'Print all subarrays',s:[
ST('ASK',think('Print every subarray','How would you print every subarray of [1, 2, 3]? How many loops do you need, and what does each one choose?','Three loops: one picks the <b>start</b> i, one picks the <b>end</b> j, one <b>prints</b> arr[i..j].','Let them list the six subarrays first.')),
ST('BRUTE FORCE',W('Print every subarray, one at a time','Each Next prints the next subarray. Watch i, j and the inner loop.',k=>{const n=st.sn??3,a=Array.from({length:n},(_,i)=>i+1),E=[];for(let i=0;i<n;i++)for(let j=i;j<n;j++)E.push([i,j]);const m=Math.min(st.sp??0,E.length),sh=E.slice(0,m),cur=sh.at(-1),pr=sh.reduce((t,e)=>t+e[1]-e[0]+1,0),c={};if(cur)for(let x=cur[0];x<=cur[1];x++)c[x]='sw';return `<div class="bt"><label>N = <b>${n}</b> <input type="range" min="2" max="5" value="${n}" onchange="st.sn=+this.value;st.sp=0;go()"></label></div>`+cells(a,cur?{[cur[0]]:'i',[cur[1]]:cur[0]==cur[1]?'i,j':'j'}:{},c)+code(['for (i → 0 to n-1)','  for (j → i to n-1)','    for (k → i to j) print(arr[k])'],cur?2:0)+`<p class="ex">${cur?`i = ${cur[0]}, j = ${cur[1]}: the k loop prints arr[${cur[0]}] to arr[${cur[1]}] → <b>[${a.slice(cur[0],cur[1]+1).join(', ')}]</b>`:'Press Start to print the first subarray.'}</p><div class="card2"><small class="k">OUTPUT SO FAR</small><p style="font-family:ui-monospace,monospace;margin:6px 0 0">${sh.map(e=>'['+a.slice(e[0],e[1]+1).join(', ')+']').join('<br>')||'–'}</p></div><p class="ex">Subarrays printed: <b>${m}</b> · elements printed: <b>${pr}</b>${m>=E.length?` · all ${E.length} subarrays done`:''}</p><div class="bt"><button class="btn" ${m>=E.length?'disabled':''} onclick="${set('st.sp=(st.sp??0)+1')}">${m?'Next subarray':'Start'}</button><button class="ghost" onclick="${set('st.sp=0')}">Reset</button></div>`})),
ST('OBSERVE',walk('Why is it N³?','Count the work done by the three loops.',0,[['Choose i and j','Pairs (i, j) with i ≤ j: about N²/2 subarrays.'],['Print each one','A subarray can hold up to N elements, so the k loop does up to N work.'],['Combine','Roughly N² subarrays × up to N elements each → <b>N³</b> work.'],['Exact count','Elements printed in total: N(N+1)(N+2)/6. For N = 3 that is 10.']],'O(N³) time, O(1) space')),
ST('COMPARE',info('Cost and what comes next','<p>Three nested loops: time <b>O(N³)</b>, space <b>O(1)</b>.</p><div class="card2"><b>Next question</b><p class="ex">How do you find the <b>sum of all subarrays</b> in O(N) instead of O(N³)? That is tonight’s homework prompt.</p></div>'))]},
{t:'AI prompting',s:[
think('The stuck moment','You solved three cricket examples by hand, brute force is too slow, and the optimization hasn’t clicked. Do you paste the problem into AI and ask for the solution?','You can ask, but <b>how you ask</b> decides what you learn. A full-code request teaches nothing; a well-aimed hint triggers the “aha”.','Show the bad and good prompt side by side.'),
sorter('Good prompt or weak prompt?',[['“Solve range sum queries and give me the full code.”',1],['“You are a DSA tutor. I tried brute force and it times out. Give me one hint, no code, in 3 bullets.”',0],['“Help me.”',1]],['Good prompt','Weak prompt'],'RCTF: Role, Context, Task, Format.','Ask them to point at R, C, T and F.'),
W('Build a prompt with RCTF','Switch the four ingredients on and off.',k=>{const p=st.rc??(st.rc={r:0,c:0,t:0,f:0}),P=[['r','Role','You are a patient DSA tutor.'],['c','Context','I’m a beginner stuck on range sums; brute force is too slow.'],['t','Task','Give me ONE hint and no code.'],['f','Format','Reply in 3 bullet points.']];return `<div class="bt">${P.map(x=>`<button class="${p[x[0]]?'btn':'ghost'}" onclick="${set('st.rc.'+x[0]+'=!st.rc.'+x[0])}">${x[0].toUpperCase()} · ${x[1]}</button>`).join('')}</div><div class="card2"><small class="k">YOUR PROMPT</small><p>${P.filter(x=>p[x[0]]).map(x=>x[2]).join(' ')||'Help me with range sums.'}</p></div><p class="ex">${P.every(x=>p[x[0]])?'<b>All four present.</b> Expect a targeted hint, not a code dump.':'Missing: <b>'+P.filter(x=>!p[x[0]]).map(x=>x[1]).join(', ')+'</b>. Expect a generic or over-long answer.'}</p>`}),
info('Homework prompt','<p>Ask AI: <mark>how do I compute the sum of all subarrays in O(N)?</mark> Fill in all four RCTF slots, ask for hints rather than the full solution, and share your prompt and its reply in the cohort channel.</p>','Tomorrow, read 2 or 3 of the best prompts aloud.')]},
{t:'Wrap-up',s:[
info('The takeaway','<p style="font-size:24px;font-weight:700;line-height:1.3">Prepare once, carry what you need forward, and stop re-adding what you already know.</p>'+cards([['Prefix sum','pf[R] − pf[L−1]','Build in O(N), query in O(1)'],['Even indexed','Odd treated as 0','Same prefix idea on a filtered array'],['Carry forward','Count a’s, add at each g','O(n²) becomes O(n)'],['Subarrays','N(N+1)/2 of them','Printing all is O(N³)']]),'Summarise quickly from this page.'),
info('Assignment','<p>Unlock the assignment and ask everyone to submit <mark>Range Sum Query</mark>.</p><div class="card2"><b>Live solution session</b><p class="ex">1. Ask for a volunteer.<br>2. Give screen-share permission: Settings › Admin › Unmuted Audience Can Share › Audio, Video and Screen.<br>3. Guide them through it and keep the class involved.</p></div>','Unlock via the question-mark button on the top bar.')]}
];
function go(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;
$('#tn').textContent='Instructor notes: '+(notes?'on':'off');
$('#tabs').innerHTML=TABS.map((x,i)=>`<button class="${i==T?'on':''}" onclick="T=${i};S=0;go()"><i>0${i}</i>${x.t}</button>`).join('');
$('#side').innerHTML=`<h3>${tb.t}</h3>`+tb.s.map((x,i)=>`<button class="${i==S?'on':''}" onclick="S=${i};go()"><span>${i+1}</span>${x.h}</button>`).join('');
$('#main').innerHTML=`<small class="k">${tb.t.toUpperCase()} · STEP ${S+1} OF ${tb.s.length}</small>${tb.s.every(x=>x.st)?`<div class="stg">${[...new Set(tb.s.map(x=>x.st))].map(g=>`<span class="${g==s.st?'on':''}">${g}</span>`).join('›')}</div>`:''}<h2>${s.h}</h2>${s.r(k)}${notes&&s.n?`<div class="ins"><small>INSTRUCTOR</small><p>${s.n}</p></div>`:''}`;
const last=S==tb.s.length-1,nt=TABS[T+1];
$('#nx').textContent=s.th&&!rev[k]?'Reveal the answer ›':last?(nt?'Next: '+nt.t+' ›':'Done'):'Next ›';
$('#nx').disabled=last&&!nt&&!(s.th&&!rev[k]);$('#bk').disabled=!T&&!S}
function nx(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;if(s.th&&!rev[k])rev[k]=1;else if(S<tb.s.length-1)S++;else if(T<TABS.length-1){T++;S=0}go()}
function bk(){if(S)S--;else if(T){T--;S=TABS[T].s.length-1}go()}
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')nx();if(e.key=='ArrowLeft')bk()});
go();
</script></body></html>
