<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intermediate DSA · Lab: TC, SC, Output &amp; Debugging</title>
<style>
:root,:root[data-theme=dark]{--bg:#0a0e1a;--cd:#151b2e;--bd:#2a3350;--tx:#e8ecf8;--mu:#8b95b5;--ac:#8b9cf8;--ye:#f5c84c;--gr:#5ed49a;--rd:#f07878;--cc:#0d1222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f6fc;--cd:#fff;--bd:#d5dbee;--tx:#171c30;--mu:#5b6586;--ac:#4a5ce0;--ye:#a67600;--gr:#17874f;--rd:#c23b3b;--cc:#eef1fa}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
body::before{content:"N² ≤ 10⁸ ?";position:fixed;right:-2%;bottom:2%;font:800 clamp(40px,9vw,120px) ui-monospace,Menlo,monospace;color:var(--tx);opacity:.035;white-space:nowrap;pointer-events:none}
header{max-width:1180px;margin:auto;padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header small{color:var(--mu);font:12px ui-monospace,Menlo,monospace}header h1{font-size:22px;margin:2px 0}
.tg{background:var(--cd);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:7px 14px;cursor:pointer;font:inherit}
#tabs{max-width:1180px;margin:10px auto 0;padding:0 20px;display:flex;overflow-x:auto;border-bottom:1px solid var(--bd)}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:12px 14px;font:600 15px inherit;cursor:pointer;white-space:nowrap}
#tabs button.on{color:var(--tx);border-color:var(--ac)}#tabs i{font:normal 12px ui-monospace,Menlo,monospace;opacity:.7;margin-right:4px}
.wrap{max-width:1180px;margin:22px auto;padding:0 20px;display:grid;grid-template-columns:260px 1fr;gap:28px}
#side h3{margin:0 0 12px;color:var(--mu)}#side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--mu);border-radius:10px;padding:9px;font:inherit;cursor:pointer}
#side button.on{background:var(--cd);border-color:var(--bd);color:var(--tx);font-weight:600}
#side span{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;font-size:12px}
#side .on span{background:var(--ac);color:#0a0e1a}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:26px 28px;min-width:0}
.k{color:var(--ac);font:12px ui-monospace,Menlo,monospace;letter-spacing:.06em}
h2{font-size:clamp(28px,4.4vw,44px);line-height:1.1;margin:6px 0 18px;letter-spacing:-.02em}
.think,.card2{border:2px solid var(--ac);border-radius:16px;padding:18px 20px;background:var(--cc);margin-bottom:14px}.card2{border:1px solid var(--bd)}
.tag{background:var(--ye);color:#1a1400;border-radius:6px;padding:2px 10px;font:700 12px ui-monospace,Menlo,monospace}
.think h3,.card2 h3{font-size:22px;margin:12px 0}
.btn{background:var(--ac);color:#0a0e1a;border:0;border-radius:10px;padding:10px 18px;font:700 15px inherit;cursor:pointer}.btn:disabled{opacity:.35;cursor:default}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer}.ghost:disabled{opacity:.35}
.ans{border-top:1px dashed var(--bd);padding-top:12px;margin:6px 0 14px}.ans small{color:var(--gr);font:700 12px ui-monospace,monospace}
.ins{border-top:1px dashed var(--bd);margin-top:18px;padding-top:12px;color:var(--mu)}.ins small{color:var(--ye);font:700 12px ui-monospace,monospace}.ins p{margin:4px 0 0}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--bd);margin-top:20px;padding-top:16px;color:var(--mu);font:13px ui-monospace,monospace}
.cells{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 26px}
.cell{position:relative;min-width:56px;padding:12px 8px 22px;text-align:center;border:2px solid var(--bd);border-radius:10px;background:var(--cc);cursor:default}
.cell b{font-size:20px}.cell small{position:absolute;bottom:3px;left:0;right:0;color:var(--mu);font-size:11px}
.cell u{position:absolute;top:-24px;left:0;right:0;text-decoration:none;color:var(--ye);font:700 13px ui-monospace,monospace}
.cell em{display:block;font:11px ui-monospace,monospace;color:var(--mu);margin-bottom:6px}
.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 20%,var(--cc))}.sw{border-color:var(--gr)}.rg{border-color:var(--ye)}.emp{border-style:dashed;opacity:.5}
.code{background:var(--cc);border-radius:12px;padding:12px 0;margin:10px 0;font:14px/1.7 ui-monospace,Menlo,monospace;overflow-x:auto}
.code span{display:block;padding:0 16px;white-space:pre}.code i{color:var(--mu);margin-right:14px;font-style:normal}.code .hl{background:color-mix(in srgb,var(--ac) 22%,transparent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:center;background:var(--cd);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:12px;font:600 15px inherit;cursor:pointer;text-align:left}
.opt b{background:var(--bd);border-radius:6px;padding:1px 8px;font-size:12px}.opt.good{border-color:var(--gr);background:color-mix(in srgb,var(--gr) 18%,var(--cd))}.opt.bad{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 18%,var(--cd))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bd)}.row span{flex:1 1 260px}.opt.sm{padding:6px 12px}
.ex{color:var(--mu);margin:10px 0}.ex b{color:var(--tx)}mark{background:var(--ye);color:#1a1400;padding:0 4px;border-radius:3px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}.cd{border:1px solid var(--bd);border-radius:14px;padding:14px;background:var(--cc)}
.cd small{color:var(--ac);font:12px ui-monospace,monospace}.cd h4{margin:4px 0;font-size:18px}.cd p{margin:0;color:var(--mu);font-size:14px}
.bt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}.bt label{color:var(--mu);font-size:14px}input[type=range]{accent-color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin:10px 0}.bars i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-width:4px}.bars i.big{background:var(--rd)}
@media(max-width:820px){.wrap{grid-template-columns:1fr}#side{display:flex;gap:6px;overflow-x:auto}#side h3{display:none}#side button{white-space:nowrap;width:auto}.card{padding:18px}}
:focus-visible{outline:2px solid var(--ye);outline-offset:2px}
</style></head><body>
<header><div><small>INTERMEDIATE DSA · CLASS 3</small><h1>Lab: TC, SC, Output &amp; Debugging</h1></div>
<button class="tg" id="tn" onclick="notes=!notes;go()"></button></header>
<nav id="tabs"></nav>
<div class="wrap"><aside id="side"></aside>
<section class="card"><div id="main"></div>
<div class="nav"><button class="ghost" id="bk" onclick="bk()">‹ Back</button><span>← → keys work too</span><button class="btn" id="nx" onclick="nx()">Next ›</button></div></section></div>
<script>
const $=s=>document.querySelector(s);let T=0,S=0,notes=true,rev={},st={};
const code=(l,h)=>'<pre class="code" style="margin:10px 0">'+l.map((x,i)=>`<span class="${i==h?'hl':''}"><i>${i+1}</i>${x}</span>`).join('')+'</pre>';
const cells=(a,m={},c={})=>`<div class="cells">${a.map((v,j)=>`<div class="cell ${c[j]||''}">${m[j]?`<u>${m[j]}</u>`:''}<b>${v}</b><small>[${j}]</small></div>`).join('')}</div>`;
const cards=a=>`<div class="g">${a.map(x=>`<div class="cd"><small>${x[0]}</small><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`;
const W=(h,n,r)=>({h,n,r}),info=(h,b,n)=>W(h,n,()=>b);
const think=(h,q,a,n)=>({h,n,th:1,r:k=>`<div class="think"><span class="tag">THINK FIRST</span><h3>${q}</h3><button class="btn" onclick="rev['${k}']=!rev['${k}'];go()">${rev[k]?'Hide':'Reveal'} the answer</button></div>`+(rev[k]?`<div class="ans"><small>ANSWER</small><p>${a}</p></div>`:'')});
const quiz=(h,q,c,o,ok,ex,n)=>W(h,n,k=>`<div class="card2"><small class="k">QUIZ</small><h3>${q}</h3>${c?code(c):''}<div class="opts">${o.map((t,i)=>`<button class="opt ${st[k]!=null?(i==ok?'good':i==st[k]?'bad':''):''}" onclick="st['${k}']=${i};go()"><b>${'ABCD'[i]}</b>${t}</button>`).join('')}</div>${st[k]!=null?`<p class="ex">${ex}</p>`:''}</div>`);
const sorter=(h,items,L,tail,n)=>W(h,n,k=>`<div class="card2">${items.map((t,i)=>{const v=st[k+i];return `<div class="row"><span>${t[0]}</span>${L.map((l,x)=>`<button class="opt sm ${v!=null&&x==t[1]?'good':v==x?'bad':''}" onclick="st['${k}${i}']=${x};go()">${l}</button>`).join('')}</div>`}).join('')}${items.every((_,i)=>st[k+i]!=null)?`<p class="ex"><b>${tail}</b></p>`:''}</div>`);
const set=(f,v)=>`${f};go()`;
const X=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n');
const Q=(h,q,c,o,ok,ex)=>quiz(h,q,c?X(c):0,o,ok,ex);
const CX=[['O(log N)',n=>Math.log10(Math.log2(n))],['O(N)',n=>Math.log10(n)],['O(N log N)',n=>Math.log10(n*Math.log2(n))],['O(N²)',n=>2*Math.log10(n)],['O(N³)',n=>3*Math.log10(n)],['O(2ᴺ)',n=>n*.30103],['O(N!)',n=>n*Math.log10(n/Math.E)+.5*Math.log10(2*Math.PI*n)]];
const fl=l=>l<6?Math.max(1,Math.round(10**l)).toLocaleString():'10^'+(l>1e5?l.toExponential(1):l.toFixed(1));
const NS=[10,20,100,1e3,1e4,1e5,1e6,1e8];
const AP=['Read the question and the constraints','Form an idea or logic','Verify the logic is correct','Sketch pseudocode and the loops','Work out the time complexity','Check feasibility: at most about 10⁷ to 10⁸ iterations','Feasible: code it. Too slow: go back to step 2'];
const EX=[['Constant','print("Hello")',n=>1,'O(1)','O(1)'],['Linear','for i in 1..N:\n  print(i)',n=>n,'O(N)','O(1)'],['Nested ×2','for i in 1..N:\n  for j in 1..N: print(i, j)\nfor i in 1..N:\n  for j in 1..N: print(i+1, j+1)',n=>2*n*n,'O(N²)','O(1)'],['Doubling','i = 1\nwhile i < N:\n  print(i)\n  i = i * 2',n=>Math.ceil(Math.log2(n)),'O(log N)','O(1)'],['Copy array','reversed = new int[N]\nfor i in 0..N-1:\n  reversed[i] = arr[N-1-i]',n=>n,'O(N)','O(N)'],['Triangle','for i in 0..N-1:\n  for j in 0..i: print(i+j)',n=>n*(n+1)/2,'O(N²)','O(1)'],['Fixed outer','for i in 1,2,4..100:\n  for j in 1..N: print(i+j)',n=>7*n,'O(N)','O(1)']];
const sl=(k,min,max,d,l)=>`<label>${l} = <b>${(st[k]??d).toLocaleString()}</b> <input type="range" min="${min}" max="${max}" value="${st[k]??d}" onchange="st.${k}=+this.value;go()"></label>`;
const walk=(h,q,c,S_,ans)=>W(h,0,k=>{const v=st[k]??0;return `<div class="card2"><small class="k">WORK IT OUT</small><h3>${q}</h3>${c?code(X(c)):''}${S_.slice(0,v).map((s,i)=>`<div class="row"><span style="flex:0 0 26px"><b>${i+1}</b></span><span><b>${s[0]}</b><br>${s[1]}</span></div>`).join('')}${v>=S_.length?`<p class="ex"><b>Answer: ${ans}</b></p>`:''}<div class="bt"><button class="btn" ${v>=S_.length?'disabled':''} onclick="${set(`st['${k}']=(st['${k}']??0)+1`)}">${v?'Next step':'Show step 1'}</button><button class="ghost" onclick="${set(`st['${k}']=0`)}">Reset</button><span class="ex">${v} / ${S_.length}</span></div></div>`});
const TABS=[
{t:'Why it matters',s:[
think('Passes samples, fails the judge','Your code passes every sample but gets <b>Time Limit Exceeded</b> on N = 10⁵. What went wrong?','The idea was never checked against the <b>constraints</b>. An O(N²) loop needs 10¹⁰ steps, far past the roughly 10⁸ a judge allows.','Take two guesses first.'),
info('Today’s plan','<p>A hands-on lab: read the constraints, estimate cost, then predict and debug.</p>'+cards([['Part 1','Constraints','What N allows'],['Part 2','Approach','Idea before code'],['Part 3','Space','Auxiliary space only'],['Part 4','Time','Count loops, simplify, rank'],['Part 5','Output prediction','Trace by hand'],['Part 6','Debugging','Logic bugs, not syntax']]),'Unlock all assignment problems and keep the live-tracking query open.')]},
{t:'Constraints',s:[
think('Does O(N²) pass?','Given 1 ≤ N ≤ 10⁵, will an O(N²) solution pass?','<b>No.</b> (10⁵)² = 10¹⁰ iterations. O(N log N) gives about 1.7 × 10⁶, which is fine.','Ask for the iteration count, not a yes or no.'),
W('The constraint ladder','Drag N and see which complexities fit in about 10⁸ iterations.',k=>{const i=st.ld??5,n=NS[i];return `<div class="bt"><label>N = <b>${n.toLocaleString()}</b> <input type="range" min="0" max="7" value="${i}" onchange="st.ld=+this.value;go()"></label></div><div class="card2">${CX.map(([nm,f])=>{const l=f(n);return `<div class="row"><span style="flex:0 0 110px"><b>${nm}</b></span><span style="flex:1 1 140px;font:14px ui-monospace,monospace">${fl(l)} iterations</span><span class="opt sm ${l<=8?'good':'bad'}" style="flex:none">${l<=8?'Passes':'TLE'}</span></div>`}).join('')}</div><p class="ex">At N ≤ 100 even N³ passes. At N ≤ 20 even 2ᴺ passes.</p>`}),
walk('Pick the algorithm','If 1 ≤ N ≤ 10⁵, which complexity can solve “do any two array elements match?”',0,[['Brute force','Compare every pair: N × N = (10⁵)² = 10¹⁰ steps.'],['Check the budget','A judge allows about 10⁸ steps, so 10¹⁰ is roughly 100 s → <b>TLE</b>.'],['Optimize','Sort first: equal numbers then sit side by side and one pass finds them. Sorting costs N log N.'],['Re-check','10⁵ × 17 ≈ 1.7 × 10⁶ steps, far under 10⁸ → passes.']],'O(N log N) passes. O(N²) and O(N³) do not.')]},
{t:'Approach',s:[
W('How to approach a problem','Walk the checklist. Step 6 decides whether you code or rethink.',k=>{const a=st.ap??0;return `<div class="card2">${AP.map((x,i)=>`<div class="row" style="${i==a?'color:var(--tx);font-weight:700':i<a?'color:var(--gr)':'color:var(--mu)'}"><span style="flex:0 0 26px">${i<a?'✓':i+1}</span><span>${x}</span></div>`).join('')}</div><div class="bt"><button class="btn" ${a>=6?'disabled':''} onclick="${set('st.ap=(st.ap??0)+1')}">Next step</button><button class="ghost" onclick="${set('st.ap=0')}">Reset</button></div>`},'In the worst case you can only afford 10⁷ or 10⁸ iterations.')]},
{t:'Space',s:[
think('What counts as space?','Which memory counts toward space complexity?','Only the <b>extra (auxiliary) space</b> your algorithm creates at its peak. The input, including <code>N</code> and a given <code>arr[]</code>, is not counted.','Mention Python needs no explicit types.'),
W('Count the bytes','Toggle the array and the matrix on and off, then drag N. The fixed variables always cost 16 B.',k=>{const p=st.sp??(st.sp={a:0,m:0}),n=st.sn??10,fx=16,A=p.a?4*n:0,M=p.m?8*n*n:0,b=fx+A+M;return code(X(`func(int N)           // input, not counted\n  int x;              // 4 B\n  int y;              // 4 B\n  long z;             // 8 B`+(p.a?'\n  int arr[N];         // 4·N B':'')+(p.m?'\n  long mat[N][N];     // 8·N·N B':'')))+`<div class="bt"><button class="${p.a?'btn':'ghost'}" onclick="${set('st.sp.a=!st.sp.a')}">int arr[N]</button><button class="${p.m?'btn':'ghost'}" onclick="${set('st.sp.m=!st.sp.m')}">long mat[N][N]</button></div><div class="bt" style="margin-top:14px">${sl('sn',1,200,10,'N')}</div><p class="ex">At N = ${n.toLocaleString()}: fixed ${fx} B${p.a?` + arr ${A.toLocaleString()} B`:''}${p.m?` + mat ${M.toLocaleString()} B`:''} = <b>${b.toLocaleString()} B</b></p><p class="ex">Space complexity: <b>${p.m?'O(N²)':p.a?'O(N)':'O(1)'}</b>${p.m?' (the matrix has N × N cells, so it dominates)':p.a?' (grows in step with N)':' (the same 16 B whatever N is)'}</p>`}),
walk('Add up arr[N]','What is the space complexity?',`func(int N) {\n  int fixed[10]; // 40 B\n  int x, y;    // 8 B\n  long z;      // 8 B\n  int arr[N];  // 4·N B\n}`,[['Fixed variables','40 + 8 + 8 = 56 B, a constant.'],['Size-dependent part','arr[N] takes 4·N bytes.'],['Add them','Total = 4N + 56 bytes.'],['Simplify','Drop the constant 56 and the coefficient 4.']],'O(N)'),
walk('Add up mat[N][N]','What is the space complexity?',`func(int N) {\n  int x = N, y = x * x;\n  long z = x + y;\n  int arr[N];      // 4·N B\n  long mat[N][N];  // 8·N·N B\n}`,[['Fixed variables','x, y, z take a constant amount.'],['arr[N]','4·N bytes.'],['mat[N][N]','A matrix with N rows and N columns: 8·N·N bytes.'],['Add and simplify','8N² + 4N + c: the N² term dominates.']],'O(N²)'),
info('Input vs auxiliary','<p>For <code>maxArr(arr, N)</code> the loop keeps one variable, <code>ans</code>. The array is given to us, so it is not ours to count.</p><div class="g"><div class="cd"><small>NOT COUNTED</small><h4>arr[], N</h4><p>Input space</p></div><div class="cd"><small>COUNTED</small><h4>ans</h4><p>Auxiliary space → <b>O(1)</b></p></div></div>'),
walk('Reverse: brute force to optimized','How can we reverse an array using the least extra space?',0,[['Brute force','Make reversed[N] and fill it from the back of arr: N extra cells → space O(N).'],['Observe','arr[i] and arr[N-1-i] just trade places.'],['Optimize','Swap those pairs inside arr with two pointers. One temp variable is enough.'],['Compare','Time is O(N) both ways. Space drops from O(N) to O(1).']],'Space O(N) → O(1)')]},
{t:'Count loops',s:[
W('Count the prints','Pick a snippet, drag N, predict TC and SC, then reveal.',k=>{const i=st.lx??0,e=EX[i],n=st.ln??8;return `<div class="bt">${EX.map((x,j)=>`<button class="${j==i?'btn':'ghost'}" onclick="st.lx=${j};st.lr=0;go()">${x[0]}</button>`).join('')}</div>${code(X(e[1]))}<div class="bt">${sl('ln',1,100,8,'N')}</div><p class="ex">The loop body runs <b>${Math.round(e[2](n)).toLocaleString()}</b> times at N = ${n}.</p><button class="ghost" onclick="st.lr=!st.lr;go()">${st.lr?'Hide':'Reveal'} TC and SC</button>${st.lr?`<p class="ex">Time <b>${e[3]}</b> · Space <b>${e[4]}</b></p>`:''}`}),
walk('Two loops over N and M','What is the time complexity?',`for i in 1..N:\n  if N mod i == 0: print i\nfor i in 1..M:\n  if M mod i == 0: print i`,[['First loop','Runs N times.'],['Second loop','Runs M times.'],['Combine','One after the other, so add: N + M.'],['Keep both','N and M are independent inputs, so neither can be dropped.']],'O(N + M), space O(1)'),
walk('Fixed loop','What is the time complexity?',`func(n):\n  s = 0\n  for i in 1..100: s = s + i\n  return s`,[['Count the iterations','i runs from 1 to 100: always 100 times.'],['Depends on n?','No. The loop never looks at n.'],['Observe','It always returns 5050.']],'O(1)'),
walk('Start at zero','What is the time complexity?',`s = 0; i = 0\nwhile i < n:\n  s = s + i\n  i = i * 2`,[['Iteration 1','i = 0, and 0 &lt; n is true. Then i = 0 × 2 = 0.'],['Iteration 2','i is still 0, so the same thing happens again.'],['Pattern','i never changes, so for n &gt; 0 the loop never ends.'],['Fix','Start at i = 1 and it becomes O(log n).']],'O(∞)'),
walk('Triangle loop','What is the time complexity?',`for i in 0..N-1:\n  for j in 0..i:\n    print(i + j)`,[['i = 0','The inner loop runs 1 time.'],['i = 1','The inner loop runs 2 times.'],['i = N−1','The inner loop runs N times.'],['Add up','1 + 2 + … + N = N(N+1)/2.'],['Simplify','Drop the ½ and the lower term → N².']],'O(N²)'),
walk('Doubling outer loop','What is the time complexity?',`for i in 1..100 step i * 2:\n  for j in 1..N:\n    print(i + j)`,[['Outer loop','i = 1, 2, 4, 8, 16, 32, 64: 7 iterations (128 is past 100).'],['Inner loop','Runs N times for each outer iteration.'],['Multiply','7 × N.'],['Simplify','7 is a constant → N. If the outer loop went up to N it would be N log N.']],'O(N)')]},
{t:'Simplify & rank',s:[
walk('Drop constants','An algorithm runs in 2n + 100. What is its Big-O?',0,[['Start','2n + 100'],['Drop the constant term','100 does not grow → 2n'],['Drop the coefficient','→ n']],'O(n)'),
walk('Drop lower terms','5n² + 3n + 500 simplifies to?',0,[['Find the dominant term','n² beats n and the constant.'],['Drop the rest','→ 5n²'],['Drop the coefficient','→ n²']],'O(n²)'),
walk('Mystery function','What is the overall Big-O?',`for i in 1..N:\n  for j in 1..N: result += 1\nfor i in 1..N: result += log(i)\nfor i in 1..2^N: result += 1`,[['Loop 1','N × N = N².'],['Loop 2','N.'],['Loop 3','2ᴺ.'],['Add','N² + N + 2ᴺ.'],['Keep the dominant term','2ᴺ beats N² for large N.']],'O(2ᴺ)'),
W('Growth race','Raise N and watch the ranking hold. Bars use a log scale.',k=>{const n=st.gw??10,R=[...CX,['O(Nᴺ)',x=>x*Math.log10(x)]].map(([a,f])=>[a,Math.max(0,f(n))]),m=Math.max(...R.map(r=>r[1]),1);return `<div class="bt">${sl('gw',2,40,10,'N')}</div>`+R.map(([a,l])=>`<div class="row"><span style="flex:0 0 100px"><b>${a}</b></span><div style="flex:1 1 140px;background:var(--cc);border-radius:6px;height:14px"><div style="width:${l/m*100}%;height:14px;border-radius:6px;background:var(--ac)"></div></div><span style="flex:0 0 120px;font:13px ui-monospace,monospace">${fl(l)}</span></div>`).join('')},'Graph images use different scales for visibility. Compare formulas, not pictures.'),
walk('Fastest growth','Which complexity grows the fastest: log N, N, N log N or N!?',0,[['List the ladder','1 &lt; log N &lt; N &lt; N log N &lt; N² &lt; 2ᴺ &lt; N!'],['Test at N = 10','log N ≈ 3, N = 10, N log N ≈ 33, 2ᴺ = 1,024, N! = 3,628,800.'],['Pick the biggest','N! pulls far ahead.']],'O(N!)'),
walk('Rank four functions','Put f1 = n!, f2 = 2ⁿ, f3 = nⁿ, f4 = log n in increasing order.',0,[['Evaluate at n = 10','log n ≈ 3, 2ⁿ = 1,024, n! ≈ 3.6 × 10⁶, nⁿ = 10¹⁰.'],['Order them','log n &lt; 2ⁿ &lt; n! &lt; nⁿ.']],'f4, f2, f1, f3'),
walk('Rank four loops','Rank the time complexity of f1 to f4, smallest first.',`f1: for i in 1..n: j=1; while j<n: j*=2\nf2: for i in 1..n: result *= 2\nf3: for i in 1..n: for j in 1..n: result *= n\nf4: i=1; while i<=n: i*=2`,[['f4','i doubles each time → log n.'],['f2','One loop of n → n.'],['f1','n × an inner doubling loop (log n) → n log n.'],['f3','n × n → n².'],['Order','log n &lt; n &lt; n log n &lt; n².']],'f4, f2, f1, f3')]},
{t:'Output prediction',s:[
think('Call order','fun1 prints “Start”, calls fun2, then prints “End”. fun2 prints “Inside fun2”. What is the output?','<b>Start, Inside fun2, End.</b> fun2 finishes completely before fun1 continues.','Have them write it before revealing.'),
W('Trace the loop','Step through x = 10, x -= 2, skip when x % 3 == 0.',k=>{let x=10;const r=[];for(let i=1;i<=5;i++){x-=2;r.push([i,x,x%3,x%3==0])}const s=st.tx??0;return code(X(`x = 10\nfor i in 1..5:\n  x -= 2\n  if x % 3 == 0: continue\n  print(x)`))+r.slice(0,s).map(a=>`<div class="row"><span style="flex:0 0 50px">i=${a[0]}</span><span style="flex:0 0 70px">x=${a[1]}</span><span style="flex:0 0 90px">x%3=${a[2]}</span><span>${a[3]?'continue (skipped)':'prints '+a[1]}</span></div>`).join('')+`<p class="ex">Output: <b>${r.slice(0,s).filter(a=>!a[3]).map(a=>a[1]).join('  ')||'–'}</b></p><div class="bt"><button class="btn" ${s>=5?'disabled':''} onclick="${set('st.tx=(st.tx??0)+1')}">Next iteration</button><button class="ghost" onclick="${set('st.tx=0')}">Reset</button></div>`}),
walk('Two conditions','What is printed?',`for i in 1..4:\n  if i % 2 == 0 && i * 2 < 7:\n    print(i)`,[['i = 1','Odd, so the first condition fails → skip.'],['i = 2','Even ✓ and 2 × 2 = 4 &lt; 7 ✓ → print 2.'],['i = 3','Odd → skip.'],['i = 4','Even ✓ but 4 × 2 = 8 &lt; 7 ✗ → skip.']],'2'),
walk('Nested loops','What is printed?',`for i in 1..3:\n  for j in 3 down to 1:\n    print(i + "," + j + " ")\n  newline`,[['i = 1','j counts 3, 2, 1 → “1,3 1,2 1,1”.'],['i = 2','“2,3 2,2 2,1”.'],['i = 3','“3,3 3,2 3,1”.']],'Three rows; j counts down in each')]},
{t:'Debugging',s:[
think('Infinite loop','<code>i = 1; while i < 10: print(i)</code>. What is wrong, and how do you fix it?','<b>i never changes</b>, so the condition stays true forever. Add <code>i = i + 1</code> inside the loop.','Quizzes here have logic bugs only, never syntax errors.'),
think('Undefined variable','<code>print(x)</code> comes before <code>x = 10</code>. What is wrong?','<b>x is used before it exists.</b> Declare and assign it before use.'),
W('Off by one','Flip the condition and step through a 4-element array.',k=>{const o=st.ob??(st.ob={c:'<=',i:0}),a=[10,20,30,40],bad=o.i>=4;return code(X(`for (i = 0; i ${o.c} arr.length; i++)\n  print(arr[i])`),0)+(bad?`<p class="ex" style="color:${o.c=='<='?'var(--rd)':'var(--gr)'}"><b>${o.c=='<='?'arr[4] does not exist → ArrayIndexOutOfBounds.':'4 < 4 is false → loop ends cleanly. Printed 0..3.'}</b></p>`:cells(a,{[o.i]:'i'},{[o.i]:'sel'}))+`<div class="bt"><button class="btn" ${bad?'disabled':''} onclick="${set('st.ob.i++')}">Step</button><button class="ghost" onclick="${set("st.ob={c:'<',i:0}")}">Use &lt;</button><button class="ghost" onclick="${set("st.ob={c:'<=',i:0}")}">Use &lt;=</button></div><p class="ex">Valid indices are 0 to length − 1. For length = 4, <code>i &lt;= arr.length</code> makes 5 accesses (indices 0 to 4) and the last one, arr[4], fails.</p>`}),
walk('i != 10','What happens?',`for (int i = 1; i != 10; i += 2)\n  print(i);`,[['Trace','i = 1, 3, 5, 7, 9, 11, 13 …'],['Check the stop test','i is always odd, so it never equals 10.'],['Fix','Use i &lt; 10.']],'Runs indefinitely'),
walk('No update','What is the issue?',`int i = 1;\nwhile (i < 5)\n  print(i);`,[['Trace','i = 1, print 1, check 1 &lt; 5 …'],['Spot it','Nothing changes i, so the test stays true.'],['Fix','Add i++ inside the loop.']],'The loop runs infinitely'),
walk('Uninitialised sum','What is the issue?',`int sum;\nfor (int i = 1; i <= 5; i++)\n  sum += i;\nprint(sum);`,[['Before the loop','sum has no value yet.'],['First iteration','sum += 1 reads that missing value.'],['Fix','int sum = 0 → result 15.']],'sum is not initialised'),
walk('Array out of bounds','What is the output?',`int[] arr = {1, 2, 3, 4};\nfor (int i = 0; i <= arr.length; i++)\n  print(arr[i]);`,[['Valid indices','4 elements: 0, 1, 2, 3.'],['The loop','i &lt;= arr.length lets i reach 4.'],['Failure','arr[4] does not exist. Fix: i &lt; arr.length.']],'ArrayIndexOutOfBoundsException'),
walk('Is it a bug?','What issue exists?',`for (int i = 2; i <= 10; i += 2)\n  print(i);`,[['Trace','i = 2, 4, 6, 8, 10.'],['Check the bound','10 &lt;= 10, so 10 prints; 12 stops it.'],['Verdict','Every step is as intended.']],'No error: not every snippet has a bug'),
walk('Wrong direction','What issue exists?',`for (int i = 10; i > 0; i++)\n  print(i);`,[['Trace','i = 10, 11, 12 … it grows.'],['Check the test','i &gt; 0 stays true forever.'],['Fix','Use i-- to count down.']],'Missing decrement: infinite loop'),
walk('Starting at length','What issue exists?',`int[] arr = {5, 10, 15, 20};\nfor (int i = arr.length; i >= 0; i--)\n  print(arr[i]);`,[['Indices','Valid indices are 0 to 3.'],['First iteration','i = arr.length = 4 → arr[4].'],['Failure','Out of bounds right away. Fix: start at arr.length − 1.']],'It starts out of bounds')]},
{t:'Wrap-up',s:[
info('The takeaway','<p style="font-size:24px;font-weight:700;line-height:1.3">Read the constraints, estimate the cost, then trace before you trust.</p>'+cards([['Constraints','N decides the algorithm','About 10⁸ iterations is the budget'],['Time','Count, drop, rank','Loops in a row add, nested multiply'],['Space','Extra memory only','Input is not counted'],['Debug','Check the loop','Update, initialise, bounds']]),'Summarise quickly from this page.'),
info('Lab housekeeping','<div class="card2"><b>Before the lab</b><p class="ex">Unlock every assignment problem and keep the live class-performance query open to track who is solving what.</p></div>','Learners work through the assignments while you monitor.')]}
];
function go(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;
$('#tn').textContent='Instructor notes: '+(notes?'on':'off');
$('#tabs').innerHTML=TABS.map((x,i)=>`<button class="${i==T?'on':''}" onclick="T=${i};S=0;go()"><i>0${i}</i>${x.t}</button>`).join('');
$('#side').innerHTML=`<h3>${tb.t}</h3>`+tb.s.map((x,i)=>`<button class="${i==S?'on':''}" onclick="S=${i};go()"><span>${i+1}</span>${x.h}</button>`).join('');
$('#main').innerHTML=`<small class="k">${tb.t.toUpperCase()} · STEP ${S+1} OF ${tb.s.length}</small><h2>${s.h}</h2>${s.r(k)}${notes&&s.n?`<div class="ins"><small>INSTRUCTOR</small><p>${s.n}</p></div>`:''}`;
const last=S==tb.s.length-1,nt=TABS[T+1];
$('#nx').textContent=s.th&&!rev[k]?'Reveal the answer ›':last?(nt?'Next: '+nt.t+' ›':'Done'):'Next ›';
$('#nx').disabled=last&&!nt&&!(s.th&&!rev[k]);$('#bk').disabled=!T&&!S}
function nx(){const tb=TABS[T],s=tb.s[S],k=T+'_'+S;if(s.th&&!rev[k])rev[k]=1;else if(S<tb.s.length-1)S++;else if(T<TABS.length-1){T++;S=0}go()}
function bk(){if(S)S--;else if(T){T--;S=TABS[T].s.length-1}go()}
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')nx();if(e.key=='ArrowLeft')bk()});
go();
</script></body></html>
